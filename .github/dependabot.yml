version: 2

updates:
  # ─────────────────────────────────────────────────────────────
  # JavaScript / TypeScript / pnpm workspace
  # ─────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Europe/Madrid"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"

    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "type:dependency"
      - "area:frontend"

    groups:
      astro-ecosystem:
        patterns:
          - "astro"
          - "@astrojs/*"
        update-types:
          - "minor"
          - "patch"

      vue-ecosystem:
        patterns:
          - "vue"
          - "@vue/*"
          - "vue-*"
          - "pinia"
          - "vue-router"
        update-types:
          - "minor"
          - "patch"

      vite-vitest-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

      tailwind-ecosystem:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"

      npm-dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      npm-production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─────────────────────────────────────────────────────────────
  # Gradle / Kotlin / Spring
  # ─────────────────────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "00:00"
      timezone: "Europe/Madrid"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"

    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "type:dependency"
      - "area:backend"

    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.security:*"
          - "org.springframework:*"
        update-types:
          - "minor"
          - "patch"

      spring-modulith:
        patterns:
          - "org.springframework.modulith:*"
        update-types:
          - "minor"
          - "patch"

      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlinx:*"
        update-types:
          - "minor"
          - "patch"

      testing:
        patterns:
          - "org.junit*:*"
          - "io.mockk:*"
          - "io.kotest:*"
          - "org.testcontainers:*"
          - "io.cucumber:*"
          - "com.tngtech.archunit:*"
        update-types:
          - "minor"
          - "patch"

      gradle-plugins:
        patterns:
          - "dev.detekt:*"
          - "com.diffplug.spotless:*"
          - "org.owasp:*"
          - "org.jetbrains.kotlinx:kover-*"
        update-types:
          - "minor"
          - "patch"

      backend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─────────────────────────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "Europe/Madrid"

    open-pull-requests-limit: 5
    rebase-strategy: "auto"

    cooldown:
      default-days: 7

    commit-message:
      prefix: "ci"
      include: "scope"

    labels:
      - "type:dependency"
      - "area:ci"

    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

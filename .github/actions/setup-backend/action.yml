name: Setup Backend
description: >
  Install Java and configure Gradle for the Kotlin backend.
  Reusable composite action for all backend jobs.

inputs:
  java-version:
    description: Java version (Eclipse Temurin)
    default: '25'

runs:
  using: composite
  steps:
    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

name: Setup Backend
description: >
  Install Java and configure Gradle for the Kotlin backend.
  Reusable composite action for all backend jobs.

inputs:
  java-version:
    description: Java version (Eclipse Temurin)
    default: '25'

runs:
  using: composite
  steps:
    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

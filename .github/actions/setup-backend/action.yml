name: Setup Backend
description: >
  Install Java and configure Gradle for the Kotlin backend.
  Reusable composite action for all backend jobs.

inputs:
  java-version:
    description: Java version (Eclipse Temurin)
    default: '21'

runs:
  using: composite
  steps:
    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

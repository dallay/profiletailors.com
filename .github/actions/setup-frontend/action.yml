name: Setup Frontend
description: >
  Install Node.js, pnpm, and project dependencies.
  Reusable composite action for all frontend jobs.

inputs:
  node-version:
    description: Node.js version
    default: '22'
  install-playwright:
    description: Install Playwright browsers after deps
    default: 'false'
  playwright-browsers:
    description: Which browsers to install (e.g. "chromium firefox webkit")
    default: 'chromium'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6.0.0+

    - name: Install project dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      if: inputs.install-playwright == 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: pnpm --filter app exec playwright install --with-deps $PLAYWRIGHT_BROWSERS

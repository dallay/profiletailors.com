name: Setup Frontend
description: >
  Install Node.js, pnpm, and project dependencies.
  Reusable composite action for all frontend jobs.

inputs:
  node-version:
    description: Node.js version
    default: '22'
  install-playwright:
    description: Install Playwright browsers after deps
    default: 'false'
  playwright-browsers:
    description: Which browsers to install (e.g. "chromium firefox webkit")
    default: 'chromium'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install project dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      if: inputs.install-playwright == 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: pnpm --filter app exec playwright install --with-deps $PLAYWRIGHT_BROWSERS

name: Security PR

on:
  pull_request:
    # Run security validation for every stacked PR layer, not only the layer
    # whose base is main.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: security-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: security / changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.derive.outputs.backend }}
      frontend: ${{ steps.derive.outputs.frontend }}
      repo_security: ${{ steps.derive.outputs.repo_security }}
      docs_only: ${{ steps.derive.outputs.docs_only }}
      backend_files: ${{ steps.derive.outputs.backend_files }}
      frontend_files: ${{ steps.derive.outputs.frontend_files }}
      repo_security_files: ${{ steps.derive.outputs.repo_security_files }}
    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          list-files: shell
          filters: |
            backend:
              - 'server/smp/**'
              - 'shared/**'
              - 'server/smp/gradlew'
              - 'server/smp/build.gradle.kts'
              - 'server/smp/settings.gradle.kts'
              - 'shared/**/build.gradle.kts'
              - '.github/codeql/**'
              - '.semgrep/**'
              - '.gitleaks.toml'
              - '.trivyignore'
              - 'sonar-project.properties'
            frontend:
              - 'apps/web/marketing/**'
              - 'apps/web/app/**'
              - 'pnpm-lock.yaml'
              - '.semgrep/**'
              - '.gitleaks.toml'
              - '.trivyignore'
              - 'sonar-project.properties'
            repo_security:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/codeql/**'
              - '.semgrep/**'
              - '.gitleaks.toml'
              - '.trivyignore'
              - 'sonar-project.properties'
              - '**/gradle-wrapper.properties'
              - '**/build.gradle.kts'
              - '**/settings.gradle.kts'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              - '**/package-lock.json'
              - '**/yarn.lock'
            docs_content:
              - 'docs/**'
              - 'openspec/**'
              - '**/*.md'
      - name: Derive workflow outputs
        id: derive
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          REPO_SECURITY: ${{ steps.filter.outputs.repo_security }}
          DOCS_CONTENT: ${{ steps.filter.outputs.docs_content }}
          BACKEND_FILES: ${{ steps.filter.outputs.backend_files }}
          FRONTEND_FILES: ${{ steps.filter.outputs.frontend_files }}
          REPO_SECURITY_FILES: ${{ steps.filter.outputs.repo_security_files }}
        run: |
          # Nullglob equivalent: treat empty vars as placeholder to avoid empty heredoc EOF
          _backend_files="${BACKEND_FILES:-NONE}"
          _frontend_files="${FRONTEND_FILES:-NONE}"
          _repo_security_files="${REPO_SECURITY_FILES:-NONE}"

          docs_only=false
          if [[ "$DOCS_CONTENT" == 'true' && "$BACKEND" != 'true' && "$FRONTEND" != 'true' && "$REPO_SECURITY" != 'true' ]]; then
            docs_only=true
          fi

          {
            echo "backend=$BACKEND"
            echo "frontend=$FRONTEND"
            echo "repo_security=$REPO_SECURITY"
            echo "docs_only=$docs_only"
            echo "backend_files<<EOF"
            printf '%s\n' "${_backend_files}"
            echo "EOF"
            echo "frontend_files<<EOF"
            printf '%s\n' "${_frontend_files}"
            echo "EOF"
            echo "repo_security_files<<EOF"
            printf '%s\n' "${_repo_security_files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Path classification'
            echo "- backend: $BACKEND"
            echo "- frontend: $FRONTEND"
            echo "- repo_security: $REPO_SECURITY"
            echo "- docs_only: $docs_only"
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks-pr:
    name: security / gitleaks-pr
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks on the pull request diff
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_EXTRA_ARGS: --log-opts="origin/${{ github.base_ref }}...HEAD"
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only required for Organizations, not personal accounts.
      - name: Explain native reporting channel
        if: ${{ always() }}
        run: |
          {
            echo '### Gitleaks reporting'
            echo '- Findings appear through the gitleaks-action native logs, annotations, and uploaded artifact in this PR lane.'
            echo '- This workflow does not force a separate SARIF path for Gitleaks because the maintained action already provides the documented native artifact channel for this setup.'
          } >> "$GITHUB_STEP_SUMMARY"

  semgrep-backend:
    name: security / semgrep-backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.repo_security == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Semgrep CLI
        run: python3 -m pip install --disable-pip-version-check semgrep==1.126.0
      - name: Run Semgrep for backend and repo security scope
        run: |
          semgrep scan \
            --config .semgrep/config.yml \
            --include server/smp/** \
            --include shared/** \
            --include .github/workflows/** \
            --include .github/codeql/** \
            --include .semgrep/** \
            --include .gitleaks.toml \
            --include .trivyignore \
            --include sonar-project.properties \
            --sarif \
            --output semgrep-backend.sarif || true

          test -f semgrep-backend.sarif
      - name: Upload Semgrep backend SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: semgrep-backend.sarif
          category: semgrep-backend

  semgrep-frontend:
    name: security / semgrep-frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.repo_security == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Semgrep CLI
        run: python3 -m pip install --disable-pip-version-check semgrep==1.126.0
      - name: Run Semgrep for frontend and repo security scope
        run: |
          semgrep scan \
            --config .semgrep/config.yml \
            --include apps/web/marketing/** \
            --include .github/workflows/** \
            --include .semgrep/** \
            --include .gitleaks.toml \
            --include .trivyignore \
            --include sonar-project.properties \
            --sarif \
            --output semgrep-frontend.sarif || true

          test -f semgrep-frontend.sarif
      - name: Upload Semgrep frontend SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: semgrep-frontend.sarif
          category: semgrep-frontend

  codeql-backend:
    name: security / codeql-backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.repo_security == 'true' }}
    runs-on: ubuntu-latest
    env:
      SMP_DB_TEST_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
      SMP_LOCAL_JWT_DEV_FALLBACK: ${{ secrets.SMP_LOCAL_JWT_SECRET }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: java-kotlin
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: manual
      - name: Build backend for CodeQL extraction
        run: >-
          ./gradlew build
          -x test
          -x postgresIntegrationTest
          -x bddPostgresTest
          -x bddFastTest
          --no-daemon
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: codeql-backend

  trivy-backend:
    name: security / trivy-backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.repo_security == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.71.1"
          ARTIFACT="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          EXPECTED_SHA="3cbae37cd440cd8676e5ce9207fe460b5641c7579a17e9d00f8894928c41a88d"
          curl --fail --silent --show-error --location --proto =https \
            -o "${ARTIFACT}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ARTIFACT}"
          ACTUAL_SHA=$(sha256sum "${ARTIFACT}" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::SHA256 mismatch for ${ARTIFACT}: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi
          tar -xzf "${ARTIFACT}" trivy
          sudo mv trivy /usr/local/bin/trivy
          rm -f "${ARTIFACT}"
          trivy --version
      - name: Run Trivy vulnerability scan
        run: |
          trivy fs \
            --format sarif \
            --output trivy-backend.sarif \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --no-progress \
            .
      - name: Verify SARIF file exists
        if: ${{ always() }}
        run: |
          if [ -f trivy-backend.sarif ]; then
            echo "Trivy SARIF file is present:"
            ls -lh trivy-backend.sarif
          else
            echo "::error::Trivy did not produce a SARIF file — failing to avoid masking scan failures as zero-finding reports."
            exit 1
          fi
      - name: Upload Trivy SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  frontend-biome-security:
    name: security / frontend-biome-security
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.repo_security == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run Biome CI check
        run: cd apps/web && pnpm biome ci .

  summary:
    name: security / summary
    needs:
      - changes
      - gitleaks-pr
      - semgrep-backend
      - semgrep-frontend
      - codeql-backend
      - trivy-backend
      - frontend-biome-security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize PR security lane
        env:
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          REPO_SECURITY: ${{ needs.changes.outputs.repo_security }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          GITLEAKS_RESULT: ${{ needs.gitleaks-pr.result }}
          SEMGREP_BACKEND_RESULT: ${{ needs.semgrep-backend.result }}
          SEMGREP_FRONTEND_RESULT: ${{ needs.semgrep-frontend.result }}
          CODEQL_RESULT: ${{ needs.codeql-backend.result }}
          TRIVY_RESULT: ${{ needs.trivy-backend.result }}
          BIOME_RESULT: ${{ needs.frontend-biome-security.result }}
        run: |
          {
            echo '## PR security summary'
            echo ''
            echo '### Path classifier'
            echo "- backend: $BACKEND"
            echo "- frontend: $FRONTEND"
            echo "- repo_security: $REPO_SECURITY"
            echo "- docs_only: $DOCS_ONLY"
            echo ''
            echo '### Job results'
            echo "- gitleaks-pr: $GITLEAKS_RESULT"
            echo "- semgrep-backend: $SEMGREP_BACKEND_RESULT"
            echo "- semgrep-frontend: $SEMGREP_FRONTEND_RESULT"
            echo "- codeql-backend: $CODEQL_RESULT"
            echo "- trivy-backend: $TRIVY_RESULT"
            echo "- frontend-biome-security: $BIOME_RESULT"
            echo ''
            echo '### Findings channels'
            echo '- CodeQL: GitHub code scanning.'
            echo '- Semgrep backend/frontend: GitHub code scanning via uploaded SARIF.'
            echo '- Trivy backend: GitHub code scanning via uploaded SARIF.'
            echo '- Gitleaks: native workflow logs, annotations, and uploaded artifact in this PR lane.'
            echo '- Frontend Biome: workflow logs and annotations.'
            echo '- Sonar: handled by the dedicated SonarQube Analysis workflow.'
            echo ''
            echo 'Skipped jobs are non-applicable when the path classifier keeps them out of scope.'
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$GITLEAKS_RESULT" \
            "$SEMGREP_BACKEND_RESULT" \
            "$SEMGREP_FRONTEND_RESULT" \
            "$CODEQL_RESULT" \
            "$TRIVY_RESULT" \
            "$BIOME_RESULT"; do
            if [[ "$result" != 'success' && "$result" != 'skipped' ]]; then
              echo "::error::At least one applicable security check did not pass."
              exit 1
            fi
          done

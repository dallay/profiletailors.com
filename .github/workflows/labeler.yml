name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: dallay/common-actions/.github/workflows/pr-labeler.yml@6548f0dfaad9e40648cd56e85566e5bc2d707dfb # v2.2.2
    with:
      configuration-path: .github/labeler.yaml

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: dallay/common-actions/.github/workflows/pr-labeler.yml@8aaf32edb1b70941a3f8889b47af1a7fd47e3a2c # v2.2.1
    with:
      configuration-path: .github/labeler.yaml

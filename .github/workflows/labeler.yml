name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: dallay/common-actions/.github/workflows/pr-labeler.yml@5efa6a4c8865caf90a607cc5d5232564312048fd # v2.3.0
    with:
      configuration-path: .github/labeler.yaml

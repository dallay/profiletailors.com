name: Security Deep

on:
  schedule:
    - cron: '17 3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: security-deep-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  gitleaks-history:
    name: security / gitleaks-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        run: |
          set -euo pipefail
          VERSION=v8.28.0
          ARTIFACT="gitleaks_8.28.0_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/${VERSION}"
          EXPECTED_SHA=$(curl --fail --silent --show-error --location --proto =https \
            "${BASE_URL}/gitleaks_8.28.0_checksums.txt" \
            | grep "  ${ARTIFACT}" | awk '{print $1}')
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::Could not find expected SHA256 for ${ARTIFACT} in checksums file."
            exit 1
          fi
          curl --fail --silent --show-error --location --proto =https \
            "${BASE_URL}/${ARTIFACT}" \
            -o "${ARTIFACT}"
          ACTUAL_SHA=$(sha256sum "${ARTIFACT}" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::SHA256 mismatch for ${ARTIFACT}: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi
          tar -xzf "${ARTIFACT}" gitleaks
          install gitleaks /usr/local/bin/gitleaks
      - name: Run full-history Gitleaks scan
        run: |
          mkdir -p reports/gitleaks
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --report-format sarif \
            --report-path reports/gitleaks/gitleaks-history.sarif \
            --exit-code 0
      - name: Upload Gitleaks SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/gitleaks/gitleaks-history.sarif
          category: gitleaks-history
      - name: Upload Gitleaks artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-deep-gitleaks-history
          path: reports/gitleaks/
          retention-days: 21
      - name: Summarize Gitleaks reporting channel
        if: ${{ always() }}
        run: |
          {
            echo '### security / gitleaks-history'
            echo '- Intent: reporting-only scheduled secret scan with full repository history.'
            echo '- Publication: GitHub code scanning via SARIF and retained workflow artifact `security-deep-gitleaks-history`.'
            echo '- Merge gating: none. Review findings from the security tab and retained artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

  semgrep-full:
    name: security / semgrep-full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Semgrep CLI
        run: python3 -m pip install --disable-pip-version-check semgrep==1.126.0
      - name: Run full Semgrep scan
        run: |
          mkdir -p reports/semgrep
          semgrep scan \
            --config .semgrep/config.yml \
            --config p/java \
            --config p/kotlin \
            --config p/javascript \
            --config p/typescript \
            --config p/dockerfile \
            --config p/github-actions \
            --config p/secrets \
            --sarif \
            --output reports/semgrep/semgrep-full.sarif
      - name: Upload Semgrep SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/semgrep/semgrep-full.sarif
          category: semgrep-full
      - name: Upload Semgrep artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-deep-semgrep-full
          path: reports/semgrep/
          retention-days: 21
      - name: Summarize Semgrep reporting channel
        if: ${{ always() }}
        run: |
          {
            echo '### security / semgrep-full'
            echo '- Intent: reporting-only full-repository SAST and security-sensitive config scan.'
            echo '- Publication: GitHub code scanning via SARIF and retained workflow artifact `security-deep-semgrep-full`.'
            echo '- Merge gating: none. Scheduled findings should feed triage, not surprise-block unrelated PRs.'
          } >> "$GITHUB_STEP_SUMMARY"

  codeql-full-backend:
    name: security / codeql-full-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: java-kotlin
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: manual
      - name: Build backend for CodeQL extraction
        run: >-
          ./gradlew -p server/smp build
          -x test
          -x postgresIntegrationTest
          -x bddPostgresTest
          -x bddFastTest
          --no-daemon
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: codeql-full-backend
      - name: Summarize CodeQL reporting channel
        if: ${{ always() }}
        run: |
          {
            echo '### security / codeql-full-backend'
            echo '- Intent: reporting-only deep backend code-graph analysis for `server/smp` and `shared/**`.'
            echo '- Publication: GitHub code scanning through native CodeQL analysis upload.'
            echo '- Merge gating: none in the scheduled lane; this run complements the path-aware PR lane.'
          } >> "$GITHUB_STEP_SUMMARY"

  codeql-full-frontend:
    name: security / codeql-full-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-frontend-config.yml
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: codeql-full-frontend
      - name: Summarize CodeQL reporting channel
        if: ${{ always() }}
        run: |
          {
            echo '### security / codeql-full-frontend'
            echo '- Intent: reporting-only deep frontend code-graph analysis for `apps/web` and `shared/web`.'
            echo '- Publication: GitHub code scanning through native CodeQL analysis upload.'
            echo '- Merge gating: none in the scheduled lane; this run complements the path-aware PR lane.'
          } >> "$GITHUB_STEP_SUMMARY"

  trivy-full:
    name: security / trivy-full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create reports directory
        run: mkdir -p reports/trivy
      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.71.1"
          ARTIFACT="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          EXPECTED_SHA="3cbae37cd440cd8676e5ce9207fe460b5641c7579a17e9d00f8894928c41a88d"
          curl --fail --silent --show-error --location --proto =https \
            -o "${ARTIFACT}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ARTIFACT}"
          ACTUAL_SHA=$(sha256sum "${ARTIFACT}" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::SHA256 mismatch for ${ARTIFACT}: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi
          tar -xzf "${ARTIFACT}" trivy
          sudo mv trivy /usr/local/bin/trivy
          rm -f "${ARTIFACT}"
          trivy --version
      - name: Run full Trivy filesystem, dependency, and IaC scan
        run: |
          trivy fs \
            --format sarif \
            --output reports/trivy/trivy-full.sarif \
            --scanners vuln,misconfig \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --no-progress \
            .
      - name: Verify SARIF file exists
        if: ${{ always() }}
        run: |
          if [ -f reports/trivy/trivy-full.sarif ]; then
            echo "✓ SARIF file created successfully"
            ls -lh reports/trivy/trivy-full.sarif
          else
            echo "✗ SARIF file not found"
            exit 1
          fi
      - name: Upload Trivy SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/trivy/trivy-full.sarif
          category: trivy-full
      - name: Upload Trivy artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-deep-trivy-full
          path: reports/trivy/
          retention-days: 21
      - name: Summarize Trivy reporting channel
        if: ${{ always() }}
        run: |
          {
            echo '### security / trivy-full'
            echo '- Intent: reporting-only full repository filesystem, dependency, and IaC drift scan.'
            echo '- Publication: GitHub code scanning via SARIF and retained workflow artifact `security-deep-trivy-full`.'
            echo '- Severity coverage: UNKNOWN through CRITICAL for deep visibility; the PR lane stays narrower for merge clarity.'
          } >> "$GITHUB_STEP_SUMMARY"

  sonar-full:
    name: security / sonar-full
    needs:
      - gitleaks-history
      - semgrep-full
      - codeql-full-backend
      - codeql-full-frontend
      - trivy-full
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine whether Sonar is enabled
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          enabled=true
          reason=''
          project_key=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d'=' -f2-)

          if [[ -z "$SONAR_TOKEN" ]]; then
            enabled=false
            reason='SONAR_TOKEN is not configured.'
          elif [[ -z "$SONAR_ORGANIZATION" ]]; then
            enabled=false
            reason='SONAR_ORGANIZATION is not configured.'
          elif [[ -z "$project_key" || "$project_key" == 'profiletailors-change-me' ]]; then
            enabled=false
            reason='sonar.projectKey is still using the placeholder value.'
          fi

          {
            echo "enabled=$enabled"
            echo "project_key=$project_key"
            echo "org=$SONAR_ORGANIZATION"
            echo "host_url=$SONAR_HOST_URL"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
      - name: Explain Sonar skip
        if: ${{ steps.sonar-config.outputs.enabled != 'true' }}
        run: |
          {
            echo '### security / sonar-full'
            echo '- Sonar deep analysis skipped.'
            echo "- Reason: ${{ steps.sonar-config.outputs.reason }}"
            echo '- Configure SONAR_TOKEN, SONAR_ORGANIZATION, and a real sonar.projectKey to enable centralized reporting.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run Sonar full analysis
        if: ${{ steps.sonar-config.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ steps.sonar-config.outputs.project_key }}
            -Dsonar.organization=${{ steps.sonar-config.outputs.org }}
            -Dsonar.branch.name=${{ github.ref_name }}
      - name: Explain Sonar reporting channel
        if: ${{ steps.sonar-config.outputs.enabled == 'true' }}
        run: |
          {
            echo '### security / sonar-full'
            echo '- Sonar deep analysis ran using the configured external service binding.'
            echo '- Findings appear in the Sonar dashboard, not in GitHub SARIF code scanning.'
            echo '- This job is reporting-only and exists for centralized history and trend visibility.'
          } >> "$GITHUB_STEP_SUMMARY"

  retention-summary:
    name: security / retention-summary
    needs:
      - gitleaks-history
      - semgrep-full
      - codeql-full-backend
      - codeql-full-frontend
      - trivy-full
      - sonar-full
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarize scheduled deep scan
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks-history.result }}
          SEMGREP_RESULT: ${{ needs.semgrep-full.result }}
          CODEQL_BACKEND_RESULT: ${{ needs.codeql-full-backend.result }}
          CODEQL_FRONTEND_RESULT: ${{ needs.codeql-full-frontend.result }}
          TRIVY_RESULT: ${{ needs.trivy-full.result }}
          SONAR_RESULT: ${{ needs.sonar-full.result }}
        run: |
          {
            echo '## Scheduled deep security summary'
            echo ''
            echo 'This workflow is reporting-oriented by design. It preserves evidence with non-cancelling concurrency and retained artifacts instead of acting as a pull-request gate.'
            echo ''
            echo '### Job results'
            echo "- gitleaks-history: $GITLEAKS_RESULT"
            echo "- semgrep-full: $SEMGREP_RESULT"
            echo "- codeql-full-backend: $CODEQL_BACKEND_RESULT"
            echo "- codeql-full-frontend: $CODEQL_FRONTEND_RESULT"
            echo "- trivy-full: $TRIVY_RESULT"
            echo "- sonar-full: $SONAR_RESULT"
            echo ''
            echo '### Findings channels'
            echo '- Gitleaks history: GitHub code scanning via SARIF + retained artifact `security-deep-gitleaks-history`.'
            echo '- Semgrep full: GitHub code scanning via SARIF + retained artifact `security-deep-semgrep-full`.'
            echo '- CodeQL full backend/frontend: native GitHub code scanning upload.'
            echo '- Trivy full: GitHub code scanning via SARIF + retained artifact `security-deep-trivy-full`.'
            echo '- Sonar full: external Sonar dashboard only when enabled.'
            echo ''
            echo '### Artifact retention'
            echo '- Deep-scan retained artifacts use 21-day retention to keep enough evidence for triage without long-term storage bloat.'
            echo ''
            echo '### Operational note'
            echo '- Scheduled findings must be triaged deliberately and do not silently change PR merge requirements.'
          } >> "$GITHUB_STEP_SUMMARY"

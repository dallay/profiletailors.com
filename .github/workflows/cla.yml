name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    if: |
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft != true && github.event.action != 'closed')
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Comment prompt on PR when CLA is not signed
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const commenter = context.payload.pull_request.user.login;

            // Check if already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo,
              issue_number: prNumber,
              creator: 'github-actions[bot]'
            });

            const alreadyCommented = comments.some(c =>
              c.body.includes('Contributor License Agreement') ||
              c.body.includes('I have read the CLA Document')
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body: `Hi @${commenter}! 👋\n\nBefore we can merge this pull request, **the CLA must be signed**.\n\nPlease leave this exact comment on this PR to complete signing:\n\n\`\`\`\nI have read the CLA Document and I hereby sign the CLA\n\`\`\`\n\nYour signature is recorded and linked to your GitHub account. You only need to do this once.\n\n\n*This check is required for all external contributors. Org members bypass this step automatically.*`
              });
            }

      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1 #ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/dallay/profiletailors.com/blob/main/CLA.md
          branch: main
          allowlist: |
            bot*
            dallay/*
          remote-organization-name: dallay
          remote-repository-name: profiletailors.com

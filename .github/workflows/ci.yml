name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Change Detection — decides which expensive jobs to run
  # ═══════════════════════════════════════════════════════════════
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          filters: |
            backend:
              - 'server/smp/**'
              - 'shared/**'
              - 'server/smp/build.gradle.kts'
            frontend:
              - 'apps/web/marketing/**'
              - 'apps/web/app/**'
              - 'pnpm-lock.yaml'

  # ═══════════════════════════════════════════════════════════════
  # Always-on jobs — fast, run on every push
  # ═══════════════════════════════════════════════════════════════

  # ──────────────────────────────────────────────────────────────
  # 1. Lint — Biome (marketing/app) + Detekt (backend)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - uses: ./.github/actions/setup-backend

      - name: Biome lint (marketing + app)
        shell: bash
        run: |
          cd apps/web/marketing && pnpm lint
          cd ../app && pnpm lint

      - name: Spotless check (backend)
        shell: bash
        run: ./gradlew spotlessCheck --no-daemon

      - name: Detekt (backend)
        shell: bash
        run: ./gradlew :server:smp:detekt --no-daemon

  # ──────────────────────────────────────────────────────────────
  # 2. Frontend unit tests (marketing + app)
  # ──────────────────────────────────────────────────────────────
  frontend-unit:
    name: 🧪 Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - name: Run marketing unit tests + coverage
        shell: bash
        run: cd apps/web/marketing && pnpm test:coverage

      - name: Run web/app unit tests + coverage
        shell: bash
        run: cd apps/web/app && pnpm test:coverage

  # ──────────────────────────────────────────────────────────────
  # 3. App unit tests (SMP app — Vue + Pinia)
  # ──────────────────────────────────────────────────────────────
  app-unit:
    name: 🧪 App Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - name: Run unit tests
        shell: bash
        run: pnpm --filter app test:run

  # ──────────────────────────────────────────────────────────────
  # 4. Backend unit tests (Kotlin — no Postgres)
  # ──────────────────────────────────────────────────────────────
  backend-unit:
    name: 🧪 Backend Unit Tests
    runs-on: ubuntu-latest
    env:
      SMP_POSTGRES_TEST_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-backend

      - name: Run unit tests (exclude BDD suites)
        shell: bash
        run: ./gradlew :server:smp:test -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest --no-daemon -PexcludeTags=modularity

  # ═══════════════════════════════════════════════════════════════
  # Conditional jobs — only run when relevant paths change
  # ═══════════════════════════════════════════════════════════════

  # ──────────────────────────────────────────────────────────────
  # 5. Backend BDD fast suite
  # ──────────────────────────────────────────────────────────────
  backend-bdd:
    name: 🔨 Backend BDD
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      SMP_POSTGRES_TEST_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-backend

      - name: Run BDD fast suite
        shell: bash
        run: ./gradlew :server:smp:bddFastTest --no-daemon -x :shared:common:test -x :shared:spring-boot-common:test

  # ──────────────────────────────────────────────────────────────
  # 5a. Backend Postgres integration suite
  # ──────────────────────────────────────────────────────────────
  backend-postgres:
    name: 🐘 Backend Postgres
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      SMP_POSTGRES_TEST_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-backend

      - name: Run Postgres integration tests
        shell: bash
        run: ./gradlew :server:smp:postgresIntegrationTest --no-daemon -x :shared:common:test -x :shared:spring-boot-common:test

      - name: Run Postgres BDD suite
        shell: bash
        run: ./gradlew :server:smp:bddPostgresTest --no-daemon -x :shared:common:test -x :shared:spring-boot-common:test

  # ──────────────────────────────────────────────────────────────
  # 6. Marketing E2E (Playwright — all browsers)
  # ──────────────────────────────────────────────────────────────
  marketing-e2e:
    name: 🌐 Marketing E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend
        with:
          install-playwright: 'true'
          playwright-browsers: 'chromium firefox webkit'

      - name: Run Marketing E2E
        shell: bash
        run: cd apps/web/marketing && pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-e2e-report
          path: apps/web/marketing/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # 7. Scheduler E2E (Playwright — full stack required)
  #
  # Spins up: PostgreSQL, WireMock (LinkedIn mock), Spring Boot, Vite.
  # Runs serially within the job since tests share browser state.
  #
  # Required GitHub Secrets:
  #   SMP_POSTGRES_PASSWORD          - test DB password for CI Postgres
  #   SMP_LINKEDIN_CLIENT_ID         - dummy LinkedIn client ID
  #   SMP_LINKEDIN_CLIENT_SECRET     - dummy LinkedIn client secret
  #   SMP_LOCAL_JWT_SECRET           - test JWT signing secret
  #   PUBLISHING_CREDENTIALS_KEY     - base64-encoded test encryption key
  #   E2E_TEST_USER_PASSWORD         - dev user password
  # ──────────────────────────────────────────────────────────────
  scheduler-e2e:
    name: 📅 Scheduler E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMP_POSTGRES_DB: profiletailors_smp
      SMP_POSTGRES_USER: profiletailors
      SMP_POSTGRES_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
      SMP_DB_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
      SMP_DB_USERNAME: profiletailors
      # Disable Spring Boot Docker Compose to avoid port conflict with services.postgres
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SMP_PUBLISHING_WORKER_ENABLED: 'true'
      SMP_PUBLISHING_WORKER_POLL_INTERVAL: PT5S
      SMP_LINKEDIN_PUBLISHING_API_BASE_URL: http://localhost:8089
      SMP_LINKEDIN_CLIENT_ID: ${{ secrets.SMP_LINKEDIN_CLIENT_ID }}
      SMP_LINKEDIN_CLIENT_SECRET: ${{ secrets.SMP_LINKEDIN_CLIENT_SECRET }}
      SMP_LINKEDIN_REDIRECT_URI: http://localhost:5173/integrations/linkedin/callback
      SMP_LINKEDIN_SCOPES: w_member_social,openid,profile,email
      SMP_LINKEDIN_API_BASE_URL: https://api.linkedin.com
      SMP_LINKEDIN_AUTHORIZATION_BASE_URL: https://www.linkedin.com/oauth/v2/authorization
      SMP_LINKEDIN_TOKEN_BASE_URL: https://www.linkedin.com/oauth/v2/accessToken
      SMP_LINKEDIN_API_VERSION: '202606'
      SMP_LOCAL_JWT_SECRET: ${{ secrets.SMP_LOCAL_JWT_SECRET }}
      PUBLISHING_CREDENTIALS_KEY: ${{ secrets.PUBLISHING_CREDENTIALS_KEY }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      # Pin backend HTTP port to avoid collisions with local dev tools.
      SMP_BACKEND_PORT: '7638'
      # Management port stays on 9091; the curl healthcheck below probes
      # /actuator/health on MANAGEMENT_PORT (not on the main port).
      MANAGEMENT_PORT: '9091'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.SMP_POSTGRES_DB }}
          POSTGRES_USER: ${{ env.SMP_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.SMP_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      # ── WireMock (must start after checkout for volume mount) ──
      - name: Start WireMock
        shell: bash
        run: |
          docker run -d --name wiremock \
            -p 8089:8080 \
            -v ${{ github.workspace }}/infra/wiremock/linkedin:/home/wiremock:ro \
            wiremock/wiremock:3.10.0 \
            --global-response-templating --verbose
          for i in $(seq 1 30); do
            if wget -qO /dev/null http://localhost:8089/__admin/health 2>/dev/null; then
              echo "✅ WireMock is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ WireMock failed to start"
              docker logs wiremock 2>&1 | tail -20
              exit 1
            fi
            sleep 2
          done

      # ── Java + Gradle ──
      - uses: ./.github/actions/setup-backend

      # ── Node + pnpm ──
      - uses: ./.github/actions/setup-frontend
        with:
          install-playwright: 'true'
          playwright-browsers: 'chromium'

      # ── Build backend ──
      - name: Build backend
        shell: bash
        run: ./gradlew :server:smp:classes :server:smp:bootJar --no-daemon

      # ── Start backend ──
      - name: Start Spring Boot
        shell: bash
        run: |
          ./gradlew :server:smp:bootRun --no-daemon &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9091/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "❌ Backend failed to start"
              exit 1
            fi
            sleep 2
          done

      # ── Run Scheduler E2E tests (serial, chromium only) ──
      # Playwright manages the Vite dev server via webServer in the config.
      - name: Run Scheduler E2E
        shell: bash
        run: |
          pnpm --filter app exec playwright test \
            -c e2e/playwright.scheduler.config.ts \
            --reporter=list

      - name: Upload Scheduler E2E report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduler-e2e-report
          path: apps/web/app/e2e/playwright-scheduler-report/
          retention-days: 7

      - name: Stop WireMock
        if: always()
        shell: bash
        run: docker stop wiremock || true

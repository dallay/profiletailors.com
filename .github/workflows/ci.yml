name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════
# All jobs run in parallel — no job depends on another.
# This maximises throughput on GitHub Actions runners.
# ═══════════════════════════════════════════════════════════════
jobs:

  # ──────────────────────────────────────────────────────────────
  # 1. Secrets scan (Gitleaks)
  # ──────────────────────────────────────────────────────────────
  secrets-scan:
    name: 🔒 Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # 2. Lint — Biome (marketing) + Detekt (backend)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-frontend

      - uses: ./.github/actions/setup-backend

      - name: Biome lint (marketing)
        shell: bash
        run: cd apps/web/marketing && pnpm lint

      - name: Detekt (backend)
        shell: bash
        run: ./gradlew :server:smp:detekt --no-daemon

  # ──────────────────────────────────────────────────────────────
  # 3. Frontend unit tests (marketing)
  # ──────────────────────────────────────────────────────────────
  frontend-unit:
    name: 🧪 Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-frontend

      - name: Run unit tests + coverage
        shell: bash
        run: cd apps/web/marketing && pnpm test:coverage

  # ──────────────────────────────────────────────────────────────
  # 4. App unit tests (SMP app — Vue + Pinia)
  # ──────────────────────────────────────────────────────────────
  app-unit:
    name: 🧪 App Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-frontend

      - name: Run unit tests
        shell: bash
        run: pnpm --filter app test:run

  # ──────────────────────────────────────────────────────────────
  # 5. Backend unit tests (Kotlin — no Postgres)
  # ──────────────────────────────────────────────────────────────
  backend-unit:
    name: 🧪 Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-backend

      - name: Run unit tests (exclude Postgres BDD)
        shell: bash
        run: ./gradlew :server:smp:test --no-daemon -PexcludeTags=modularity,postgres

  # ──────────────────────────────────────────────────────────────
  # 6. Backend BDD fast suite
  # ──────────────────────────────────────────────────────────────
  backend-bdd:
    name: 🔨 Backend BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-backend

      - name: Run BDD fast suite
        shell: bash
        run: ./gradlew :server:smp:bddFastTest --no-daemon -x :shared:common:test -x :shared:spring-boot-common:test

  # ──────────────────────────────────────────────────────────────
  # 7. Marketing E2E (Playwright — all browsers)
  # ──────────────────────────────────────────────────────────────
  marketing-e2e:
    name: 🌐 Marketing E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-frontend
        with:
          install-playwright: 'true'
          playwright-browsers: 'chromium firefox webkit'

      - name: Run Marketing E2E
        shell: bash
        run: cd apps/web/marketing && pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-e2e-report
          path: apps/web/marketing/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # 8. Scheduler E2E (Playwright — full stack required)
  #
  # Spins up: PostgreSQL, WireMock (LinkedIn mock), Spring Boot, Vite.
  # Runs serially within the job since tests share browser state.
  #
  # Required GitHub Secrets:
  #   CI_POSTGRES_PASSWORD          - test DB password for CI Postgres
  #   CI_LINKEDIN_CLIENT_ID         - dummy LinkedIn client ID
  #   CI_LINKEDIN_CLIENT_SECRET     - dummy LinkedIn client secret
  #   CI_LOCAL_JWT_SECRET           - test JWT signing secret
  #   CI_PUBLISHING_CREDENTIALS_KEY - base64-encoded test encryption key
  #   CI_E2E_TEST_USER_PASSWORD     - dev user password (S3cr3tP@ssw0rd*123)
  # ──────────────────────────────────────────────────────────────
  scheduler-e2e:
    name: 📅 Scheduler E2E
    runs-on: ubuntu-latest
    env:
      SMP_POSTGRES_DB: profiletailors_smp
      SMP_POSTGRES_USER: profiletailors
      SMP_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      SMP_PUBLISHING_WORKER_ENABLED: 'true'
      SMP_PUBLISHING_WORKER_POLL_INTERVAL: PT5S
      SMP_LINKEDIN_PUBLISHING_API_BASE_URL: http://localhost:8089
      SMP_LINKEDIN_CLIENT_ID: ${{ secrets.CI_LINKEDIN_CLIENT_ID }}
      SMP_LINKEDIN_CLIENT_SECRET: ${{ secrets.CI_LINKEDIN_CLIENT_SECRET }}
      SMP_LINKEDIN_REDIRECT_URI: http://localhost:5173/integrations/linkedin/callback
      SMP_LINKEDIN_SCOPES: w_member_social,openid,profile,email
      SMP_LINKEDIN_API_BASE_URL: https://api.linkedin.com
      SMP_LINKEDIN_AUTHORIZATION_BASE_URL: https://www.linkedin.com/oauth/v2/authorization
      SMP_LINKEDIN_TOKEN_BASE_URL: https://www.linkedin.com/oauth/v2/accessToken
      SMP_LINKEDIN_API_VERSION: '202606'
      SMP_LOCAL_JWT_SECRET: ${{ secrets.CI_LOCAL_JWT_SECRET }}
      PUBLISHING_CREDENTIALS_KEY: ${{ secrets.CI_PUBLISHING_CREDENTIALS_KEY }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.CI_E2E_TEST_USER_PASSWORD }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.SMP_POSTGRES_DB }}
          POSTGRES_USER: ${{ env.SMP_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.SMP_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      wiremock:
        image: wiremock/wiremock:3.10.0
        ports:
          - 8089:8080
        volumes:
          - ./infra/wiremock/linkedin:/home/wiremock:ro
        entrypoint: ["java", "-cp", "/wiremock.jar:/__root__/*:", "wiremock.Run", "--global-response-templating", "--verbose"]
        options: >-
          --health-cmd "curl -f http://localhost:8080/__admin/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # ── Java + Gradle ──
      - uses: ./.github/actions/setup-backend

      # ── Node + pnpm ──
      - uses: ./.github/actions/setup-frontend
        with:
          install-playwright: 'true'
          playwright-browsers: 'chromium'

      # ── Build backend ──
      - name: Build backend
        shell: bash
        run: ./gradlew :server:smp:classes :server:smp:bootJar --no-daemon

      # ── Start backend ──
      - name: Start Spring Boot
        shell: bash
        run: |
          ./gradlew :server:smp:bootRun --no-daemon &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "❌ Backend failed to start"
              exit 1
            fi
            sleep 2
          done

      # ── Start frontend dev server ──
      - name: Start Vite dev server
        shell: bash
        run: |
          cd apps/web/app && pnpm dev:app &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Frontend is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Frontend failed to start"
              exit 1
            fi
            sleep 2
          done

      # ── Run Scheduler E2E tests (serial, chromium only) ──
      - name: Run Scheduler E2E
        shell: bash
        run: |
          pnpm --filter app exec playwright test \
            -c e2e/playwright.scheduler.config.ts \
            --reporter=list

      - name: Upload Scheduler E2E report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduler-e2e-report
          path: apps/web/app/e2e/playwright-scheduler-report/
          retention-days: 7

name: Release Image

on:
  push:
    tags:
      - 'smp@*'
  workflow_call:
    inputs:
      release-tag:
        description: 'Release tag from Release Please (e.g. smp@v0.x.x)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ref_name="$RELEASE_TAG"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi
          release_version="${ref_name#smp@}"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Extract backend image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/dallay/profiletailors-smp
          tags: |
            type=raw,value=${{ steps.version.outputs.release_version }},priority=1000
            type=raw,value=latest,priority=900
          labels: |
            org.opencontainers.image.title=Profile Tailors SMP
            org.opencontainers.image.description=Backend service for the Profile Tailors social media management platform.
            org.opencontainers.image.url=https://profiletailors.com
            org.opencontainers.image.source=https://github.com/dallay/profiletailors.com
            org.opencontainers.image.documentation=https://github.com/dallay/profiletailors.com/tree/main/server/smp
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.authors=Dallay
            org.opencontainers.image.vendor=Dallay
          annotations: |
            org.opencontainers.image.title=Profile Tailors SMP
            org.opencontainers.image.description=Backend service for the Profile Tailors social media management platform.
            org.opencontainers.image.url=https://profiletailors.com
            org.opencontainers.image.source=https://github.com/dallay/profiletailors.com
            org.opencontainers.image.documentation=https://github.com/dallay/profiletailors.com/tree/main/server/smp
            org.opencontainers.image.version=${{ steps.version.outputs.release_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.authors=Dallay
            org.opencontainers.image.vendor=Dallay
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push backend image (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/smp/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            SMP_VERSION=${{ steps.version.outputs.release_version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          push: true

  build-dashboard:
    name: Build Dashboard Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ref_name="$RELEASE_TAG"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi
          release_version="${ref_name#smp@}"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Extract dashboard image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/dallay/profiletailors-dashboard
          tags: |
            type=raw,value=${{ steps.version.outputs.release_version }},priority=1000
            type=raw,value=latest,priority=900
          labels: |
            org.opencontainers.image.title=Profile Tailors Dashboard
            org.opencontainers.image.description=Web dashboard for scheduling, publishing, analyzing, and collaborating across social networks with Profile Tailors.
            org.opencontainers.image.url=https://profiletailors.com
            org.opencontainers.image.source=https://github.com/dallay/profiletailors.com
            org.opencontainers.image.documentation=https://github.com/dallay/profiletailors.com/tree/main/apps/web/app
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.authors=Dallay
            org.opencontainers.image.vendor=Dallay
          annotations: |
            org.opencontainers.image.title=Profile Tailors Dashboard
            org.opencontainers.image.description=Web dashboard for scheduling, publishing, analyzing, and collaborating across social networks with Profile Tailors.
            org.opencontainers.image.url=https://profiletailors.com
            org.opencontainers.image.source=https://github.com/dallay/profiletailors.com
            org.opencontainers.image.documentation=https://github.com/dallay/profiletailors.com/tree/main/apps/web/app
            org.opencontainers.image.version=${{ steps.version.outputs.release_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.authors=Dallay
            org.opencontainers.image.vendor=Dallay
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push dashboard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/apps/smp/production/dashboard.Dockerfile
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          push: true

  publish-dockerhub:
    name: Publish to Docker Hub
    needs:
      - build-backend
      - build-dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ref_name="$RELEASE_TAG"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=${ref_name#smp@}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror backend image to Docker Hub (multi-arch)
        run: |
          # crane copies the full multi-arch manifest without pulling layers
          # (docker pull only fetches the native architecture)
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_$(uname -s)_$(uname -m).tar.gz" | tar xz crane
          # crane reads auth from ~/.docker/config.json (already populated by login-action steps)
          ./crane copy "ghcr.io/dallay/profiletailors-smp:${RELEASE_VERSION}" "dallay/profiletailors-smp:${RELEASE_VERSION}"
          ./crane copy "ghcr.io/dallay/profiletailors-smp:latest" "dallay/profiletailors-smp:latest"

      - name: Mirror dashboard image to Docker Hub (preserve OCI metadata)
        run: |
          ./crane copy "ghcr.io/dallay/profiletailors-dashboard:${RELEASE_VERSION}" "dallay/profiletailors-dashboard:${RELEASE_VERSION}"
          ./crane copy "ghcr.io/dallay/profiletailors-dashboard:latest" "dallay/profiletailors-dashboard:latest"

  smoke-test:
    name: Smoke Test
    needs:
      - build-backend
      - build-dashboard
      - publish-dockerhub
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ref_name="$RELEASE_TAG"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=${ref_name#smp@}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate temporary environment and secrets
        run: |
          production_dir="infra/apps/smp/production"
          secrets_dir="${production_dir}/secrets"
          mkdir -p "$secrets_dir"
          umask 077
          cat > "${production_dir}/.env" <<EOF
          SMP_IMAGE=ghcr.io/dallay/profiletailors-smp:${RELEASE_VERSION}
          DASHBOARD_IMAGE=ghcr.io/dallay/profiletailors-dashboard:${RELEASE_VERSION}
          HTTP_BIND_ADDRESS=127.0.0.1
          HTTP_PORT=8080
          PUBLIC_ORIGIN=https://app.example.com
          POSTGRES_DB=profiletailors_smp
          POSTGRES_USER=profiletailors
          SMP_EMAIL_SENDER=noreply@example.com
          SMP_MEDIAPROVIDER_UNSPLASH_ENABLED=false
          SMP_REGISTRATION_ENABLED=false
          EOF
          openssl rand -base64 32 > "${secrets_dir}/db-password"
          openssl rand -base64 32 > "${secrets_dir}/local-jwt-secret"
          openssl rand -base64 32 > "${secrets_dir}/publishing-credentials-key"
          openssl rand -base64 32 > "${secrets_dir}/media-preview-signing-secret"
          openssl rand -base64 32 > "${secrets_dir}/linkedin-state-signing-secret"
          openssl rand -base64 32 > "${secrets_dir}/linkedin-client-secret"
          openssl rand -base64 32 > "${secrets_dir}/resend-api-key"
          chmod 600 "${secrets_dir}"/*

      - name: Start production stack
        run: |
          docker compose \
            -f infra/apps/smp/production/compose.yaml \
            --env-file infra/apps/smp/production/.env \
            up -d --wait --wait-timeout 120

      - name: Run smoke test
        run: |
          infra/apps/smp/production/smoke-test.sh

      - name: Tear down stack
        if: always()
        run: |
          docker compose \
            -f infra/apps/smp/production/compose.yaml \
            --env-file infra/apps/smp/production/.env \
            down

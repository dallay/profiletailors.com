name: Release Image

on:
  push:
    tags:
      - 'smp@*'
  workflow_call:
    inputs:
      release-tag:
        description: 'Release tag from Release Please (e.g. smp@v0.x.x)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ref_name="$RELEASE_TAG"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=${ref_name#smp@}" >> "$GITHUB_ENV"

      - name: Build and push backend image (multi-arch)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f server/smp/backend.Dockerfile \
            --build-arg SMP_VERSION="$RELEASE_VERSION" \
            -t "ghcr.io/dallay/profiletailors-smp:$RELEASE_VERSION" \
            -t "ghcr.io/dallay/profiletailors-smp:latest" \
            --push \
            .

  build-dashboard:
    name: Build Dashboard Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ref_name="$RELEASE_TAG"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=${ref_name#smp@}" >> "$GITHUB_ENV"

      - name: Build and push dashboard image
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          docker build \
            -f infra/apps/smp/production/dashboard.Dockerfile \
            -t "ghcr.io/dallay/profiletailors-dashboard:$RELEASE_VERSION" \
            -t "ghcr.io/dallay/profiletailors-dashboard:latest" \
            --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}" \
            .
          docker push "ghcr.io/dallay/profiletailors-dashboard:$RELEASE_VERSION"
          docker push "ghcr.io/dallay/profiletailors-dashboard:latest"

  publish-dockerhub:
    name: Publish to Docker Hub
    needs:
      - build-backend
      - build-dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ref_name="$RELEASE_TAG"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=${ref_name#smp@}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror backend image to Docker Hub (multi-arch)
        run: |
          # crane copies the full multi-arch manifest without pulling layers
          # (docker pull only fetches the native architecture)
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_$(uname -s)_$(uname -m).tar.gz" | tar xz crane
          # crane reads auth from ~/.docker/config.json (already populated by login-action steps)
          ./crane copy "ghcr.io/dallay/profiletailors-smp:${RELEASE_VERSION}" "dallay/profiletailors-smp:${RELEASE_VERSION}"
          ./crane copy "ghcr.io/dallay/profiletailors-smp:latest" "dallay/profiletailors-smp:latest"

      - name: Mirror dashboard image to Docker Hub
        run: |
          docker pull "ghcr.io/dallay/profiletailors-dashboard:${RELEASE_VERSION}"
          docker pull "ghcr.io/dallay/profiletailors-dashboard:latest"
          docker tag "ghcr.io/dallay/profiletailors-dashboard:${RELEASE_VERSION}" "dallay/profiletailors-dashboard:${RELEASE_VERSION}"
          docker tag "ghcr.io/dallay/profiletailors-dashboard:latest" "dallay/profiletailors-dashboard:latest"
          docker push "dallay/profiletailors-dashboard:${RELEASE_VERSION}"
          docker push "dallay/profiletailors-dashboard:latest"

  smoke-test:
    name: Smoke Test
    needs:
      - build-backend
      - build-dashboard
      - publish-dockerhub
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ref_name="$RELEASE_TAG"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=${ref_name#smp@}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate temporary environment and secrets
        run: |
          production_dir="infra/apps/smp/production"
          secrets_dir="${production_dir}/secrets"
          mkdir -p "$secrets_dir"
          umask 077
          cat > "${production_dir}/.env" <<EOF
          SMP_IMAGE=ghcr.io/dallay/profiletailors-smp:${RELEASE_VERSION}
          DASHBOARD_IMAGE=ghcr.io/dallay/profiletailors-dashboard:${RELEASE_VERSION}
          HTTP_BIND_ADDRESS=127.0.0.1
          HTTP_PORT=8080
          PUBLIC_ORIGIN=https://app.example.com
          POSTGRES_DB=profiletailors_smp
          POSTGRES_USER=profiletailors
          SMP_EMAIL_SENDER=noreply@example.com
          SMP_MEDIAPROVIDER_UNSPLASH_ENABLED=false
          SMP_REGISTRATION_ENABLED=false
          EOF
          openssl rand -base64 32 > "${secrets_dir}/db-password"
          openssl rand -base64 32 > "${secrets_dir}/local-jwt-secret"
          openssl rand -base64 32 > "${secrets_dir}/publishing-credentials-key"
          openssl rand -base64 32 > "${secrets_dir}/media-preview-signing-secret"
          openssl rand -base64 32 > "${secrets_dir}/linkedin-state-signing-secret"
          openssl rand -base64 32 > "${secrets_dir}/linkedin-client-secret"
          openssl rand -base64 32 > "${secrets_dir}/resend-api-key"
          chmod 600 "${secrets_dir}"/*

      - name: Start production stack
        run: |
          docker compose \
            -f infra/apps/smp/production/compose.yaml \
            --env-file infra/apps/smp/production/.env \
            up -d --wait

      - name: Run smoke test
        run: |
          infra/apps/smp/production/smoke-test.sh

      - name: Tear down stack
        if: always()
        run: |
          docker compose \
            -f infra/apps/smp/production/compose.yaml \
            --env-file infra/apps/smp/production/.env \
            down

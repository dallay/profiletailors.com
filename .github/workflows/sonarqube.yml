name: SonarQube Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
          persist-credentials: false

      # Backend: Java/Kotlin setup and tests
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run backend tests with coverage
        run: ./gradlew :server:smp:test :server:smp:jacocoTestReport --no-daemon -PexcludeTags=modularity,postgres

      - name: Verify backend coverage report
        run: |
          if [ ! -f server/smp/build/reports/jacoco/test/jacocoTestReport.xml ]; then
            echo "❌ Backend coverage report not found"
            exit 1
          fi
          echo "✅ Backend coverage report generated"

      # Frontend: Node.js setup and tests
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install frontend dependencies
        working-directory: apps/web/marketing
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: apps/web/marketing
        run: pnpm test:coverage

      - name: Verify frontend coverage report
        run: |
          if [ ! -f apps/web/marketing/coverage/lcov.info ]; then
            echo "❌ Frontend coverage report not found"
            exit 1
          fi
          echo "✅ Frontend coverage report generated"

      # SonarQube scan
      # Uses sonar-project.properties from repo root — do NOT override projectKey here
      # unless the secret matches the value in sonar-project.properties.
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@884b79409bbd464b2a59edc326a4b77dc56b2195 # v4.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG: ${{ secrets.SONAR_ORGANIZATION }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Upload coverage artifacts for debugging
      - name: Upload backend coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: server/smp/build/reports/jacoco/
          retention-days: 7

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/marketing/coverage/
          retention-days: 7

name: Close stale issues/PRs

on:
  schedule:
    - cron: "0 2 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10
        with:
          repo-token: ${{ github.token }}

          # --- Issues: ~6 months total ---
          days-before-issue-stale: 150
          days-before-issue-close: 30
          stale-issue-label: "status:stale"
          stale-issue-message: >
            ⚠️ This issue has been open for 5 months with no activity.
            If this is still relevant, please leave a comment.
            Otherwise, it will be automatically closed in 30 days.
          close-issue-message: >
            This issue has been automatically closed due to 6 months of inactivity.
            Feel free to reopen if it's still relevant.

          # --- PRs: ~2 months before stale warning, ~3 months total close ---
          days-before-pr-stale: 30
          days-before-pr-close: 30
          stale-pr-label: "status:stale"
          stale-pr-message: >
            ⚠️ This PR has been open for 1 month with no activity.
            If you're still working on it, please leave a comment.
            Otherwise, it will be automatically closed in 30 days.
          close-pr-message: >
            This PR has been automatically closed due to 2 months of inactivity.
            Feel free to reopen or create a new PR if this is still needed.

          # --- Exemptions ---
          exempt-issue-labels: "pinned,security,bug"
          exempt-pr-labels: "pinned,security,bug"

          remove-stale-when-updated: true
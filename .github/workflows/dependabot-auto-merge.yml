name: Auto-merge dependencies
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    uses: dallay/common-actions/.github/workflows/dependabot-auto-merge.yml@6ecd716dcfb6a9e8a9c494d1eac210cc1d73d75f # v2.0.0
    with:
      target: squash
      approve: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
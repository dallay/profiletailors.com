name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      SMP_POSTGRES_TEST_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
          persist-credentials: false

      # Backend: Java/Kotlin setup and tests
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run backend fast tests
        run: ./gradlew :server:smp:test -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest :shared:common:test :shared:bus:test :shared:presentation:test :shared:security:test :shared:spring-boot-common:test :shared:storage:test :shared:shield:ratelimit:test --no-daemon -PexcludeTags=modularity,postgres

      - name: Run backend postgres integration tests
        run: ./gradlew :server:smp:postgresIntegrationTest --no-daemon -PexcludeTags=modularity

      - name: Generate backend coverage reports
        run: ./gradlew :server:smp:koverXmlReport -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest :shared:common:koverXmlReport :shared:bus:koverXmlReport :shared:presentation:koverXmlReport :shared:security:koverXmlReport :shared:spring-boot-common:koverXmlReport :shared:storage:koverXmlReport :shared:shield:ratelimit:koverXmlReport --no-daemon

      - name: Verify backend coverage reports
        run: |
          for report in \
            server/smp/build/reports/kover/report.xml \
            shared/common/build/reports/kover/report.xml \
            shared/bus/build/reports/kover/report.xml \
            shared/presentation/build/reports/kover/report.xml \
            shared/security/build/reports/kover/report.xml \
            shared/spring-boot-common/build/reports/kover/report.xml \
            shared/storage/build/reports/kover/report.xml \
            shared/shield/ratelimit/build/reports/kover/report.xml; do
            if [ ! -f "$report" ]; then
              echo "❌ Backend coverage report not found: $report"
              exit 1
            fi
          done
          echo "✅ Backend coverage reports generated"

      # Frontend: Node.js setup and tests
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run marketing tests with coverage
        working-directory: apps/web/marketing
        run: pnpm test:coverage

      - name: Verify marketing coverage report
        run: |
          if [ ! -f apps/web/marketing/coverage/lcov.info ]; then
            echo "❌ Marketing coverage report not found"
            exit 1
          fi
          echo "✅ Marketing coverage report generated"

      - name: Run web/app tests with coverage
        working-directory: apps/web/app
        run: pnpm test:coverage

      - name: Verify web/app coverage report
        run: |
          if [ ! -f apps/web/app/coverage/lcov.info ]; then
            echo "❌ Web/app coverage report not found"
            exit 1
          fi
          echo "✅ Web/app coverage report generated"

      # Quality gate: SonarQube scan + Codecov upload
      # Uses sonar-project.properties from repo root — do NOT override projectKey here
      # unless the secret matches the value in sonar-project.properties.
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@884b79409bbd464b2a59edc326a4b77dc56b2195 # v4.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG: ${{ secrets.SONAR_ORGANIZATION }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}

      # ── Codecov upload ──────────────────────────────────────────────────────────
      # Upload coverage in granular steps to ensure monorepo flags are correctly
      # attributed. Flags are aligned with codecov.yml.
      - name: Upload Backend coverage (shared)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: |
            shared/common/build/reports/kover/report.xml
            shared/bus/build/reports/kover/report.xml
            shared/presentation/build/reports/kover/report.xml
            shared/security/build/reports/kover/report.xml
            shared/spring-boot-common/build/reports/kover/report.xml
            shared/storage/build/reports/kover/report.xml
            shared/shield/ratelimit/build/reports/kover/report.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload SMP coverage (server)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: server/smp/build/reports/kover/report.xml
          flags: smp
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload Frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: |
            apps/web/marketing/coverage/lcov.info
            apps/web/app/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Upload coverage artifacts for debugging
      - name: Upload backend coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: |
            server/smp/build/reports/kover/
            shared/common/build/reports/kover/
            shared/bus/build/reports/kover/
            shared/presentation/build/reports/kover/
            shared/security/build/reports/kover/
            shared/spring-boot-common/build/reports/kover/
            shared/storage/build/reports/kover/
            shared/shield/ratelimit/build/reports/kover/
          retention-days: 7

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-coverage
          path: |
            apps/web/marketing/coverage/
            apps/web/app/coverage/
          retention-days: 7

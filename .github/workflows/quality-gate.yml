name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
          persist-credentials: false

      # Backend: Java/Kotlin setup and tests
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run backend tests
        env:
          SMP_DB_TEST_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
        run: ./gradlew :server:smp:test -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest :shared:common:test :shared:bus:test :shared:presentation:test :shared:security:test :shared:spring-boot-common:test :shared:storage:test :shared:shield:ratelimit:test --no-daemon

      - name: Generate backend coverage reports
        env:
          SMP_DB_TEST_PASSWORD: ${{ secrets.SMP_POSTGRES_PASSWORD }}
        run: ./gradlew :server:smp:koverXmlReport :server:smp:postgresIntegrationTest -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest :shared:common:koverXmlReport :shared:bus:koverXmlReport :shared:presentation:koverXmlReport :shared:security:koverXmlReport :shared:spring-boot-common:koverXmlReport :shared:storage:koverXmlReport :shared:shield:ratelimit:koverXmlReport --no-daemon

      - name: Verify backend coverage reports
        run: |
          for report in \
            server/smp/build/reports/kover/report.xml \
            shared/common/build/reports/kover/report.xml \
            shared/bus/build/reports/kover/report.xml \
            shared/presentation/build/reports/kover/report.xml \
            shared/security/build/reports/kover/report.xml \
            shared/spring-boot-common/build/reports/kover/report.xml \
            shared/storage/build/reports/kover/report.xml \
            shared/shield/ratelimit/build/reports/kover/report.xml; do
            if [ ! -f "$report" ]; then
              echo "❌ Backend coverage report not found: $report"
              exit 1
            fi
          done
          echo "✅ Backend coverage reports generated"

      # Frontend: Node.js setup and tests
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run marketing tests with coverage
        working-directory: apps/web/marketing
        run: pnpm test:coverage

      - name: Verify marketing coverage report
        run: |
          if [ ! -f apps/web/marketing/coverage/lcov.info ]; then
            echo "❌ Marketing coverage report not found"
            exit 1
          fi
          echo "✅ Marketing coverage report generated"

      - name: Run web/app tests with coverage
        working-directory: apps/web/app
        run: pnpm test:coverage

      - name: Verify web/app coverage report
        run: |
          if [ ! -f apps/web/app/coverage/lcov.info ]; then
            echo "❌ Web/app coverage report not found"
            exit 1
          fi
          echo "✅ Web/app coverage report generated"

      # Quality gate: SonarQube scan + Codecov upload
      # Uses sonar-project.properties from repo root — do NOT override projectKey here
      # unless the secret matches the value in sonar-project.properties.
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG: ${{ secrets.SONAR_ORGANIZATION }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}

      # ── Codecov upload ──────────────────────────────────────────────────────────
      # Upload coverage in granular steps to ensure monorepo flags are correctly
      # attributed. Flags are aligned with codecov.yml.
      - name: Upload Backend coverage (shared)
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: |
            shared/common/build/reports/kover/report.xml
            shared/bus/build/reports/kover/report.xml
            shared/presentation/build/reports/kover/report.xml
            shared/security/build/reports/kover/report.xml
            shared/spring-boot-common/build/reports/kover/report.xml
            shared/storage/build/reports/kover/report.xml
            shared/shield/ratelimit/build/reports/kover/report.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload SMP coverage (server)
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: server/smp/build/reports/kover/report.xml
          flags: smp
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload Frontend coverage
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: |
            apps/web/marketing/coverage/lcov.info
            apps/web/app/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 15
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          pollingTimeoutSec: 900

      # Upload coverage artifacts for debugging
      - name: Upload backend coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: |
            server/smp/build/reports/kover/
            shared/common/build/reports/kover/
            shared/bus/build/reports/kover/
            shared/presentation/build/reports/kover/
            shared/security/build/reports/kover/
            shared/spring-boot-common/build/reports/kover/
            shared/storage/build/reports/kover/
            shared/shield/ratelimit/build/reports/kover/
          retention-days: 7

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: |
            apps/web/marketing/coverage/
            apps/web/app/coverage/
          retention-days: 7

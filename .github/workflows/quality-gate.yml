name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    # Stacked PR layers can target another feature branch.
    types: [opened, synchronize, reopened]

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
          persist-credentials: false

      # Backend: Java/Kotlin setup and tests
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Run backend tests
        run: ./gradlew :server:smp:test -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest :shared:common:test :shared:bus:test :shared:presentation:test :shared:security:test :shared:spring-boot-common:test :shared:storage:test :shared:shield:ratelimit:test :shared:lead-capture:common:test :shared:lead-capture:waitlist:test :shared:notifications:test :shared:observability:test --no-daemon --no-configuration-cache

      - name: Generate backend coverage reports
        run: ./gradlew :server:smp:koverXmlReport :server:smp:postgresIntegrationTest -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest :shared:common:koverXmlReport :shared:bus:koverXmlReport :shared:presentation:koverXmlReport :shared:security:koverXmlReport :shared:spring-boot-common:koverXmlReport :shared:storage:koverXmlReport :shared:shield:ratelimit:koverXmlReport :shared:lead-capture:common:koverXmlReport :shared:lead-capture:waitlist:koverXmlReport :shared:notifications:koverXmlReport :shared:observability:koverXmlReport --no-daemon --no-configuration-cache

      - name: Verify backend coverage reports
        run: |
          for report in \
            server/smp/build/reports/kover/report.xml \
            shared/common/build/reports/kover/report.xml \
            shared/bus/build/reports/kover/report.xml \
            shared/presentation/build/reports/kover/report.xml \
            shared/security/build/reports/kover/report.xml \
            shared/spring-boot-common/build/reports/kover/report.xml \
            shared/storage/build/reports/kover/report.xml \
            shared/shield/ratelimit/build/reports/kover/report.xml \
            shared/lead-capture/common/build/reports/kover/report.xml \
            shared/lead-capture/waitlist/build/reports/kover/report.xml \
            shared/notifications/build/reports/kover/report.xml \
            shared/observability/build/reports/kover/report.xml; do
            node scripts/verify-coverage-artifact.mjs jacoco "$report"
          done
          echo "✅ All backend JaCoCo XML coverage reports verified"

      # Frontend: Node.js setup and tests
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run marketing tests with coverage
        working-directory: apps/web/marketing
        run: |
          pnpm test:coverage
          node ../../../scripts/normalize-lcov.mjs apps/web/marketing coverage/lcov.info

      - name: Verify marketing coverage report
        run: node scripts/verify-coverage-artifact.mjs lcov apps/web/marketing/coverage/lcov.info

      - name: Run web/app tests with coverage
        working-directory: apps/web/app
        run: |
          pnpm test:coverage
          node ../../../scripts/normalize-lcov.mjs apps/web/app coverage/lcov.info

      - name: Verify web/app coverage report
        run: node scripts/verify-coverage-artifact.mjs lcov apps/web/app/coverage/lcov.info

      - name: Run web/admin tests with coverage
        working-directory: apps/web/admin
        run: |
          pnpm test:coverage
          node ../../../scripts/normalize-lcov.mjs apps/web/admin coverage/lcov.info

      - name: Verify web/admin coverage report
        run: node scripts/verify-coverage-artifact.mjs lcov apps/web/admin/coverage/lcov.info

      - name: Run shared/web tests with coverage
        working-directory: shared/web
        run: |
          pnpm test:coverage
          node ../../scripts/normalize-lcov.mjs shared/web coverage/lcov.info

      - name: Verify shared/web coverage report
        run: node scripts/verify-coverage-artifact.mjs lcov shared/web/coverage/lcov.info

      - name: Run shared/vue-ui tests with coverage
        working-directory: shared/vue-ui
        run: |
          pnpm test:coverage
          node ../../scripts/normalize-lcov.mjs shared/vue-ui coverage/lcov.info

      - name: Verify shared/vue-ui coverage report
        run: node scripts/verify-coverage-artifact.mjs lcov shared/vue-ui/coverage/lcov.info

      # Quality gate: SonarQube scan + Codecov upload
      # Uses sonar-project.properties from repo root — do NOT override projectKey here
      # unless the secret matches the value in sonar-project.properties.
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG: ${{ secrets.SONAR_ORGANIZATION }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}

      # ── Codecov upload ──────────────────────────────────────────────────────────
      # Upload coverage in granular steps to ensure monorepo flags are correctly
      # attributed. Flags are aligned with codecov.yml.
      - name: Upload Backend coverage (shared)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: |
            shared/common/build/reports/kover/report.xml
            shared/bus/build/reports/kover/report.xml
            shared/presentation/build/reports/kover/report.xml
            shared/security/build/reports/kover/report.xml
            shared/spring-boot-common/build/reports/kover/report.xml
            shared/storage/build/reports/kover/report.xml
            shared/shield/ratelimit/build/reports/kover/report.xml
            shared/lead-capture/common/build/reports/kover/report.xml
            shared/lead-capture/waitlist/build/reports/kover/report.xml
            shared/notifications/build/reports/kover/report.xml
            shared/observability/build/reports/kover/report.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload SMP coverage (server)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: server/smp/build/reports/kover/report.xml
          flags: smp
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload Frontend coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: |
            apps/web/marketing/coverage/lcov.info
            apps/web/app/coverage/lcov.info
            apps/web/admin/coverage/lcov.info
            shared/web/coverage/lcov.info
            shared/vue-ui/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 15
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          pollingTimeoutSec: 900

      # Upload coverage artifacts for debugging
      - name: Upload backend coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: |
            server/smp/build/reports/kover/
            shared/common/build/reports/kover/
            shared/bus/build/reports/kover/
            shared/presentation/build/reports/kover/
            shared/security/build/reports/kover/
            shared/spring-boot-common/build/reports/kover/
            shared/storage/build/reports/kover/
            shared/shield/ratelimit/build/reports/kover/
            shared/lead-capture/common/build/reports/kover/
            shared/lead-capture/waitlist/build/reports/kover/
            shared/notifications/build/reports/kover/
            shared/observability/build/reports/kover/
          retention-days: 7

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: |
            apps/web/marketing/coverage/
            apps/web/app/coverage/
            apps/web/admin/coverage/
            shared/web/coverage/
            shared/vue-ui/coverage/
          retention-days: 7

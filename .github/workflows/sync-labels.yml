name: Sync labels 🏷️

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
  workflow_dispatch:

concurrency:
  group: labels-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sync:
    uses: dallay/common-actions/.github/workflows/labels-sync.yml@8aaf32edb1b70941a3f8889b47af1a7fd47e3a2c # v2.2.1

name: Release Please

on:
  push:
    branches:
      - main

# No default GITHUB_TOKEN permissions — the App token carries its own scopes.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created:         ${{ steps.release.outputs.releases_created }}
      landing--release_created: ${{ steps.release.outputs['apps/web/marketing--release_created'] }}
      landing--tag_name:        ${{ steps.release.outputs['apps/web/marketing--tag_name'] }}
      smp--release_created:     ${{ steps.release.outputs['server/smp--release_created'] }}
      smp--tag_name:            ${{ steps.release.outputs['server/smp--tag_name'] }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4.4.1 #5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Post-release: landing ──────────────────────────────────────────────────
  # Extend this job later to deploy the static site to your CDN / Vercel.
  notify-landing:
    needs: release-please
    if: ${{ needs.release-please.outputs['landing--release_created'] == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Landing released
        run: |
          echo "🚀 landing released: ${{ needs.release-please.outputs['landing--tag_name'] }}"

  # ── Post-release: smp ──────────────────────────────────────────────────────
  # Extend this job later to build & push the Docker image, deploy to staging, etc.
  notify-smp:
    needs: release-please
    if: ${{ needs.release-please.outputs['smp--release_created'] == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: SMP released
        run: |
          echo "🚀 smp released: ${{ needs.release-please.outputs['smp--tag_name'] }}"

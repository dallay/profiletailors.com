name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app_tag:
        description: Release tag for the dashboard app, for example app@v0.3.12
        required: false
        type: string
      admin_tag:
        description: Release tag for the admin app, for example admin@v0.0.11
        required: false
        type: string
      landing_tag:
        description: Release tag for the marketing site, for example landing@v0.2.16
        required: false
        type: string

# No default GITHUB_TOKEN permissions — the App token carries its own scopes.
permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      releases_created:         ${{ steps.release.outputs.releases_created }}
      landing--release_created: ${{ steps.release.outputs['apps/web/marketing--release_created'] }}
      landing--tag_name:        ${{ steps.release.outputs['apps/web/marketing--tag_name'] }}
      landing--sha:             ${{ steps.release.outputs['apps/web/marketing--sha'] }}
      app--release_created:     ${{ steps.release.outputs['apps/web/app--release_created'] }}
      app--tag_name:            ${{ steps.release.outputs['apps/web/app--tag_name'] }}
      app--sha:                 ${{ steps.release.outputs['apps/web/app--sha'] }}
      admin--release_created:   ${{ steps.release.outputs['apps/web/admin--release_created'] }}
      admin--tag_name:          ${{ steps.release.outputs['apps/web/admin--tag_name'] }}
      admin--sha:               ${{ steps.release.outputs['apps/web/admin--sha'] }}
      smp--release_created:     ${{ steps.release.outputs['server/smp--release_created'] }}
      smp--tag_name:            ${{ steps.release.outputs['server/smp--tag_name'] }}
      smp--sha:                 ${{ steps.release.outputs['server/smp--sha'] }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Post-release: app ──────────────────────────────────────────────────────
  deploy-app:
    name: Deploy App to Cloudflare Pages
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs['app--release_created'] == 'true' || inputs.app_tag != '') }}
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate app tag
        if: ${{ inputs.app_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.app_tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^app@v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid app tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.app_tag || needs.release-please.outputs['app--tag_name'] }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: resolve-meta
        run: |
          node scripts/extract-release-info.mjs \
            --tag "${{ inputs.app_tag || needs.release-please.outputs['app--tag_name'] }}" \
            --scope "app" \
            --provided "${{ needs.release-please.outputs['app--sha'] }}"

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build app
        env:
          GIT_SHA: ${{ steps.resolve-meta.outputs.git_sha }}
        run: pnpm --filter app build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output=$(pnpm dlx --ignore-workspace --allow-build=workerd@1.20250718.0 --package=wrangler@3.114.17 wrangler pages deploy apps/web/app/dist --project-name=app-profile-tailors --branch=main --commit-hash "${{ steps.resolve-meta.outputs.git_sha }}" --commit-dirty=true 2>&1)
          printf '%s\n' "${output}"
          deployment_url=$(printf '%s\n' "${output}" | grep -oE 'https://[^[:space:]]+\.pages\.dev' | tail -1 || true)
          if [ -z "${deployment_url}" ]; then
            echo "::error::Wrangler did not return a Pages deployment URL"
            exit 1
          fi
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
      - name: Verify deployment artifact and production domain
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          TARGET_URL: ${{ vars.PT_PRODUCTION_APP_URL || 'https://app.profiletailors.com' }}
          EXPECTED_VERSION: ${{ steps.resolve-meta.outputs.version }}
          EXPECTED_SHORT_SHA: ${{ steps.resolve-meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const deploymentUrl = process.env.DEPLOYMENT_URL
          const targetUrl = process.env.TARGET_URL
          const expectedVersion = process.env.EXPECTED_VERSION.replace(/^v/, '')
          const expectedSha = process.env.EXPECTED_SHORT_SHA

          async function fetchText(url) {
            try {
              const response = await fetch(url, { headers: { 'Cache-Control': 'no-cache' } })
              return response.ok ? await response.text() : ''
            } catch {
              return ''
            }
          }

          async function containsMetadata(baseUrl) {
            const rootUrl = `${baseUrl.replace(/\/$/, '')}/`
            const html = await fetchText(`${rootUrl}?release=${expectedSha}`)
            const queue = [...html.matchAll(/src=["']([^"']+\.js)["']/g)].map((match) => new URL(match[1], rootUrl).toString())
            const visited = new Set()
            let assetBody = ''

            while (queue.length > 0 && visited.size < 100) {
              const assetUrl = queue.shift()
              if (visited.has(assetUrl)) continue
              visited.add(assetUrl)
              const asset = await fetchText(assetUrl)
              assetBody += asset
              for (const match of asset.matchAll(/(?:["'(\s])((?:https?:\/\/[^"'()\s]+)?(?:assets\/|\.\/)[A-Za-z0-9._/-]+\.js)/g)) {
                const assetPath = match[1]
                const nestedUrl = assetPath.startsWith('assets/')
                  ? new URL(assetPath, rootUrl).toString()
                  : new URL(assetPath, assetUrl).toString()
                queue.push(nestedUrl)
              }
            }

            return assetBody.includes(expectedVersion) && assetBody.includes(expectedSha) && assetBody.includes(' · ')
          }

          if (!(await containsMetadata(deploymentUrl))) {
            console.error(`::error::Deployment artifact metadata did not match expected release: ${deploymentUrl}`)
            process.exit(1)
          }
          console.log(`Deployment artifact verification passed: ${deploymentUrl}`)

          for (let attempt = 1; attempt <= 5; attempt += 1) {
            if (await containsMetadata(targetUrl)) {
              console.log(`Production domain verification passed on attempt ${attempt}: ${targetUrl}`)
              process.exit(0)
            }
            if (attempt < 5) await new Promise((resolve) => setTimeout(resolve, 15000))
          }
          console.log(`::warning::Production domain did not expose release metadata after 5 attempts: ${targetUrl}`)
          NODE


  # ── Post-release: admin ────────────────────────────────────────────────────
  deploy-admin:
    name: Deploy Admin to Cloudflare Pages
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs['admin--release_created'] == 'true' || inputs.admin_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate admin tag
        if: ${{ inputs.admin_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.admin_tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^admin@v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid admin tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.admin_tag || needs.release-please.outputs['admin--tag_name'] }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: resolve-meta
        run: |
          node scripts/extract-release-info.mjs \
            --tag "${{ inputs.admin_tag || needs.release-please.outputs['admin--tag_name'] }}" \
            --scope "admin" \
            --provided "${{ needs.release-please.outputs['admin--sha'] }}"

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build admin
        env:
          GIT_SHA: ${{ steps.resolve-meta.outputs.git_sha }}
          VITE_API_BASE_URL: ${{ vars.PT_PRODUCTION_API_URL || 'https://api.profiletailors.com' }}
        run: pnpm --filter @profiletailors/admin build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output=$(pnpm dlx --ignore-workspace --allow-build=workerd@1.20250718.0 --package=wrangler@3.114.17 wrangler pages deploy apps/web/admin/dist --project-name=profiletailors-admin --branch=main --commit-hash "${{ steps.resolve-meta.outputs.git_sha }}" --commit-dirty=true 2>&1)
          printf '%s\n' "${output}"
          deployment_url=$(printf '%s\n' "${output}" | sed -nE 's#^.*https://[^[:space:]]+\.pages\.dev[^[:space:]]*.*$#\0#p' | grep -oE 'https://[^[:space:]]+\.pages\.dev' | tail -1)
          if [ -z "${deployment_url}" ]; then
            echo "::error::Wrangler did not return a Pages deployment URL"
            exit 1
          fi
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
      - name: Verify deployment artifact
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_VERSION: ${{ steps.resolve-meta.outputs.version }}
          EXPECTED_SHORT_SHA: ${{ steps.resolve-meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          expected_version="${EXPECTED_VERSION#v}"
          expected_sha="${EXPECTED_SHORT_SHA}"
          echo "Verifying ${DEPLOYMENT_URL} serves SPA metadata: ${expected_version} · ${expected_sha}"
          body=$(curl -fsSL --max-time 15 "${DEPLOYMENT_URL}/?release=${expected_sha}")
          asset_path=$(printf '%s' "${body}" | grep -oE 'src="[^"]+\.js"' | sed -nE 's/src="([^"]+)"/\1/p' | head -1)
          if [ -z "${asset_path}" ]; then
            echo "::error::Deployment ${DEPLOYMENT_URL} did not expose a JavaScript entrypoint"
            exit 1
          fi
          case "${asset_path}" in
            http://*|https://*) asset_url="${asset_path}" ;;
            /*) asset_url="${DEPLOYMENT_URL}${asset_path}" ;;
            *) asset_url="${DEPLOYMENT_URL}/${asset_path}" ;;
          esac
          asset_body=$(curl -fsSL --max-time 15 "${asset_url}")
          if ! printf '%s' "${asset_body}" | grep -F "${expected_version}" > /dev/null || \
            ! printf '%s' "${asset_body}" | grep -F "${expected_sha}" > /dev/null || \
            ! printf '%s' "${asset_body}" | grep -F ' · ' > /dev/null; then
            echo "::error::Deployment artifact metadata did not match expected release"
            exit 1
          fi
          echo "Deployment artifact verification passed"
      - name: Verify production domain
        env:
          TARGET_URL: ${{ vars.PT_PRODUCTION_ADMIN_URL || 'https://admin.profiletailors.com' }}
          EXPECTED_VERSION: ${{ steps.resolve-meta.outputs.version }}
          EXPECTED_SHORT_SHA: ${{ steps.resolve-meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          expected_version="${EXPECTED_VERSION#v}"
          expected_sha="${EXPECTED_SHORT_SHA}"
          echo "Verifying ${TARGET_URL} serves release metadata: ${expected_version} · ${expected_sha}"
          for attempt in $(seq 1 5); do
            body=$(curl -fsSL -H "Cache-Control: no-cache" --max-time 15 "${TARGET_URL%/}/?release=${expected_sha}" 2>/dev/null || true)
            if printf '%s' "${body}" | grep -F "${expected_version}" > /dev/null && \
              printf '%s' "${body}" | grep -F "${expected_sha}" > /dev/null; then
              echo "Production domain responded on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt}/5 did not expose release metadata; waiting 15s..."
            sleep 15
          done
          echo "::warning::Production domain ${TARGET_URL} did not expose release metadata after 5 attempts; deployment artifact verification passed"


  # ── Post-release: landing ──────────────────────────────────────────────────
  deploy-landing:
    name: Deploy Landing to Cloudflare Pages
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs['landing--release_created'] == 'true' || inputs.landing_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate landing tag
        if: ${{ inputs.landing_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.landing_tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^landing@v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid landing tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.landing_tag || needs.release-please.outputs['landing--tag_name'] }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: resolve-meta
        run: |
          node scripts/extract-release-info.mjs \
            --tag "${{ inputs.landing_tag || needs.release-please.outputs['landing--tag_name'] }}" \
            --scope "landing" \
            --provided "${{ needs.release-please.outputs['landing--sha'] }}"

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build marketing
        env:
          GIT_SHA: ${{ steps.resolve-meta.outputs.git_sha }}
        run: pnpm --filter marketing build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx --ignore-workspace --allow-build=workerd@1.20250718.0 --package=wrangler@3.114.17 wrangler pages deploy apps/web/marketing/dist --project-name=profiletailors --branch=main --commit-hash "${{ steps.resolve-meta.outputs.git_sha }}" --commit-dirty=true

      - name: Verify production deployment
        env:
          TARGET_URL: ${{ vars.PT_PRODUCTION_MARKETING_URL || 'https://profiletailors.com' }}
          EXPECTED_VERSION: ${{ steps.resolve-meta.outputs.version }}
          EXPECTED_SHORT_SHA: ${{ steps.resolve-meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_VERSION} (${EXPECTED_SHORT_SHA})"
          verify_url="${TARGET_URL}/terms/"
          echo "Verifying ${verify_url} serves badge: ${expected}"
          success=0
          for attempt in $(seq 1 5); do
            body=$(curl -fsSL --max-time 15 "${verify_url}" 2>/dev/null || true)
            if echo "${body}" | grep -F "${expected}" > /dev/null 2>&1; then
              echo "Verification passed on attempt ${attempt}"
              success=1
              break
            fi
            echo "Attempt ${attempt}/5 failed to match expected badge. Waiting 15s..."
            sleep 15
          done
          if [ "${success}" -ne 1 ]; then
            echo "::error::Production verification failed for ${verify_url} after 5 attempts. Expected badge: ${expected}"
            exit 1
          fi

  # ── Post-release: smp ──────────────────────────────────────────────────────
  build-and-push-smp:
    needs: release-please
    if: ${{ needs.release-please.outputs['smp--release_created'] == 'true' }}
    uses: ./.github/workflows/release-image.yml
    with:
      release-tag: ${{ needs.release-please.outputs['smp--tag_name'] }}
    permissions:
      contents: read
      packages: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

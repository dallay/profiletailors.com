name: Detekt Static Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: detekt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detekt:
    name: Detekt Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run Detekt
        working-directory: server/smp
        run: ./gradlew detekt --no-daemon

      - name: Upload SARIF report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: detekt-report
          path: server/smp/build/reports/detekt/
          retention-days: 7

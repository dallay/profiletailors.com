pre-commit:
  parallel: true
  commands:
    # ========== FRONTEND (Astro + TypeScript) ==========
    # Biome: lint + format en archivos TypeScript/TSX del frontend (ejecuta desde el root del proyecto frontend)
    frontend-biome:
      glob: 'apps/web/**/*.{ts,tsx,js,jsx,vue,astro}'
      run: 'cd apps/web && pnpm biome check --write --unsafe .'

    # Astro type check (disabled by default, kept here for easy enable)
    frontend-typecheck:
      glob: 'apps/web/**/*.{ts,tsx}'
      run: 'cd apps/web/marketing && pnpm astro check'
      skip: true

# Nota: Esta configuración ejecuta Biome desde apps/web una sola vez,
# aprovechando la configuración de proyecto (apps/web/biome.json) que
# unifica las reglas para todos los subproyectos frontend.

pre-commit:
  parallel: true
  commands:
    # ========== FRONTEND (Astro + TypeScript) ==========
    # Biome: lint + format en archivos TypeScript/TSX del frontend (ejecuta desde el root del proyecto frontend)
    frontend-biome:
      glob: 'apps/web/**/*.{ts,tsx,js,jsx,vue,astro}'
      run: 'pnpm biome check {staged_files}'

    # Astro type check (disabled by default, kept here for easy enable)
    frontend-typecheck:
      glob: 'apps/web/**/*.{ts,tsx}'
      run: 'cd apps/web/marketing && pnpm astro check'
      skip: true
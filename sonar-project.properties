# Repository-local Sonar scaffold.
# Replace the placeholder values in CI or through scanner arguments; do not store secrets here.
sonar.projectKey=profiletailors-change-me
sonar.projectName=Profile Tailors
# Uncomment for SonarCloud when the organization binding exists.
# sonar.organization=your-sonarcloud-organization
# Uncomment for self-hosted SonarQube when needed.
# sonar.host.url=https://sonarqube.example.com

# Cover the active backend, shared code, frontend source, and workflow definitions.
sonar.sources=server/smp/src/main,shared,apps/web/marketing/src,.github/workflows
sonar.tests=server/smp/src/test,apps/web/marketing/src
sonar.sourceEncoding=UTF-8

# Language-specific source directories
sonar.java.source=21
sonar.kotlin.source=server/smp/src/main/kotlin,shared/common/src/main/kotlin,shared/spring-boot-common/src/main/kotlin
sonar.javascript.lcov.reportPaths=apps/web/marketing/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/marketing/coverage/lcov.info

# Test coverage reports
sonar.coverage.jacoco.xmlReportPaths=server/smp/build/reports/jacoco/test/jacocoTestReport.xml

# Keep exclusions pragmatic and generated-output focused.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.astro/**,**/.gradle/**,**/build/**,docs/**,openspec/**,tmp/**,**/coverage/**

# Test exclusions
sonar.test.exclusions=**/*.test.ts,**/*.spec.ts,**/test/**,**/tests/**

# Exclude support-heavy boilerplate from duplication checks only.
sonar.cpd.exclusions=server/smp/src/test/kotlin/com/profiletailors/smp/integration/support/**,server/smp/src/test/kotlin/com/profiletailors/smp/bdd/**,apps/web/app/src/i18n/index.ts

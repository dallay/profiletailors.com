# Repository-local Sonar scaffold.
# Replace the placeholder values in CI or through scanner arguments; do not store secrets here.
sonar.projectKey=dallay_profiletailors.com
sonar.projectName=Profile Tailors
sonar.projectVersion=v0.1.0
# Organization is passed via CI env var (SONAR_ORG) — do not store secrets here.
# sonar.organization=your-sonarcloud-organization
# Uncomment for self-hosted SonarQube when needed.
# sonar.host.url=https://sonarqube.example.com

# Cover all backend packages and both frontend apps with matching coverage reports.
sonar.sources=server/smp/src/main/kotlin,shared/common/src/main/kotlin,shared/bus/src/main/kotlin,shared/presentation/src/main/kotlin,shared/security/src/main/kotlin,shared/spring-boot-common/src/main/kotlin,shared/storage/src/main/kotlin,shared/shield/ratelimit/src/main/kotlin,apps/web/marketing/src,apps/web/app/src
sonar.tests=server/smp/src/test/kotlin,shared/common/src/test/kotlin,shared/bus/src/test/kotlin,shared/presentation/src/test/kotlin,shared/security/src/test/kotlin,shared/spring-boot-common/src/test/kotlin,shared/storage/src/test/kotlin,shared/shield/ratelimit/src/test/kotlin,apps/web/marketing/src,apps/web/app/src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/test/**,**/tests/**,**/src/test/kotlin/**
sonar.sourceEncoding=UTF-8

# Language-specific source directories
sonar.java.source=21
sonar.kotlin.source=server/smp/src/main/kotlin,shared/common/src/main/kotlin,shared/bus/src/main/kotlin,shared/presentation/src/main/kotlin,shared/security/src/main/kotlin,shared/spring-boot-common/src/main/kotlin,shared/storage/src/main/kotlin,shared/shield/ratelimit/src/main/kotlin
sonar.javascript.lcov.reportPaths=apps/web/marketing/coverage/lcov.info,apps/web/app/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/marketing/coverage/lcov.info,apps/web/app/coverage/lcov.info

# Test coverage reports
# Kover emits JaCoCo-compatible XML, which Sonar imports via the JaCoCo XML property.
sonar.coverage.jacoco.xmlReportPaths=server/smp/build/reports/kover/report.xml,shared/common/build/reports/kover/report.xml,shared/bus/build/reports/kover/report.xml,shared/presentation/build/reports/kover/report.xml,shared/security/build/reports/kover/report.xml,shared/spring-boot-common/build/reports/kover/report.xml,shared/storage/build/reports/kover/report.xml,shared/shield/ratelimit/build/reports/kover/report.xml

# Keep exclusions pragmatic and generated-output focused.
# shadcn-vue UI wrappers excluded from analysis (generated boilerplate, no business logic)
sonar.exclusions=**/node_modules/**,**/dist/**,**/.astro/**,**/.gradle/**,**/build/**,docs/**,openspec/**,tmp/**,**/coverage/**,server/smp/src/main/resources/db/changelog/dev/*.yaml,apps/web/marketing/src/**/*.test.ts,apps/web/marketing/src/**/*.spec.ts,apps/web/app/src/**/*.test.ts,apps/web/app/src/**/*.spec.ts,apps/web/app/src/components/ui/**

# Test exclusions - exclude test files from main source analysis
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Exclude support-heavy boilerplate from duplication checks only.
sonar.cpd.exclusions=server/smp/src/test/kotlin/com/profiletailors/smp/integration/support/**,server/smp/src/test/kotlin/com/profiletailors/smp/bdd/**,apps/web/app/src/i18n/index.ts

# Exclude Spring Modulith metadata from analysis (boilerplace configuration)
sonar.coverage.exclusions=**/ModuleMetadata.kt

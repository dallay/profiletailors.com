# Repository-local Sonar scaffold.
# Replace the placeholder values in CI or through scanner arguments; do not store secrets here.
sonar.projectKey=dallay_profiletailors.com
sonar.projectName=Profile Tailors
sonar.projectVersion=v0.1.0
# Organization is passed via CI env var (SONAR_ORG) — do not store secrets here.
# sonar.organization=your-sonarcloud-organization
# Uncomment for self-hosted SonarQube when needed.
# sonar.host.url=https://sonarqube.example.com

# Analyze backend packages, all frontend apps, shared modules, and compliance tooling.
sonar.sources=server/smp/src/main/kotlin,shared/common/src/main/kotlin,shared/bus/src/main/kotlin,shared/presentation/src/main/kotlin,shared/security/src/main/kotlin,shared/spring-boot-common/src/main/kotlin,shared/storage/src/main/kotlin,shared/shield/ratelimit/src/main/kotlin,shared/lead-capture/common/src/main/kotlin,shared/lead-capture/waitlist/src/main/kotlin,shared/notifications/src/main/kotlin,shared/observability/src/main/kotlin,shared/vue-ui/src,shared/web/types,shared/web/utils,shared/web/validation,apps/web/marketing/src,apps/web/app/src,apps/web/admin/src,tools/compliance
sonar.tests=server/smp/src/test/kotlin,shared/common/src/test/kotlin,shared/bus/src/test/kotlin,shared/presentation/src/test/kotlin,shared/security/src/test/kotlin,shared/spring-boot-common/src/test/kotlin,shared/storage/src/test/kotlin,shared/shield/ratelimit/src/test/kotlin,shared/lead-capture/common/src/test/kotlin,shared/lead-capture/waitlist/src/test/kotlin,shared/notifications/src/test/kotlin,shared/observability/src/test/kotlin,shared/vue-ui/src,shared/web/types,shared/web/utils,shared/web/validation,apps/web/marketing/src,apps/web/app/src,apps/web/admin/src,tools/compliance
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/test/**,**/tests/**,**/src/test/kotlin/**
sonar.sourceEncoding=UTF-8

# Optional TypeScript configuration override for monorepo analysis
sonar.typescript.tsconfigPaths=apps/web/marketing/tsconfig.json,apps/web/app/tsconfig.json,apps/web/admin/tsconfig.json,tools/compliance/tsconfig.json

# Language-specific source directories
sonar.java.source=25
sonar.kotlin.source=server/smp/src/main/kotlin,shared/common/src/main/kotlin,shared/bus/src/main/kotlin,shared/presentation/src/main/kotlin,shared/security/src/main/kotlin,shared/spring-boot-common/src/main/kotlin,shared/storage/src/main/kotlin,shared/shield/ratelimit/src/main/kotlin,shared/lead-capture/common/src/main/kotlin,shared/lead-capture/waitlist/src/main/kotlin,shared/notifications/src/main/kotlin,shared/observability/src/main/kotlin
sonar.javascript.lcov.reportPaths=apps/web/marketing/coverage/lcov.info,apps/web/app/coverage/lcov.info,apps/web/admin/coverage/lcov.info,shared/web/coverage/lcov.info,shared/vue-ui/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/marketing/coverage/lcov.info,apps/web/app/coverage/lcov.info,apps/web/admin/coverage/lcov.info,shared/web/coverage/lcov.info,shared/vue-ui/coverage/lcov.info

# Test coverage reports
# Kover emits JaCoCo-compatible XML, which Sonar imports via the JaCoCo XML property.
sonar.coverage.jacoco.xmlReportPaths=server/smp/build/reports/kover/report.xml,shared/common/build/reports/kover/report.xml,shared/bus/build/reports/kover/report.xml,shared/presentation/build/reports/kover/report.xml,shared/security/build/reports/kover/report.xml,shared/spring-boot-common/build/reports/kover/report.xml,shared/storage/build/reports/kover/report.xml,shared/shield/ratelimit/build/reports/kover/report.xml,shared/lead-capture/common/build/reports/kover/report.xml,shared/lead-capture/waitlist/build/reports/kover/report.xml,shared/notifications/build/reports/kover/report.xml,shared/observability/build/reports/kover/report.xml

# Keep exclusions pragmatic and generated-output focused.
# shadcn-vue UI wrappers excluded from analysis (generated boilerplate, no business logic)
sonar.exclusions=**/node_modules/**,**/dist/**,**/.astro/**,**/.gradle/**,**/build/**,docs/**,openspec/**,tmp/**,**/coverage/**,server/smp/src/main/resources/db/changelog/dev/*.yaml,apps/web/marketing/src/**/*.test.ts,apps/web/marketing/src/**/*.spec.ts,apps/web/app/src/**/*.test.ts,apps/web/app/src/**/*.spec.ts,apps/web/admin/src/**/*.test.ts,apps/web/admin/src/**/*.spec.ts,shared/vue-ui/src/**/*.test.ts,shared/vue-ui/src/**/*.spec.ts,shared/web/**/*.test.ts,apps/web/app/src/components/ui/**,tools/compliance/**/*.test.ts,tools/compliance/**/*.spec.ts

# Test exclusions - exclude test files from main source analysis
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Exclude support-heavy boilerplate and i18n locale pairs (structurally identical keys, different values).
sonar.cpd.exclusions=server/smp/src/test/kotlin/com/profiletailors/smp/integration/support/**,server/smp/src/test/kotlin/com/profiletailors/smp/bdd/**,apps/web/app/src/shared/i18n/locales/en/**,apps/web/app/src/shared/i18n/locales/es/**,apps/web/marketing/src/i18n/en.ts,apps/web/marketing/src/i18n/es.ts

# Exclude Spring Modulith metadata from analysis (boilerplate configuration)
sonar.coverage.exclusions=**/ModuleMetadata.kt,**/McpBoundedContext.kt,**/McpApplicationMarker.kt,**/McpDomainMarker.kt

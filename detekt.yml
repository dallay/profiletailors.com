config:
  validation: true

# Code style rules
style:
  active: true
  excludes:
    - '**/test/**'

# Performance rules
performance:
  active: true
  excludes:
    - '**/test/**'

# Potential bugs
potential-bugs:
  active: true
  excludes:
    - '**/test/**'

# Naming conventions
naming:
  active: true
  excludes:
    - '**/test/**'

# Empty code detection
empty-blocks:
  active: true
  excludes:
    - '**/test/**'

# Complexity rules — exclude test files
complexity:
  active: true
  excludes:
    - '**/test/**'
  LongMethod:
    allowedLines: 90
  LargeClass:
    allowedLines: 500
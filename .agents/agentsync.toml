# AgentSync Configuration
# This file defines how AI agent configurations are synchronized via symbolic links.
# 
# Source directory (relative to this config file)
source_dir = "."

# Optional: compress AGENTS.md and point symlinks to the compressed file
# compress_agents_md = false

# Gitignore management
[gitignore]
enabled = true
marker = "AI Agent Symlinks"
# Additional entries can be added here:
# entries = ["custom-file.md"]

# =============================================================================
# MCP (Model Context Protocol) Configuration
# =============================================================================
# Define MCP servers once here, and AgentSync will generate the appropriate
# config files for each AI agent (Claude, Copilot, Codex, Cursor, Gemini, VS Code, OpenCode).

[mcp]
enabled = true
merge_strategy = "merge"  # "merge" (default) or "overwrite"

[mcp_servers.shadcnVue]
type = "local"
enabled = true
command = "npx"
args = ["shadcn-vue@latest", "mcp"]

# [mcp_servers.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
#
# [mcp_servers.git]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-git", "--repository", "."]

# =============================================================================
# Agent Configurations
# =============================================================================
# Each agent has:
#   - enabled: Whether to sync this agent (default: true)
#   - description: Human-readable description
#   - targets: Map of target configurations
#
# Each target has:
#   - source: Path relative to source_dir
#   - destination: Path relative to project root
#   - type: "symlink" or "symlink-contents"
#   - pattern: (optional) Glob pattern for symlink-contents

# -----------------------------------------------------------------------------
# Claude Code
# -----------------------------------------------------------------------------
[agents.claude]
enabled = true
description = "Claude Code - Anthropic's AI coding assistant"

[agents.claude.targets.instructions]
source = "AGENTS.md"
destination = "CLAUDE.md"
type = "symlink"

[agents.claude.targets.skills]
source = "skills"
destination = ".claude/skills"
type = "symlink"

[agents.claude.targets.commands]
source = "commands"
destination = ".claude/commands"
type = "symlink-contents"

# -----------------------------------------------------------------------------
# GitHub Copilot
# -----------------------------------------------------------------------------
[agents.copilot]
enabled = true
description = "GitHub Copilot - VS Code and GitHub integrated AI"

[agents.copilot.targets.instructions]
source = "AGENTS.md"
destination = ".github/copilot-instructions.md"
type = "symlink"

[agents.copilot.targets.commands]
source = "commands"
destination = ".github/commands"
type = "symlink-contents"

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------
[agents.cursor]
enabled = true
description = "Cursor - AI code editor and CLI"

[agents.cursor.targets.instructions]
source = "AGENTS.md"
destination = ".cursor/instructions.md"
type = "symlink"

[agents.cursor.targets.skills]
source = "skills"
destination = ".cursor/skills"
type = "symlink"

[agents.cursor.targets.commands]
source = "commands"
destination = ".cursor/commands"
type = "symlink-contents"

# -----------------------------------------------------------------------------
# OpenAI Codex CLI
# -----------------------------------------------------------------------------
[agents.codex]
enabled = true
description = "OpenAI Codex CLI - OpenAI's AI coding agent"

[agents.codex.targets.instructions]
source = "AGENTS.md"
destination = "CODEX.md"
type = "symlink"

[agents.codex.targets.skills]
source = "skills"
destination = ".codex/skills"
type = "symlink"

[agents.codex.targets.commands]
source = "commands"
destination = ".codex/commands"
type = "symlink-contents"

# -----------------------------------------------------------------------------
# Gemini CLI
# -----------------------------------------------------------------------------
[agents.gemini]
enabled = true
description = "Gemini CLI - Google's AI coding assistant"

[agents.gemini.targets.instructions]
source = "AGENTS.md"
destination = "GEMINI.md"
type = "symlink"

[agents.gemini.targets.skills]
source = "skills"
destination = ".gemini/skills"
type = "symlink"

[agents.gemini.targets.commands]
source = "commands"
destination = ".gemini/commands"
type = "symlink-contents"

# -----------------------------------------------------------------------------
# OpenCode
# -----------------------------------------------------------------------------
[agents.opencode]
enabled = true
description = "OpenCode - Open-source AI coding assistant"

[agents.opencode.targets.instructions]
source = "AGENTS.md"
destination = "AGENTS.md"
type = "symlink"

[agents.opencode.targets.skills]
source = "skills"
destination = ".opencode/skills"
type = "symlink"

# Note: intentionally singular per OpenCode convention (.opencode/command, not .opencode/commands)
[agents.opencode.targets.commands]
source = "commands"
destination = ".opencode/command"
type = "symlink-contents"

[agents.opencode.targets.agents]
source = "agents"
destination = ".opencode/agents"
type = "symlink-contents"

# -----------------------------------------------------------------------------
# Root AGENTS.md
# -----------------------------------------------------------------------------
[agents.root]
enabled = true
description = "Root AGENTS.md for tools that look for it in repo root"

[agents.root.targets.agents]
source = "AGENTS.md"
destination = "AGENTS.md"
type = "symlink"

[agents.root.targets.design]
source = "DESIGN.md"
destination = "DESIGN.md"
type = "symlink"

# =============================================================================
# Optional: per-app nested agent instructions
# =============================================================================
# PRODUCT.md files stay versioned in-repo (they are the source of truth, not
# sync targets). When an app defines its own AGENTS.md with app-specific agent
# instructions, uncomment and activate this target to propagate it to every
# assistant using the nested-glob type (monorepo-friendly).
#
# [agents.claude.targets.app-instructions]
# source = "."
# pattern = "apps/web/*/AGENTS.md"
# destination = "{relative_path}/CLAUDE.md"
# type = "nested-glob"
# exclude = [".agents/**", "node_modules/**", "**/target/**", "**/dist/**", "**/.git/**"]
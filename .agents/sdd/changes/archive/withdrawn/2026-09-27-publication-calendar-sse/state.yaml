proposal_summary:
  intent: Cross-process invalidation stream for publication state changes
  in_scope:
    - workspace-scoped SSE endpoint with dotted changeType wire values
    - PublicationEvent domain port with publish(event) + Reactor adapter
    - post-commit emission on success-return from the transaction boundary
    - SPA subscribePublicationEvents(onInvalidation) input adapter feeding the coordinator
    - Playwright SSE-only cross-tab coverage
  out_of_scope:
    - cross-replica fan-out via shared bus
    - native EventSource support
    - replacing REST with SSE payloads
    - optimistic concurrency on worker writes
  success_criteria:
    - one SSE event per committed transition per the frozen emitter matrix; zero on rollback; zero for retryable attempts with no publication-visible change
    - membership-gated subscription; foreign events never delivered
    - at most one coalesced fetch per invalidation window even when duplicated
    - SSE failure never breaks the SPA and never fails a committed mutation
    - backend focused tests + Playwright SSE-only spec pass
spec_summary:
  durable_spec: openspec/specs/calendar-publication-sse/spec.md
  requirements:
    - workspace-scoped stream gated by principal plus active membership
    - native EventSource rejected (401)
    - closed dotted changeType vocabulary with Kotlin enum mapping
    - post-commit emission only; rolled-back transactions emit zero
    - publisher failure is best effort and never fails the business operation
    - 20-second heartbeat; SPA tolerates without refetch
    - bounded reconnect while visible; no aggressive reconnect while hidden
    - SSE failure non-critical; visibility/BroadcastChannel remain
    - cross-tab duplication absorbed at-most-once by the coordinator
    - frozen emitter matrix including recovered success and blocked recovery
design_summary:
  design_doc: openspec/changes/publication-calendar-sse/design.md
  decisions:
    - REST authoritative; SSE best-effort invalidation only
    - Reactor directBestEffort substrate reused; multi-replica explicitly unsupported
    - post-commit on success-return, not on Boolean true
    - tenant boundary is principal plus active membership
    - payload is workspaceId, publicationId, optional socialAccountId, changeType, occurredAt
    - dotted wire names with a single Kotlin enum mapping
    - domain port publish(event); tryEmitNext hidden in the adapter
    - publisher failure never fails the business operation
    - coalescing is at-most-once per window
    - bounded reconnect with visibility as safety net
    - SSE is an input adapter; the store never knows the coordinator

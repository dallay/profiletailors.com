config:
  validation: true
  warningsAsErrors: true

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FileBasedFindingsReport'

comments:
  active: true
  DeprecatedBlockTag:
    active: false
  EndOfSentenceFormat:
    active: false
  OutdatedDocumentation:
    active: false
  UndocumentedPublicClass:
    active: false
    excludes:
      [
        '**/test/**',
        '**/androidTest/**',
        '**/commonTest/**',
        '**/jvmTest/**',
        '**/androidUnitTest/**',
        '**/androidInstrumentedTest/**',

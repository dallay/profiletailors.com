empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  EmptyDefaultConstructor:
    active: true
  EmptyFunctionBlock:
    active: true
  EmptyKotlinFile:
    active: true

exceptions:
  active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
  InstanceOfCheckForException:
    active: true
    excludes:
      [
        '**/test/**',
        '**/androidTest/**',
        '**/commonTest/**',

complexity:
  active: true
  ComplexCondition:
    active: true
    allowedConditions: 4
  ComplexInterface:
    active: true
    allowedDefinitions: 10
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 15
  LabeledExpression:
    active: true
    ignoredLabels: []
  LongParameterList:
    active: true
    allowedFunctionParameters: 12
    allowedConstructorParameters: 7
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  NestedBlockDepth:
    active: true
    allowedDepth: 4
  NestedScopeFunctions:
    active: true
    allowedDepth: 1
  StringLiteralDuplication:
    active: true
    allowedDuplications: 3
    ignoreAnnotation: true
    excludes:
      [
        '**/test/**',
        '**/androidTest/**',
        '**/commonTest/**',
        '**/jvmTest/**',
        '**/androidUnitTest/**',
        '**/androidInstrumentedTest/**',
        '**/jsTest/**',
        '**/iosTest/**',
        '**/*.kts',
      ]
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 11
    allowedFunctionsPerInterface: 11
    allowedFunctionsPerObject: 11
    allowedFunctionsPerEnum: 11
    ignoreDeprecated: false
    ignorePrivate: true
    ignoreOverridden: true
    excludes:
      [
        '**/test/**',
        '**/androidTest/**',
        '**/commonTest/**',
        '**/jvmTest/**',
        '**/androidUnitTest/**',
        '**/androidInstrumentedTest/**',
        '**/jsTest/**',
        '**/iosTest/**',
      ]

coroutines:
  active: true

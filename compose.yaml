# Compose configuration that imports infrastructure services
# This file is used by Spring Boot Docker Compose support during local development
include:
  - ./infra/common.yml
services:
  postgresql:
    extends:
      service: postgres
      file: ./infra/postgres/compose.yaml
      environment:
        POSTGRES_DB: ${SMP_POSTGRES_DB:-profiletailors_smp}
        POSTGRES_USER: ${SMP_POSTGRES_USER:-pt_user}
        POSTGRES_PASSWORD: ${SMP_POSTGRES_PASSWORD:-Sup3rS3cretP@ssw0rd}
        POSTGRES_PORT: ${SMP_POSTGRES_PORT:-5432}


volumes:
  postgres_data:
    driver: local
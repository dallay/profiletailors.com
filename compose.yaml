name: profile-tailors
# Compose configuration that imports infrastructure services
# This file is used by Spring Boot Docker Compose support during local development
include:
  - ./infra/common.yml
services:
  mailpit:
    extends:
      service: mailpit
      file: ./infra/mailpit/compose.yaml

  linkedin-wiremock:
    image: wiremock/wiremock:3.10.0
    ports:
      - "${WIREMOCK_HOST_PORT:-8089}:8080"
    volumes:
      - ./infra/wiremock/linkedin:/home/wiremock:ro
    command:
      - --global-response-templating
      - --verbose

  postgresql:
    extends:
      service: postgres
      file: ./infra/postgres/compose.yaml
    ports: !override
      - '${SMP_POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${SMP_POSTGRES_DB:-profiletailors_smp}
      POSTGRES_USER: ${SMP_POSTGRES_USER:-profiletailors}
      POSTGRES_PASSWORD: ${SMP_POSTGRES_PASSWORD:-CHANGE_ME_gK2fcFZg5cgVu9U}


volumes:
  postgres_data:
    driver: local

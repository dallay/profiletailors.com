invalidated_assumptions:
  - The operating legal entity and registered address were complete.
  - Auth0, Vercel, Cloudflare R2, AWS S3, Sentry, Grafana, or every named social network was a selected production provider.
  - Standard Contractual Clauses had been executed for international transfers.
  - Retention periods stated in the draft were implemented controls.
  - The cookie and browser-storage disclosure was complete.
  - The product licence and terms were compatible and approved.
  - Governing law, liability, legal bases, and all regional rights were approved.
  - Static legal pages alone created enforceable acceptance records.
  - Translation parity established legal equivalence.
  - The archived PASS result established production readiness.

archive_rules:
  - Do not use this manifest or the archived verification as public legal copy.
  - Do not restore invalidated claims without current repository evidence and qualified legal approval.
  - Use only the canonical specification for implementation and verification.
  - Keep production publication blocked until every mandatory gate has named evidence and approval.


design_summary:
  architecture:
    approach: "Hexagonal layers: domain (NotificationRetryEligibility whitelist), application (NotificationAdminQuery port + handlers), infrastructure (R2DBC adapter + controller + redaction)"
    modules_touched:
      - "platformadmin: new query port, retry handler, controller, idempotency service, navigation"
      - "notifications: reused NotificationService for retry dispatch"
    bounded_contexts:
      - "platformadmin: owns admin query + retry orchestration"
      - "notifications: owns notification dispatch pipeline"
  data_model:
    changes: "None - uses existing notifications table"
    retry_strategy: "New notification row with idempotency_key suffix"
  api_contract:
    endpoints:
      - "GET /api/admin/notifications: paginated query with filters, redacted payload"
      - "POST /api/admin/notifications/{id}/retry: idempotent retry with eligibility gate"
    permissions:
      - "platform.notifications.read: OWNER, OPERATOR, AUDITOR"
      - "platform.notifications.manage: OWNER, OPERATOR"
  key_decisions:
    - "Query port in application layer preserves bounded context isolation"
    - "Retry via NotificationService reuses existing dispatch pipeline"
    - "Template whitelist (PASSWORD_RECOVERY) enforces eligibility gate"
    - "Payload redaction utility strips sensitive keys before response"
    - "No schema changes - retry creates new notification row"
  risks:
    - "Redaction incompleteness: future sensitive keys not in denylist"
    - "Eligibility drift: domain changes may affect retry safety"
    - "Query performance: no composite index on common filter columns"
  tradeoffs:
    - "No attempt correlation: independent notification rows for retries"
    - "Single-template whitelist: only PASSWORD_RECOVERY eligible initially"
    - "In-memory redaction: applied after fetch, not at SQL layer"

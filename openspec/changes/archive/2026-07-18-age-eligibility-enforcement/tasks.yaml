#### T-005: Extend `RegisterUserRequest` DTO with Jakarta validation
- **Description**: Add to `RegisterUserRequest` in `server/smp/src/main/kotlin/com/profiletailors/smp/identity/infrastructure/http/LocalAuthController.kt`:
  - `@field:AssertTrue(message = "You must confirm you are 18 or older") val confirmedAgeEligibility: Boolean`
  - `@field:NotBlank(message = "You must accept the terms of service") val acceptedTermsVersion: String`
  - Add `@Schema` annotations for both. Update `register()` method to pass both fields to `RegisterUserCommand`.
- **Acceptance**: POST to `/api/auth/register` with missing/new fields triggers Jakarta validation error. Controller passes both fields to `RegisterUserCommand`.
- **EstimatedSize**: S
- **DependsOn**: [T-004]

#### T-006: Update `RegisterUserHandler` — validate eligibility + record consent
- **Description**: In `server/smp/src/main/kotlin/com/profiletailors/smp/identity/application/LocalAuthHandlers.kt`:
  1. Inject `RecordConsentHandler` via constructor.
  2. Extend `validateRegistration()`: throw `RegistrationValidationException` if `confirmedAgeEligibility != true` or `acceptedTermsVersion.isBlank()`.
  3. Inside `runRegistrationTransaction`, after `provisionDefaultWorkspace()`: capture workspace, call `recordConsentHandler.handle()` twice — once for age eligibility consent (`purpose = "age-eligibility.18-plus"`, `policyVersion = "terms-v1.0.0"`) and once for terms acceptance (`purpose = "terms.acceptance"`, `policyVersion = command.acceptedTermsVersion`). Both with `CONTRACT_ACCEPTANCE` type and `SubjectReference.workspace(workspaceId)`.
  4. Define companion constants for `AGE_ELIGIBILITY_POLICY_VERSION`, `CONSENT_SOURCE`, and `CONSENT_LOCALE`.
- **Acceptance**: Registration with `confirmedAgeEligibility=false` throws 422. Registration with blank `acceptedTermsVersion` throws 422. Successful registration creates two consent records inside the transaction.
- **EstimatedSize**: M
- **DependsOn**: [T-003, T-004, T-005]


title: "Age Eligibility Enforcement & Child-Data Safeguards"
review_workload_forecast:
  estimated_changed_lines: "~280"
  line_budget_risk: low
  chained_prs_recommended: false
  suggested_split: single-pr
  delivery_strategy: single-pr
  chain_strategy: size-exception
  decision_needed_before_apply: true
phases:
  - name: "Backend — Foundation"
    tasks:
      - id: T-001
        title: Remove internal from RecordConsentHandler
        description: "Change internal class RecordConsentHandler to class RecordConsentHandler so Spring can inject it into the identity module."
        acceptance: "RecordConsentHandler is injectable into RegisterUserHandler without compilation error."
        estimated_size: S
        depends_on: []
      - id: T-002
        title: Add RegistrationValidationException
        description: "Add RegistrationValidationException(message: String) to LocalAuthExceptions.kt."
        acceptance: "Exception class exists, extends RuntimeException, and accepts a message string."
        estimated_size: S
        depends_on: []
      - id: T-003
        title: Handle RegistrationValidationException as HTTP 422
        description: "Add handler method in IdentityProblemDetailsHandler.kt that catches RegistrationValidationException and returns ProblemDetail with 422 and title Registration validation failed."
        acceptance: "Controller advice returns 422 with appropriate ProblemDetail."
        estimated_size: S
        depends_on: [T-002]
      - id: T-004
        title: Extend RegisterUserCommand
        description: "Add confirmedAgeEligibility and acceptedTermsVersion to RegisterUserCommand."
        acceptance: "RegisterUserCommand accepts both new fields and callers compile."
        estimated_size: S
        depends_on: [T-001]
      - id: T-005
        title: Extend RegisterUserRequest DTO
        description: "Add Jakarta validation and Schema annotations for confirmedAgeEligibility and acceptedTermsVersion, and pass both fields to RegisterUserCommand."
        acceptance: "Invalid register requests trigger validation and valid requests dispatch both fields."
        estimated_size: S
        depends_on: [T-004]
      - id: T-006
        title: Validate eligibility and record consent
        description: "Inject RecordConsentHandler, validate age eligibility and terms version, and record two CONTRACT_ACCEPTANCE consent records inside the registration transaction."
        acceptance: "Invalid confirmations return validation errors and successful registration creates two consent records inside the transaction."
        estimated_size: M
        depends_on: [T-003, T-004, T-005]
  - name: "Backend — Tests"
    tasks:
      - id: T-007
        title: Handler tests for validation and consent recording
        description: "Add unit tests for false age eligibility, blank terms version, successful two-record consent, and transaction order."
        acceptance: "All handler tests pass and transaction order includes two consent recordings."
        estimated_size: M
        depends_on: [T-006]
      - id: T-008
        title: Controller test for new command fields
        description: "Update LocalAuthControllerTest request construction and captured command assertions."
        acceptance: "Controller test passes with confirmedAgeEligibility and acceptedTermsVersion."
        estimated_size: S
        depends_on: [T-005]
  - name: "Frontend — Foundation"
    tasks:
      - id: T-009
        title: Add auth i18n keys
        description: "Add age eligibility, terms, and validation text keys to English and Spanish auth locales."
        acceptance: "New keys are available through the auth i18n namespace in both locales."
        estimated_size: S
        depends_on: []
      - id: T-010
        title: Extend registerSchema
        description: "Add confirmedAgeEligibility and acceptedTerms literal true validation."
        acceptance: "Schema rejects unchecked confirmations with expected message keys."
        estimated_size: S
        depends_on: [T-009]
      - id: T-011
        title: Update RegisterPayload and register API
        description: "Create RegisterPayload with confirmedAgeEligibility and acceptedTermsVersion and send all fields to the backend."
        acceptance: "register() sends eligibility and terms fields while login remains unaffected."
        estimated_size: S
        depends_on: [T-010]
  - name: "Frontend — Store and View"
    tasks:
      - id: T-012
        title: Pass registration fields through auth store
        description: "Update registerWithPassword to accept RegisterPayload and return the registration AuthTokens."
        acceptance: "registerWithPassword passes all payload fields through to register()."
        estimated_size: S
        depends_on: [T-011]
      - id: T-013
        title: Add registration checkboxes to AuthView
        description: "Add refs, validation error handling, checkbox labels, localized legal links, and reset behavior."
        acceptance: "Registration blocks submit unless both checkboxes are checked and sends the correct payload."
        estimated_size: M
        depends_on: [T-012]
  - name: "Frontend — Tests"
    tasks:
      - id: T-014
        title: AuthView checkbox validation tests
        description: "Add tests for unchecked age, unchecked terms, and successful both-checkbox submission."
        acceptance: "AuthView tests pass."
        estimated_size: S
        depends_on: [T-013]
  - name: Documentation
    tasks:
      - id: T-015
        title: Residual controls documentation
        description: "Create the underage account procedure with report intake, investigation, suspension, deletion, appeal, troubleshooting, and references."
        acceptance: "Procedure exists and follows the required documentation section order."
        estimated_size: S
        depends_on: []

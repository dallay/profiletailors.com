change: skill-and-knowledge-bundle-remediation
current_phase: apply
completed: [init, explore, propose, spec, design, tasks, apply-oleada-1, apply-oleada-1b]
next: apply-oleada-2
updated: 2026-09-28T00:30:00Z
artifact_store: openspec
strict_tdd: true
source_implementation_authorized: false
review_workload: high
review_units: 4
scope_class: governance-and-knowledge-bundle
rationale: |
  Remediation of the canonical agent knowledge bundle (.agents/skills/,
  .agents/AGENTS.md, ADRs, DESIGN.md, PRODUCT.md, CI) so it faithfully
  represents the current Profile Tailors contract and CI prevents further
  drift.

approved_scope:
  - id: P0-A
    name: skill-discovery-identity
    actions:
      - flatten skill folder structure to one skill per top-level folder
      - enforce canonical IDs (folder name == frontmatter name == skill id)
      - add metadata.category and metadata.family to every skill frontmatter
  - id: P0-B
    name: backend-semantics
    actions:
      - correct ADR-0002 so the canonical decision is "Domain owns repository ports/interfaces"
      - replace any "@Service" stereotypes or Spring stereotypes in domain with the real marker
      - full scrub of Spring servlet, JPA, Mockito, Lombok references in Spring skills
  - id: P0-C
    name: external-contamination
    actions:
      - remove references to CVIX, portfolio/blog framings, profiletailors.resume
      - remove skill content that points at paths that do not exist in this monorepo
  - id: P0-D
    name: playwright-rebuild
    actions:
      - "rebuild Playwright skill from the actual monorepo surfaces (apps/web/app, apps/web/admin, apps/web/marketing, shared/web, scripts/run-playwright.mjs)"
  - id: P0-E
    name: ui-governance-precedence
    actions:
      - "declare explicit precedence chain in .agents/DESIGN.md: impeccable -> nothing-design -> frontend-design (with DESIGN.md as tie-breaker)"
  - id: P1-A
    name: version-policy
    actions:
      - remove hardcoded version numbers from skills/docs
      - "skills and agents must read versions from manifests (package.json, gradle/libs.versions.toml, go.mod equivalents)"
  - id: P1-B
    name: modern-best-practices
    actions:
      - "re-review Kotlin, TypeScript, Vue, Pinia, Vitest, pnpm guidance against current dogmatic rules and remove contradictions"
  - id: P1-C
    name: comment-cleanup
    actions:
      - "reframe zero-comments in AGENTS.md as 'prefer self-documenting code; do not generate explanatory comments by default; cleanup enforced in post-processing'"
      - "design a cheap cleanup pipeline: deterministic scanner + cheap subagent for context-dependent cases"
  - id: P1-D
    name: automated-skill-doctor
    actions:
      - add CI gate that runs the skill doctor and blocks drift

governance_decisions:
  - id: G-1
    decision: modify ADR-0002
    detail: |
      Canonical decision becomes "Domain owns repository ports/interfaces";
      Application depends on those ports. Owner of the ADR keeps their role.
  - id: G-2
    decision: create new ADR
    detail: |
      ADR-NNN for the canonical taxonomy of skills and CI anti-contradiction
      gates. Folder name == frontmatter name == skill id; metadata.category
      and metadata.family required; doctor rules codified.
  - id: G-3
    decision: zero-comments reframe
    detail: |
      Keep the policy but reframe wording. Post-processing enforcement
      (deterministic scan + cheap subagent) is part of the change.
  - id: G-4
    decision: UI precedence
    detail: |
      Precedence chain declared in .agents/DESIGN.md; DESIGN.md is the
      tie-breaker when skills disagree.

risks:
  - openspec/changes/publication-calendar-sse is in_progress at apply phase.
    This remediation change does not overlap with calendar/publishing code,
    but does overlap with .agents/skills and AGENTS.md content.
  - Two changes both touching shared knowledge surfaces (this one and any
    later docs-only patch) need explicit ordering in tasks.


    contradiction_one:
      surface: |
        AGENTS.md (líneas 384 y 394) dice "inward-facing ports" /
        "inward-facing side" — eso es application, no domain.
        La hexagonal-architecture skill y ADR-0002 no mencionan dónde
        vive el puerto, pero el código real (verificado en
        server/smp/.../tenancy/domain/WorkspaceMutationRepository.kt:3) y
        el ejemplo WorkspaceRepository.kt en la skill hexagonal (líneas
        120-145) coinciden: el puerto vive en domain/.
      resolution_proposal: |
        Enmendar ADR-0002 con párrafo explícito "Domain owns
        repository/gateway ports/interfaces"; sustituir "inward-facing
        ports" en AGENTS.md por "domain-defined ports" o equivalente.
        Bloque P0-B + governance_decision.G-1 cubren esto.
    phantom_marker:
      skill: .agents/skills/backend-platform/spring-boot/SKILL.md:86
      declares: |
        annotation class ApplicationService en paquete
        com.profiletailors.common.application
      reality: |
        El marker real es com.profiletailors.common.domain.Service
        en shared/common/src/main/kotlin/com/profiletailors/common/
        domain/Service.kt:18. "find -name ApplicationService.kt"
        retorna vacío. No existe ningún ApplicationService.kt en el
        código. La skill inventa un marker paralelo.
      resolution_proposal: |
        Bloque P0-B: borrar la sección "Local Architectural Markers"
        y sustituir por referencia al marker real.
    external_contamination:
      files: 6
      affected_skills:

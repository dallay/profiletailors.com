        - .agents/skills/languages-typing/kotlin/SKILL.md (profiletailors.resume)
        - .agents/skills/testing/playwright/SKILL.md (apps/portfolio, apps/blog)
      resolution_proposal: |
        Bloque P0-C: DELETE puro en esos 6 archivos. Playwright

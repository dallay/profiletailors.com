acceptance_criteria:
  - id: ac1
    text: A normal push/merge to main does not deploy app/admin/landing to Cloudflare production.
  - id: ac2
    text: Creating app@vX.Y.Z through Release Please triggers only the app production deployment.
  - id: ac3
    text: Creating admin@vX.Y.Z through Release Please triggers only the admin production deployment.
  - id: ac4
    text: Creating landing@vX.Y.Z through Release Please triggers only the landing production deployment.
  - id: ac5
    text: Deployment builds check out the exact SHA associated with the Release Please release rather than implicitly building the current main HEAD.
  - id: ac6
    text: Multiple frontend releases created in the same Release Please run can deploy independently.
  - id: ac7
    text: Existing smp release/image behavior remains unchanged.
  - id: ac8
    text: Cloudflare credentials are least-privilege repository secrets.
  - id: ac9
    text: The release SHA is passed as GIT_SHA to scripts/compute-build-info.mjs so the version badge reflects production.
  - id: ac10
    text: Post-deployment verification asserts the production URL returns the version badge.
  - id: ac11
    text: Documentation includes operator gate instructions for disabling Cloudflare Git integration.
  - id: ac12
    text: An ADR records the release-driven deployment boundary decision.
cloudflare_projects:
  app: app-profile-tailors
  admin: profiletailors-admin
  landing: profiletailors

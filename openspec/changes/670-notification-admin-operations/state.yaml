metadata:
  epic: "656"
  issue: "dallay-670"
  orchestrator_context:
    explore_completed: true
    key_findings:
      - "Notifications table append-only with idempotency_key UNIQUE constraint"
      - "Invitation retry creates NEW token + NEW row via ResendInvitationHandler"
      - "Password-recovery retry has no queryable retry policy in-consumer"
      - "EmailDispatchResult lacks retryable category distinction"
      - "Gaps: semantic retry vs re-notification, eligibility checks, payload redaction, observability"
    scope_decisions:
      - "Admin read-only visibility + safe retry for eligible (non-token-bound) notifications"
      - "Retry as re-dispatch through NotificationService (NOT new token creation)"
      - "Eligible: password-recovery class; Ineligible: invitation/token-bound class"
      - "Payload redaction for tokens, passwords, acceptUrl, rawToken"
      - "NOT: second notification engine, blind resend, attempt-tracking schema"


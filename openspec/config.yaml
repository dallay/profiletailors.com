schema: spec-driven

context: |
  Monorepo: profiletailors.com with Astro marketing app, Vue 3/Vite SPA, shared libraries, and Kotlin backend at server/smp.
  Tech stack: Kotlin 2.3, Spring Boot 4, WebFlux, Spring Security, Spring Modulith, PostgreSQL/R2DBC, Liquibase, Astro 7, Tailwind CSS 4, Vue 3, pnpm 11.
  Architecture: backend dependency direction domain <- application <- infrastructure, package-by-context, CQRS/mediator-style handlers; frontend feature modules and shared web libraries.
  Testing: JUnit 5, Spring WebFlux/Security tests, Kotlin coroutines, Modulith, Cucumber BDD, Testcontainers, Kover, Vitest, Playwright, Astro check, and vue-tsc.
  Style: Gradle Kotlin DSL, strict Kotlin JSR-305 nullability, Biome, Detekt, Spotless, English documentation, and just command recipes.

testing:
  strict_tdd: true
  runners:
    backend_unit: "just backend-test-fast"
    backend_bdd_fast: "just backend-bdd-fast"
    backend_postgres: "just backend-test-postgres"
    backend_bdd_postgres: "just backend-bdd-postgres"
    marketing_unit: "just frontend-test"
    app_unit: "pnpm --filter app test:run"
    marketing_e2e: "pnpm --filter marketing test:e2e"
    app_e2e: "pnpm --filter app test:e2e:scheduler"
  quality: ["just backend-lint", "just frontend-lint", "just frontend-check", "pnpm --filter app type-check"]
  coverage: ["just frontend-test-cov", "just backend-coverage", "quality-gate.yml Kover/LCOV checks"]
  full_gate: "just ci"
  rationale: "Strict TDD is explicit in this config and repository instructions; multiple backend and frontend runners are available."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    tdd: true
    test_command: "./gradlew test"
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
    test_command: "./gradlew test"
    build_command: "./gradlew build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

schema: spec-driven

context: |
  Monorepo: profiletailors.com with Astro marketing app and Kotlin backend module at server/smp.
  Tech stack: Kotlin 2.2, Spring Boot 4, WebFlux, Spring Security, Spring Modulith, PostgreSQL R2DBC, Liquibase planned, Astro 6, Tailwind CSS 4.
  Architecture: monorepo with backend foundation work targeting hexagonal architecture and CQRS/mediator-style common abstractions; current backend codebase is still bootstrap-level.
  Testing: JUnit 5 with Spring Boot test support, WebFlux test, Spring Security test, Kotlin coroutines test, Spring Modulith test.
  Style: Gradle Kotlin DSL; Kotlin compiler strict JSR-305 nullability; Node >=22.12 for frontend.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    tdd: false
    test_command: "./gradlew test"
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
    test_command: "./gradlew test"
    build_command: "./gradlew build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

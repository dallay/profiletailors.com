id: no-reactor-in-domain
language: Kotlin
severity: error
message: |
  🚨 Domain layer MUST NOT depend on Reactor. Keep domain code framework-free
  and transport-agnostic. Use suspend functions or pure Kotlin abstractions.
rule:
  any:
    - pattern: 'import reactor.$REST'
    - pattern: 'import org.reactivestreams.$REST'
constraints:
  REST:
    regex: '.*'
paths:
  include:
    - 'server/smp/src/main/kotlin/**/domain/**'

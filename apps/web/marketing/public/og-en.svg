<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)" opacity="0.03"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#333333" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#888888;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo area top left -->
  <g transform="60, 60">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff" font-weight="700" letter-spacing="2">PROFILE TAILORS</text>
  </g>

  <!-- Main headline -->
  <text x="600" y="280" font-family="Space Grotesk, system-ui, sans-serif" font-size="72" fill="#ffffff" text-anchor="middle" font-weight="600">Schedule smarter,</text>
  <text x="600" y="360" font-family="Space Grotesk, system-ui, sans-serif" font-size="72" fill="#ffffff" text-anchor="middle" font-weight="600">post everywhere</text>

  <!-- Subtitle -->
  <text x="600" y="420" font-family="Space Mono, monospace" font-size="18" fill="#666666" text-anchor="middle" letter-spacing="3">ONE PLACE. ALL PLATFORMS.</text>

  <!-- Platform icons row -->
  <g transform="translate(420, 480)">
    <circle cx="30" cy="30" r="20" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
    <circle cx="100" cy="30" r="20" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
    <circle cx="170" cy="30" r="20" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
    <circle cx="240" cy="30" r="20" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  </g>

  <!-- Bottom watermark -->
  <text x="60" y="600" font-family="Space Mono, monospace" font-size="12" fill="#444444">profiletailors.com</text>
  <text x="1140" y="600" font-family="Space Mono, monospace" font-size="12" fill="#444444" text-anchor="end">JOIN THE WAITLIST</text>
</svg>
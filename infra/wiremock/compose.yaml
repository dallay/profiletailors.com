include:
  - ../common.yml
services:
  wiremock:
    image: 'wiremock/wiremock:3.12.1'
    command:
      - '--port'
      - '${WIREMOCK_PORT:-8080}'
      - '--global-response-templating'
      - '--verbose'
    environment:
      WIREMOCK_OPTIONS: '${WIREMOCK_OPTIONS:-}'
    volumes:
      - ./linkedin/__files:/home/wiremock/__files:ro
      - ./linkedin/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:${WIREMOCK_PORT:-8080}/__admin/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - profiletailors

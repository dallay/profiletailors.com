global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'smp-monitor'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-smp'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          application: 'smp'
          service: 'social-media-platform'
          instance: 'smp-local'

  - job_name: 'spring-boot-smp-health'
    metrics_path: '/actuator/health'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'smp'
          check: 'health'

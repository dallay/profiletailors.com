include:
  - ../common.yml
services:
  mailpit:
    image: 'axllent/mailpit:v1.24'
    container_name: profiletailors-mailpit
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'   # SMTP
      - '${MAILPIT_UI_PORT:-8025}:8025'     # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_UI_AUTH: ''  # no auth for local dev
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profiletailors

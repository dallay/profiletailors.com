include:
  - ../common.yml
services:
  mailpit:
    image: 'axllent/mailpit:v1.30.7'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'   # SMTP
      - '${MAILPIT_UI_PORT:-8025}:8025'     # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_UI_AUTH: ''  # no auth for local dev
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - profiletailors

# Gradle JVM configuration
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache
org.gradle.configuration-cache=true
# Note: generateLicenseReport task is incompatible with configuration cache
# Run it with --no-configuration-cache: ./gradlew generateLicenseReport --no-configuration-cache

# Enable build cache
org.gradle.caching=true

# Kotlin daemon JVM args
kotlin.daemon.jvmargs=-Xmx2g
systemProp.kotlin.caching.enabled=false

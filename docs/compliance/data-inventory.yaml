      - IP address and user-agent only if captured by the selected production delivery stack
    data_subjects: Website visitors, application users, and API consumers
    recipients:
      - name: Production hosting and CDN provider
        type: processor
        location_type: unknown
        location: Not selected or evidenced in the repository
        agreement_reference: Not executed or evidenced
        activation_status: not_selected
        agreement_status: unverified
    retention:
      trigger: Request or delivery event created
      duration: Not established; depends on selected production host and logging configuration
      action: delete
      control_status: not_implemented
      evidence: []
    security_measures:
      - Application CORS allow-list is configurable
      - Production credential validation exists for sensitive application secrets
    evidence_references:
      - path: apps/web/marketing/astro.config.mjs
        reason: Static Astro build with no deployment adapter or provider selection
      - path: apps/web/app/vite.config.ts
        reason: Dashboard build configuration does not select a hosting provider
      - path: docs/production-secrets.md
        reason: Explicitly platform-agnostic production guidance
      - path: .github/workflows/release-please.yml
        reason: Deployment step is documented as future work
    evidence_status: not_evidenced
    legal_review_status: pending
    notes: Vercel, Cloudflare, and Dokploy are examples in documentation, not verified production selections.


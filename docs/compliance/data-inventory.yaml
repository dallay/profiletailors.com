  - id: pa-012
    name: Browser cookies and local device storage
    purposes:
      - purpose: Maintain authentication, UI preferences, workspace selection, and local dashboard state
        role: controller
        legal_basis:
          type: contract
          reference: Strict necessity must be assessed per item and enabled market; non-essential items need a separate basis
    personal_data_categories:
      - pt_refresh HttpOnly refresh-session token cookie
      - sidebar_state cookie containing a boolean UI preference
      - theme and pt_settings_v1 local-storage preferences for theme and locale
      - pt_active_workspace_id and pt_active_workspace_name local-storage values
      - pt_publications local-storage copy of publication content and channel metadata
      - pt-dashboard-new local-storage feature preference
    data_subjects: Marketing visitors and dashboard users
    recipients:
      - name: User browser or device
        type: none
        location_type: unknown
        location: Stored on the user's device
        agreement_reference: not_applicable
        activation_status: selected
        agreement_status: not_applicable
    retention:
      trigger: Logout, user action, expiry, or browser-data deletion
      duration: pt_refresh defaults to P7D; sidebar_state is P7D; local-storage items have no automatic expiry
      action: delete
      control_status: partial
      evidence:
        - Logout revokes and clears pt_refresh
        - Workspace store can clear workspace identifiers but auth logout does not evidence that call
        - Other local-storage values persist until overwritten or browser storage is cleared
    security_measures:
      - Refresh token cookie is HttpOnly and Secure by default
      - Access token remains in application memory rather than local storage
    evidence_references:
      - path: apps/web/marketing/src/layouts/Layout.astro
        reason: Marketing theme local storage
      - path: apps/web/app/src/modules/settings/infrastructure/settings.store.ts
        reason: Locale and theme local storage
      - path: apps/web/app/src/modules/workspace/infrastructure/workspace.store.ts
        reason: Workspace identifier and name local storage
      - path: apps/web/app/src/modules/publishing/infrastructure/publishing.store.ts
        reason: Publication content local storage
      - path: apps/web/app/src/components/ui/sidebar/SidebarProvider.vue
        reason: Sidebar preference cookie
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/credentials/infrastructure/RefreshSessionCookieFactory.kt
        reason: Authentication cookie
    evidence_status: verified
    legal_review_status: pending
    notes: This activity was absent from schema version 1.0 even though it materially affects the Cookie Policy.

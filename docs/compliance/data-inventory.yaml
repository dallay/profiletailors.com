schema_version: "2.0"
status: draft
production_release_status: blocked
last_verified_on: 2026-07-17
processing_entity: UNRESOLVED - legal person required before publication
DPO_contact: null

processing_activities:
  - id: pa-001
    name: User account registration, authentication, and session management
    purposes:
      - purpose: Register users, authenticate access, verify email addresses, and maintain refresh sessions
        role: controller
        legal_basis:
          type: contract
          reference: Proposed GDPR Art. 6(1)(b); pending entity, market, and counsel approval
    personal_data_categories:
      - Email address and email verification status
      - Username and display identity
      - BCrypt password hash
      - Principal, subject, and optional identity-provider identifiers
      - BCrypt refresh-token verifier, session identifier, expiry, revocation, and replacement metadata
      - Verification-token hash, expiry, and used timestamp
    data_subjects: Registered users
    recipients:
      - name: Production PostgreSQL hosting provider
        type: processor
        location_type: unknown
        location: Not selected or evidenced in the repository
        agreement_reference: Not executed or evidenced
        activation_status: not_selected
        agreement_status: unverified
      - name: Resend transactional email
        type: processor
        location_type: unknown
        location: Requires contract and region verification before activation
        agreement_reference: Not executed or evidenced
        activation_status: conditional
        agreement_status: unverified
    retention:
      trigger: account deletion, session expiry or revocation, and verification-token expiry
      duration: Account deletion period not established; refresh cookie defaults to P7D; access token defaults to PT15M
      action: delete
      exceptions:
        - Legal holds and statutory records require a separately approved schedule
      control_status: partial
      evidence:
        - Refresh sessions expire and can be revoked; the HttpOnly cookie is cleared on logout
        - No account deletion or expired identity-record purge control was located
    security_measures:
      - Password and refresh-token secrets are hashed with BCrypt
      - Access tokens use configurable JWT validation and local HS256 issuance
      - Refresh cookie is HttpOnly, Secure by default, SameSite=Lax, and scoped to /api/auth
    evidence_references:
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/identity/infrastructure/BCryptPasswordHasher.kt
        reason: Password hashing implementation
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/credentials/infrastructure/BCryptRefreshTokenHasher.kt
        reason: Refresh-token verifier implementation
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/credentials/infrastructure/RefreshSessionCookieFactory.kt
        reason: Refresh-cookie attributes and clearing behaviour
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/identity/infrastructure/email/ResendEmailConfiguration.kt
        reason: Resend is conditional on a non-blank API key
      - path: server/smp/src/main/resources/application.yaml
        reason: Configurable JWT, database, email, and session settings
    evidence_status: partial
    legal_review_status: pending
    notes: Auth0 and Clerk are not evidenced as current providers. Local JWT and a configurable federated JWT issuer are implemented.

  - id: pa-002
    name: Social media publishing and scheduling
    purposes:
      - purpose: Compose, schedule, and publish customer-directed content to connected social accounts
        role: processor
        legal_basis:
          type: controller_instruction
          reference: Customer DPA and documented instructions required before production processing
    personal_data_categories:
      - LinkedIn account identifier, display name, profile URN, and avatar URL
      - Publication title, body, scheduled time, status, priority, and author principal identifier
      - Attached media and filenames
      - Publication jobs, delivery attempts, provider responses, and error details
    data_subjects: Workspace members, social-account owners, and people appearing in customer content
    recipients:
      - name: LinkedIn
        type: controller
        location_type: unknown
        location: Contracting entity and processing locations require verification
        agreement_reference: LinkedIn API and platform terms require approval evidence
        activation_status: configurable
        agreement_status: unverified
    retention:
      trigger: Customer deletes an unpublished publication or terminates the service
      duration: Immediate hard deletion exists for unpublished publications; no general post-termination schedule is implemented
      action: delete
      exceptions:
        - Content already published remains subject to LinkedIn and customer deletion controls
      control_status: partial
      evidence:
        - Unpublished publication deletion removes jobs, asset links, delivery attempts, and the publication
        - No automatic P90D archive or P180D delivery-log purge was located
    security_measures:
      - Workspace-scoped authorization
      - OAuth credentials encrypted using AES-GCM
      - Publishing worker is disabled by default and requires explicit configuration
    evidence_references:
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/publishing/infrastructure/linkedin/LinkedInPublishingAdapters.kt
        reason: Only LinkedIn has real connection and publishing adapters
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/publishing/infrastructure/persistence/R2dbcPublishingRepositories.kt
        reason: Publishing persistence and hard-delete transaction
      - path: server/smp/src/main/resources/application.yaml
        reason: LinkedIn and publishing-worker configuration
    evidence_status: partial
    legal_review_status: pending
    notes: Twitter/X, Facebook, Instagram, and TikTok appear in frontend types or drafts but no production backend adapters were located.

  - id: pa-003
    name: Web application hosting and delivery
    purposes:
      - purpose: Deliver the marketing site, dashboard, API, and static assets
        role: controller
        legal_basis:

  - id: pa-008
    name: Media asset storage and external media import
    purposes:
      - purpose: Upload, store, preview, and delete customer media assets
        role: processor
        legal_basis:
          type: controller_instruction
          reference: Customer DPA and documented instructions required
      - purpose: Search and import optional Unsplash media
        role: controller
        legal_basis:
          type: contract
          reference: Feature necessity and provider terms require approval before enablement
    personal_data_categories:
      - Original filename, content type, size, content hash, storage key, and upload state
      - Image, video, or document content that may contain personal data
      - External media URL, provider ID, author name, author URL, and search query
    data_subjects: Workspace members and people represented in uploaded or imported media
    recipients:
      - name: Production object-storage provider
        type: processor
        location_type: unknown
        location: Not selected; local filesystem is the repository default
        agreement_reference: Not executed or evidenced
        activation_status: not_selected
        agreement_status: unverified
      - name: Unsplash
        type: controller
        location_type: unknown
        location: Provider entity and processing locations require verification
        agreement_reference: Unsplash API terms require approval evidence
        activation_status: conditional
        agreement_status: unverified
    retention:
      trigger: Last active reference to a stored blob is deleted or expires
      duration: P7D before physical object deletion; database row remains as GARBAGE_COLLECTED
      action: delete
      exceptions:
        - After five GC failures the blob requires manual intervention
        - Content already published remains subject to the destination platform and customer controls
      control_status: implemented
      evidence:
        - Hourly scheduler selects blobs orphaned for more than seven days and deletes the storage object
        - Persistence records GC status and failures; the database row is not physically deleted
    security_measures:
      - Workspace access checks
      - Time-limited HMAC-signed preview URLs
      - SHA-256 content hashes
    evidence_references:
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/media/infrastructure/MediaReconcilerScheduler.kt
        reason: Hourly garbage-collection schedule
      - path: server/smp/src/main/kotlin/com/profiletailors/smp/media/application/StaleAssetReconciler.kt
        reason: Seven-day physical object deletion implementation
      - path: shared/storage/src/main/kotlin/com/profiletailors/storage/infrastructure/StorageAutoConfiguration.kt
        reason: Local, S3, and R2 adapters; adapter availability is not production selection
      - path: server/smp/src/main/resources/application.yaml
        reason: Local storage default and conditional Unsplash feature
    evidence_status: verified
    legal_review_status: pending


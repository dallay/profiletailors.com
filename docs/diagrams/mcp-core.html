<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP, from discovery to audit</title>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #F5F5F0; --paper-2: #E0E0DA; --ink: #1A1A1A; --muted: #525252;
      --soft: #7a7a7a; --rule: rgba(26,26,26,0.12); --accent: #D71921;
      --accent-tint: rgba(215,25,33,0.08); --link: #2e5aa8;
      --sans: 'Space Grotesk', system-ui, sans-serif; --serif: 'Doto', monospace;
      --mono: 'Space Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 0.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .subtitle { margin-bottom: 1.5rem; color: var(--muted); font: 400 0.72rem var(--mono); letter-spacing: 0.06em; }
    .diagram { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 728px; }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · Diagram Design</p>
    <h1>MCP, from discovery to audit</h1>
    <p class="subtitle">DATA FLOW · BALANCED · MIXED — 5 NODES, 4 ARROWS</p>

    <div class="diagram">
    <svg viewBox="0 0 728 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-title mcp-desc">
      <title id="mcp-title">MCP, from discovery to audit</title>
      <desc id="mcp-desc">Data flow showing an MCP client discovering the gated catalog, passing scope authorization and argument validation, dispatching a tool, and emitting an audit fact.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(26,26,26,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#525252"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#D71921"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="728" height="436" fill="#F5F5F0"/>
      <rect width="728" height="436" fill="url(#dots)"/>
      <rect x="0" y="36" width="728" height="80" fill="rgba(26,26,26,0.018)"/>
      <rect x="0" y="196" width="728" height="80" fill="rgba(26,26,26,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="356" x2="728" y2="356" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(26,26,26,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">DISCOVER</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(215,25,33,0.20)"/><text x="308" y="14" class="step-number focal-text">02</text><text x="308" y="29" class="step-label focal-text">AUTHORIZE</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(26,26,26,0.12)"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">VALIDATE</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(26,26,26,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">DISPATCH</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(26,26,26,0.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">AUDIT</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">CLIENT</text>
        <text x="70" y="152" class="lane-label">SERVER</text>
        <text x="70" y="232" class="lane-label">TOOLS</text>
        <text x="70" y="312" class="lane-label">AUDIT</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#D71921" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <line x1="358" y1="156" x2="370" y2="156" stroke="#525252" marker-end="url(#arr-muted)"/>
      <path d="M470 156 H524 Q532 156 532 164 V204" fill="none" stroke="#525252" marker-end="url(#arr-muted)"/>
      <path d="M582 236 H636 Q644 236 644 244 V284" fill="none" stroke="#525252" marker-end="url(#arr-muted)"/>
      <rect x="253" y="58" width="40" height="12" rx="2" fill="#F5F5F0"/>
      <text x="273" y="67" fill="#D71921" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CATALOG</text>

      <!-- Client: Discover Catalog -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(26,26,26,0.12)"/><text x="159" y="53" class="role-text">CLT</text>
      <text x="196" y="67" class="node-title">Discover Catalog</text><text x="196" y="79" class="node-sub">profile-gated</text><text x="196" y="91" class="node-tool">MCP client</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">DB</text>

      <!-- Server: Resolve and Authorize (focal) -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="rgba(215,25,33,0.07)" stroke="#D71921" stroke-width="1.2"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(215,25,33,0.20)"/><text x="271" y="133" class="role-text focal-text">SRV</text>
      <text x="308" y="147" class="node-title">Resolve &amp; Authorize</text><text x="308" y="159" class="node-sub">scope · workspace</text><text x="308" y="171" class="node-tool">Authz gate</text>
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="184" class="chip-text">DB</text>
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="346" y="184" class="chip-text">DB</text>

      <!-- Server: Validate Args -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.25)"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(26,26,26,0.12)"/><text x="383" y="133" class="role-text">SRV</text>
      <text x="420" y="147" class="node-title">Validate Args</text><text x="420" y="159" class="node-sub">required · typed</text><text x="420" y="171" class="node-tool">Contracts</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">DB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="458" y="184" class="chip-text">DB</text>

      <!-- Tools: Dispatch Handler -->
      <rect x="482" y="204" width="100" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.25)"/>
      <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(26,26,26,0.12)"/><text x="495" y="213" class="role-text">TOL</text>
      <text x="532" y="227" class="node-title">Dispatch Handler</text><text x="532" y="239" class="node-sub">read · write</text><text x="532" y="251" class="node-tool">Tool handler</text>
      <rect x="486" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="494" y="264" class="chip-text">DB</text>
      <rect x="562" y="258" width="16" height="8" rx="3" fill="#6e6479"/><text x="570" y="264" class="chip-text">WB</text>

      <!-- Audit: Emit Audit Fact -->
      <rect x="594" y="284" width="100" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.25)"/>
      <rect x="598" y="288" width="18" height="10" rx="3" fill="rgba(26,26,26,0.12)"/><text x="607" y="293" class="role-text">AUD</text>
      <text x="644" y="307" class="node-title">Emit Audit Fact</text><text x="644" y="319" class="node-sub">every call</text><text x="644" y="331" class="node-tool">Audit sink</text>
      <rect x="598" y="338" width="16" height="8" rx="3" fill="#6e6479"/><text x="606" y="344" class="chip-text">WB</text>

      <!-- Legend: steps -->
      <text x="164" y="373" class="legend-label">STEPS</text>
      <rect x="180" y="364" width="24" height="12" rx="6" fill="rgba(26,26,26,0.12)"/><text x="192" y="372" class="step-number">01</text><text x="212" y="373" class="legend-text">Discover</text>
      <rect x="272" y="364" width="24" height="12" rx="6" fill="rgba(215,25,33,0.20)"/><text x="284" y="372" class="step-number focal-text">02</text><text x="304" y="373" class="legend-text">Authorize</text>
      <rect x="372" y="364" width="24" height="12" rx="6" fill="rgba(26,26,26,0.12)"/><text x="384" y="372" class="step-number">03</text><text x="404" y="373" class="legend-text">Validate</text>
      <rect x="480" y="364" width="24" height="12" rx="6" fill="rgba(26,26,26,0.12)"/><text x="492" y="372" class="step-number">04</text><text x="512" y="373" class="legend-text">Dispatch</text>
      <rect x="580" y="364" width="24" height="12" rx="6" fill="rgba(26,26,26,0.12)"/><text x="592" y="372" class="step-number">05</text><text x="612" y="373" class="legend-text">Audit</text>

      <!-- Legend: data types -->
      <text x="164" y="394" class="legend-label">DATA TYPE</text>
      <rect x="180" y="386" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="392" class="chip-text">DB</text><text x="202" y="394" class="legend-text">Dataset</text>
      <rect x="260" y="386" width="16" height="8" rx="3" fill="#6e6479"/><text x="268" y="392" class="chip-text">WB</text><text x="282" y="394" class="legend-text">Published</text>
      <text x="356" y="394" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="416" class="legend-label">FLOW</text>
      <line x1="180" y1="413" x2="204" y2="413" stroke="#525252" marker-end="url(#arr-muted)"/><text x="212" y="416" class="legend-text">Standard handoff</text>
      <line x1="330" y1="413" x2="354" y2="413" stroke="#D71921" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="362" y="416" class="legend-text">Focal handoff</text>
    </svg>
    </div>
  </main>
</body>
</html>

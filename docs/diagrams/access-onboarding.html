<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access, from invite to verified</title>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F5F5F0;
      --color-ink:     #1A1A1A;
      --color-muted:   #525252;
      --color-accent:  #D71921;
      --font-sans:     'Space Grotesk', system-ui, sans-serif;
      --font-serif:    'Doto', monospace;
      --font-mono:     'Space Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    .diagram { overflow-x: auto; }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Access, from invite to verified</h1>
    <p class="subtitle">SEQUENCE · FIT · BALANCED · MIXED — 4 LIFELINES, 12 MESSAGES</p>

    <div class="diagram">
    <svg viewBox="0 0 960 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="access-title access-desc">
      <title id="access-title">Access, from invite to verified</title>
      <desc id="access-desc">Sequence showing invitation acceptance flowing into atomic registration with a session, then email verification through a mailbox link.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(26,26,26,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#525252"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#D71921"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#525252" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5F5F0"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lifelines: User 120 · App 360 · API 600 · Mail 840 -->
      <line x1="120" y1="128" x2="120" y2="596" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="128" x2="360" y2="596" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="128" x2="600" y2="596" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="128" x2="840" y2="596" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars (all closed) -->
      <rect x="596" y="244" width="8" height="44" fill="rgba(26,26,26,0.06)" stroke="#525252" stroke-width="0.8"/>
      <rect x="356" y="244" width="8" height="44" fill="rgba(26,26,26,0.06)" stroke="#525252" stroke-width="0.8"/>
      <rect x="596" y="352" width="8" height="44" fill="rgba(26,26,26,0.06)" stroke="#525252" stroke-width="0.8"/>
      <rect x="356" y="352" width="8" height="44" fill="rgba(26,26,26,0.06)" stroke="#525252" stroke-width="0.8"/>
      <rect x="596" y="532" width="8" height="44" fill="rgba(26,26,26,0.06)" stroke="#525252" stroke-width="0.8"/>
      <rect x="356" y="532" width="8" height="44" fill="rgba(26,26,26,0.06)" stroke="#525252" stroke-width="0.8"/>

      <!-- M1: API -> Mail  send invite (async) -->
      <line x1="604" y1="176" x2="836" y2="176" stroke="#525252" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="688" y="160" width="64" height="12" rx="2" fill="#F5F5F0"/>
      <text x="720" y="170" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEND INVITE</text>

      <!-- M2: User -> App  open invite -->
      <line x1="124" y1="212" x2="356" y2="212" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="208" y="196" width="64" height="12" rx="2" fill="#F5F5F0"/>
      <text x="240" y="206" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPEN INVITE</text>

      <!-- M3: App -> API  accept -->
      <line x1="364" y1="248" x2="596" y2="248" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="444" y="232" width="72" height="12" rx="2" fill="#F5F5F0"/>
      <text x="480" y="242" fill="#2e5aa8" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACCEPT INVITE</text>

      <!-- M4: API -> App  accepted (return) -->
      <line x1="592" y1="284" x2="368" y2="284" stroke="#525252" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="440" y="268" width="80" height="12" rx="2" fill="#F5F5F0"/>
      <text x="480" y="278" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · ACCEPTED</text>

      <!-- M5: User -> App  register -->
      <line x1="124" y1="320" x2="356" y2="320" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="216" y="304" width="48" height="12" rx="2" fill="#F5F5F0"/>
      <text x="240" y="314" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REGISTER</text>

      <!-- M6: App -> API  register -->
      <line x1="364" y1="356" x2="596" y2="356" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="438" y="340" width="84" height="12" rx="2" fill="#F5F5F0"/>
      <text x="480" y="350" fill="#2e5aa8" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST · REGISTER</text>

      <!-- M7: API -> App  session (headline) -->
      <line x1="592" y1="392" x2="368" y2="392" stroke="#D71921" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="444" y="376" width="72" height="12" rx="2" fill="#F5F5F0"/>
      <text x="480" y="386" fill="#D71921" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">201 · SESSION</text>

      <!-- M8: API -> Mail  verify link (async) -->
      <line x1="604" y1="428" x2="836" y2="428" stroke="#525252" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="688" y="412" width="64" height="12" rx="2" fill="#F5F5F0"/>
      <text x="720" y="422" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY LINK</text>

      <!-- M9: Mail -> User  verify email (async) -->
      <line x1="832" y1="464" x2="128" y2="464" stroke="#525252" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="448" y="448" width="64" height="12" rx="2" fill="#F5F5F0"/>
      <text x="480" y="458" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY EMAIL</text>

      <!-- M10: User -> App  click verify -->
      <line x1="124" y1="500" x2="356" y2="500" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="208" y="484" width="64" height="12" rx="2" fill="#F5F5F0"/>
      <text x="240" y="494" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLICK VERIFY</text>

      <!-- M11: App -> API  confirm -->
      <line x1="364" y1="536" x2="596" y2="536" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="444" y="520" width="72" height="12" rx="2" fill="#F5F5F0"/>
      <text x="480" y="530" fill="#2e5aa8" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONFIRM EMAIL</text>

      <!-- M12: API -> App  verified (return) -->
      <line x1="592" y1="572" x2="368" y2="572" stroke="#525252" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="456" y="556" width="48" height="12" rx="2" fill="#F5F5F0"/>
      <text x="480" y="566" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFIED</text>

      <!-- Actor boxes drawn after arrows -->
      <!-- User (input) -->
      <rect x="48" y="72" width="144" height="56" rx="6" fill="#F5F5F0"/>
      <rect x="48" y="72" width="144" height="56" rx="6" fill="rgba(82,82,82,0.10)" stroke="#7a7a7a" stroke-width="1"/>
      <rect x="56" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,122,122,0.40)" stroke-width="0.8"/>
      <text x="70" y="89" fill="#7a7a7a" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="120" y="104" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">User</text>
      <text x="120" y="119" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">browser</text>

      <!-- App (input) -->
      <rect x="288" y="72" width="144" height="56" rx="6" fill="#F5F5F0"/>
      <rect x="288" y="72" width="144" height="56" rx="6" fill="rgba(82,82,82,0.10)" stroke="#7a7a7a" stroke-width="1"/>
      <rect x="296" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,122,122,0.40)" stroke-width="0.8"/>
      <text x="310" y="89" fill="#7a7a7a" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="360" y="104" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">App</text>
      <text x="360" y="119" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">Vue SPA</text>

      <!-- API (focal) -->
      <rect x="528" y="72" width="144" height="56" rx="6" fill="#F5F5F0"/>
      <rect x="528" y="72" width="144" height="56" rx="6" fill="rgba(215,25,33,0.08)" stroke="#D71921" stroke-width="1"/>
      <rect x="536" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(215,25,33,0.50)" stroke-width="0.8"/>
      <text x="550" y="89" fill="#D71921" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="600" y="104" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">API</text>
      <text x="600" y="119" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">access · verify</text>

      <!-- Mail (external) -->
      <rect x="768" y="72" width="144" height="56" rx="6" fill="#F5F5F0"/>
      <rect x="768" y="72" width="144" height="56" rx="6" fill="rgba(26,26,26,0.03)" stroke="rgba(26,26,26,0.30)" stroke-width="1"/>
      <rect x="776" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.22)" stroke-width="0.8"/>
      <text x="790" y="89" fill="#7a7a7a" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="840" y="104" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Mail</text>
      <text x="840" y="119" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">token links</text>

      <!-- Legend -->
      <line x1="56" y1="620" x2="904" y2="620" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
      <text x="56" y="636" fill="#525252" font-size="8" font-family="'Space Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="56" y="648" width="14" height="10" rx="2" fill="rgba(215,25,33,0.08)" stroke="#D71921" stroke-width="1"/>
      <text x="76" y="656" fill="#525252" font-size="8" font-family="'Space Grotesk', sans-serif">Headline</text>

      <line x1="180" y1="652" x2="208" y2="652" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="216" y="656" fill="#525252" font-size="8" font-family="'Space Grotesk', sans-serif">HTTP call</text>

      <line x1="320" y1="652" x2="348" y2="652" stroke="#525252" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="356" y="656" fill="#525252" font-size="8" font-family="'Space Grotesk', sans-serif">Return</text>

      <line x1="450" y1="652" x2="478" y2="652" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="486" y="656" fill="#525252" font-size="8" font-family="'Space Grotesk', sans-serif">Call</text>

      <line x1="580" y1="652" x2="608" y2="652" stroke="#525252" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="616" y="656" fill="#525252" font-size="8" font-family="'Space Grotesk', sans-serif">Async open</text>
    </svg>
    </div>
  </div>
</body>
</html>

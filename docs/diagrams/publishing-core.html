<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publishing pipeline, from draft to delivered</title>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #F5F5F0; --paper-2: #E0E0DA; --ink: #1A1A1A; --muted: #525252;
      --soft: #7a7a7a; --rule: rgba(26,26,26,0.12); --accent: #D71921;
      --accent-tint: rgba(215,25,33,0.08); --link: #2e5aa8;
      --sans: 'Space Grotesk', system-ui, sans-serif; --serif: 'Doto', monospace;
      --mono: 'Space Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 0.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .subtitle { margin-bottom: 1.5rem; color: var(--muted); font: 400 0.72rem var(--mono); letter-spacing: 0.06em; }
    .diagram { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 728px; }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · Diagram Design</p>
    <h1>Publishing pipeline, from draft to delivered</h1>
    <p class="subtitle">FAN-IN QUEUE / BOTTLENECK → DATA FLOW · BALANCED · MIXED — 5 NODES, 4 ARROWS</p>

    <div class="diagram">
    <svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pub-core-title pub-core-desc">
      <title id="pub-core-title">Publishing pipeline, from draft to delivered</title>
      <desc id="pub-core-desc">Data flow showing a scheduled publication moving through the queue into the delivery worker and out to the provider, with confirmation and operator observation.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(26,26,26,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#525252"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#D71921"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="728" height="356" fill="#F5F5F0"/>
      <rect width="728" height="356" fill="url(#dots)"/>
      <rect x="0" y="36" width="728" height="80" fill="rgba(26,26,26,0.018)"/>
      <rect x="0" y="196" width="728" height="80" fill="rgba(26,26,26,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(26,26,26,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(26,26,26,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">CREATE</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(26,26,26,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">SCHEDULE</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(215,25,33,0.20)"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">DELIVER</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(26,26,26,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">CONFIRM</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(26,26,26,0.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">OBSERVE</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">APP</text><text x="70" y="84" class="lane-label">USER</text>
        <text x="70" y="152" class="lane-label">BACKEND</text><text x="70" y="164" class="lane-label">WORKER</text>
        <text x="70" y="232" class="lane-label">OBSERVER</text><text x="70" y="244" class="lane-label">VIEW</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M246 76 H258" fill="none" stroke="#525252" marker-end="url(#arr-muted)"/>
      <path d="M358 76 H412 Q420 76 420 84 V124" fill="none" stroke="#D71921" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <path d="M470 156 H482" fill="none" stroke="#525252" marker-end="url(#arr-muted)"/>
      <path d="M582 156 H636 Q644 156 644 164 V204" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <rect x="372" y="56" width="44" height="12" rx="2" fill="#F5F5F0"/>
      <text x="394" y="65" fill="#D71921" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DUE JOB</text>

      <!-- App User: Compose Post -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(26,26,26,0.12)"/><text x="159" y="53" class="role-text">USR</text>
      <text x="196" y="67" class="node-title">Compose Post</text><text x="196" y="79" class="node-sub">idea → draft</text><text x="196" y="91" class="node-tool">App composer</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#9c6b50"/><text x="234" y="104" class="chip-text">FL</text>

      <!-- App User: Schedule and Queue -->
      <rect x="258" y="44" width="100" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.25)"/>
      <rect x="262" y="48" width="18" height="10" rx="3" fill="rgba(26,26,26,0.12)"/><text x="271" y="53" class="role-text">USR</text>
      <text x="308" y="67" class="node-title">Schedule &amp; Queue</text><text x="308" y="79" class="node-sub">NOW · SLOT → job</text><text x="308" y="91" class="node-tool">Calendar · API</text>
      <rect x="262" y="98" width="16" height="8" rx="3" fill="#9c6b50"/><text x="270" y="104" class="chip-text">FL</text>
      <rect x="338" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="346" y="104" class="chip-text">DB</text>

      <!-- Backend Worker: Claim and Publish (focal) -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="rgba(215,25,33,0.07)" stroke="#D71921" stroke-width="1.2"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(215,25,33,0.20)"/><text x="383" y="133" class="role-text focal-text">BKD</text>
      <text x="420" y="147" class="node-title">Claim &amp; Publish</text><text x="420" y="159" class="node-sub">claim once · retry</text><text x="420" y="171" class="node-tool">Worker · LinkedIn</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">DB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#6e6479"/><text x="458" y="184" class="chip-text">WB</text>

      <!-- Backend Worker: Confirm Delivery -->
      <rect x="482" y="124" width="100" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.25)"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(26,26,26,0.12)"/><text x="495" y="133" class="role-text">BKD</text>
      <text x="532" y="147" class="node-title">Confirm Delivery</text><text x="532" y="159" class="node-sub">success · failure</text><text x="532" y="171" class="node-tool">Postgres store</text>
      <rect x="486" y="178" width="16" height="8" rx="3" fill="#6e6479"/><text x="494" y="184" class="chip-text">WB</text>
      <rect x="562" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="570" y="184" class="chip-text">FL</text>

      <!-- Observer: Observe Result -->
      <rect x="594" y="204" width="100" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.25)"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(26,26,26,0.12)"/><text x="607" y="213" class="role-text">OBS</text>
      <text x="644" y="227" class="node-title">Observe Result</text><text x="644" y="239" class="node-sub">status · stale-jobs</text><text x="644" y="251" class="node-tool">Scheduler UI</text>
      <rect x="598" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="606" y="264" class="chip-text">FL</text>

      <!-- Legend: steps -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="rgba(26,26,26,0.12)"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Create</text>
      <rect x="272" y="284" width="24" height="12" rx="6" fill="rgba(26,26,26,0.12)"/><text x="284" y="292" class="step-number">02</text><text x="304" y="293" class="legend-text">Schedule</text>
      <rect x="372" y="284" width="24" height="12" rx="6" fill="rgba(215,25,33,0.20)"/><text x="384" y="292" class="step-number focal-text">03</text><text x="404" y="293" class="legend-text">Deliver</text>
      <rect x="480" y="284" width="24" height="12" rx="6" fill="rgba(26,26,26,0.12)"/><text x="492" y="292" class="step-number">04</text><text x="512" y="293" class="legend-text">Confirm</text>
      <rect x="580" y="284" width="24" height="12" rx="6" fill="rgba(26,26,26,0.12)"/><text x="592" y="292" class="step-number">05</text><text x="612" y="293" class="legend-text">Observe</text>

      <!-- Legend: data types -->
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="306" width="16" height="8" rx="3" fill="#9c6b50"/><text x="188" y="312" class="chip-text">FL</text><text x="202" y="314" class="legend-text">File</text>
      <rect x="252" y="306" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="260" y="312" class="chip-text">DB</text><text x="274" y="314" class="legend-text">Dataset</text>
      <rect x="340" y="306" width="16" height="8" rx="3" fill="#6e6479"/><text x="348" y="312" class="chip-text">WB</text><text x="362" y="314" class="legend-text">Published</text>
      <text x="436" y="314" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="333" x2="204" y2="333" stroke="#525252" marker-end="url(#arr-muted)"/><text x="212" y="336" class="legend-text">Standard handoff</text>
      <line x1="324" y1="333" x2="348" y2="333" stroke="#D71921" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="356" y="336" class="legend-text">Focal handoff</text>
      <line x1="460" y1="333" x2="484" y2="333" stroke="#2e5aa8" marker-end="url(#arr-link)"/><text x="492" y="336" class="legend-text">Published output</text>
    </svg>
    </div>
  </main>
</body>
</html>

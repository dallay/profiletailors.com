<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Governance, enforced in five surfaces</title>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F5F5F0;
      --color-ink:     #1A1A1A;
      --color-muted:   #525252;
      --color-accent:  #D71921;
      --font-sans:     'Space Grotesk', system-ui, sans-serif;
      --font-serif:    'Doto', monospace;
      --font-mono:     'Space Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    .diagram { overflow-x: auto; }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Diagram Design</p>
    <h1>Governance, enforced in five surfaces</h1>
    <p class="subtitle">CONTROL CATALOG → LAYER STACK · BALANCED · MIXED — 5 LAYERS, 1 FOCAL</p>

    <div class="diagram">
    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gov-title gov-desc">
      <title id="gov-title">Governance, enforced in five surfaces</title>
      <desc id="gov-desc">Layer stack showing privacy and governance controls grouped by where they are enforced, from browser signals down to operator review.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#525252"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5F5F0"/>

      <!-- Direction indicator: enforcement flows top to bottom -->
      <line x1="56" y1="48" x2="56" y2="344" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="56" y="368" fill="#525252" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ENFORCE ↓</text>

      <!-- L1: Browser -->
      <rect x="100" y="40" width="800" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.12)" stroke-width="1"/>
      <text x="124" y="76" fill="#525252" font-size="8" font-family="'Space Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="300" y="78" fill="#1A1A1A" font-size="16" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Consent banner · signals</text>
      <text x="876" y="76" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="end">DNT · GPC · block</text>

      <!-- L2: App -->
      <rect x="100" y="104" width="800" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.12)" stroke-width="1"/>
      <text x="124" y="140" fill="#525252" font-size="8" font-family="'Space Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="300" y="142" fill="#1A1A1A" font-size="16" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Settings · takedown · age</text>
      <text x="876" y="140" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="end">request · verify</text>

      <!-- L3: API -->
      <rect x="100" y="168" width="800" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.12)" stroke-width="1"/>
      <text x="124" y="204" fill="#525252" font-size="8" font-family="'Space Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="300" y="206" fill="#1A1A1A" font-size="16" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Consent · DSAR · isolation</text>
      <text x="876" y="204" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="end">append-only</text>

      <!-- L4: Data (focal) -->
      <rect x="100" y="232" width="800" height="64" rx="6" fill="#F5F5F0"/>
      <rect x="100" y="232" width="800" height="64" rx="6" fill="rgba(215,25,33,0.08)" stroke="#D71921" stroke-width="1.2"/>
      <text x="124" y="268" fill="#D71921" font-size="8" font-family="'Space Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="300" y="270" fill="#1A1A1A" font-size="16" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Retain · anonymize · remove</text>
      <text x="876" y="268" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="end">audited · 2-phase</text>

      <!-- L5: Operator -->
      <rect x="100" y="296" width="800" height="64" rx="6" fill="#F5F5F0" stroke="rgba(26,26,26,0.12)" stroke-width="1"/>
      <text x="124" y="332" fill="#525252" font-size="8" font-family="'Space Mono', monospace" letter-spacing="0.14em">L5</text>
      <text x="300" y="334" fill="#1A1A1A" font-size="16" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Audit log · safe-off</text>
      <text x="876" y="332" fill="#525252" font-size="9" font-family="'Space Mono', monospace" text-anchor="end">review · disable</text>

      <!-- Legend strip -->
      <line x1="40" y1="396" x2="960" y2="396" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
      <text x="40" y="412" fill="#525252" font-size="8" font-family="'Space Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="424" width="14" height="10" rx="2" fill="rgba(215,25,33,0.08)" stroke="#D71921" stroke-width="1"/>
      <text x="60" y="432" fill="#525252" font-size="8" font-family="'Space Grotesk', sans-serif">Focal · data holds the point of no return</text>

      <rect x="380" y="424" width="14" height="10" rx="2" fill="#F5F5F0" stroke="rgba(26,26,26,0.12)" stroke-width="1"/>
      <text x="400" y="432" fill="#525252" font-size="8" font-family="'Space Grotesk', sans-serif">Enforcement surface</text>
    </svg>
    </div>
  </div>
</body>
</html>

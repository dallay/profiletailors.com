packages:
  - apps/web/marketing
  - apps/web/app
  - apps/web/admin
  - tools/compliance
  - shared/web

minimumReleaseAge: 4320

allowBuilds:
  vue-demi: true
  esbuild: true
  sharp: true
  maplibre-gl: true

# Exact versions below bypass the minimum-release-age check for the Vue
# toolchain packages. Whenever any of these dependencies is bumped upstream
# (in pnpm catalogs or per-workspace manifests), update the pinned version
# here in lockstep and rerun `pnpm install`.
minimumReleaseAgeExclude:
  # Vue toolchain — pinned for compatibility with current catalogs
  - '@vue/language-core@3.3.5'
  - vue-tsc@3.3.5
  - '@vue/devtools-core@8.1.3'
  - '@vue/devtools-kit@8.1.3'
  - '@vue/devtools-shared@8.1.3'
  - vite-plugin-vue-devtools@8.1.3
  - vite@7.3.6

  # Biome 2.5.10 release
  - '@biomejs/biome@2.5.10'
  - '@biomejs/cli-darwin-arm64@2.5.10'
  - '@biomejs/cli-darwin-x64@2.5.10'
  - '@biomejs/cli-linux-arm64-musl@2.5.10'
  - '@biomejs/cli-linux-arm64@2.5.10'
  - '@biomejs/cli-linux-x64-musl@2.5.10'
  - '@biomejs/cli-linux-x64@2.5.10'
  - '@biomejs/cli-win32-arm64@2.5.10'
  - '@biomejs/cli-win32-x64@2.5.10'

  # Iconify / Lucide / i18n releases
  - '@iconify-json/lucide@1.2.125'
  - '@lucide/vue@1.34.0'
  - 'vue-i18n@11.4.9'
  - '@intlify/core-base@11.4.9'
  - '@intlify/devtools-types@11.4.9'
  - '@intlify/message-compiler@11.4.9'
  - '@intlify/shared@11.4.9'

  # Renovate security update: js-yaml@4.3.0 || 4.3.1
  - js-yaml@4.3.0 || 4.3.1
  # Renovate security update: vitest@4.0.0
  - vitest@4.0.0
  # Renovate security update: shell-quote@1.10.0
  - shell-quote@1.10.0
  # Renovate security update: @babel/core@7.29.6
  - "@babel/core@7.29.6"
  # Renovate security update: hono@4.12.34
  - hono@4.12.34

overrides:
  esbuild: ">=0.28.2"
  undici: ">=7.28.0 <9.0.0"
  hono: ">=4.13.1"
  js-yaml: "5.3.0"
  devalue: ">=5.9.0"
  yaml: "^2.9.0"
  "@babel/core": ">=8.0.1"

packages:
  - apps/web/marketing
  - apps/web/app
  - tools/compliance
  - shared/web

minimumReleaseAge: 4320

allowBuilds:
  vue-demi: true
  esbuild: true
  sharp: true
  maplibre-gl: true

# Exact versions below bypass the minimum-release-age check for the Vue
# toolchain packages. Whenever any of these dependencies is bumped upstream
# (in pnpm catalogs or per-workspace manifests), update the pinned version
# here in lockstep and rerun `pnpm install`.
minimumReleaseAgeExclude:
  # Vue toolchain — pinned for compatibility with current catalogs
  - '@vue/language-core@3.3.5'
  - vue-tsc@3.3.5
  - '@vue/devtools-core@8.1.3'
  - '@vue/devtools-kit@8.1.3'
  - '@vue/devtools-shared@8.1.3'
  - vite-plugin-vue-devtools@8.1.3
  - vite@7.3.6

  # TEMPORARY — added 2026-07-23, remove after July 24 once minimumReleaseAge cutoff passes.
  # @biomejs/biome@2.5.5 biome ecosystem (9 platform variants)
  - '@biomejs/biome@2.5.5'
  - '@biomejs/cli-darwin-arm64@2.5.5'
  - '@biomejs/cli-darwin-x64@2.5.5'
  - '@biomejs/cli-linux-arm64-musl@2.5.5'
  - '@biomejs/cli-linux-arm64@2.5.5'
  - '@biomejs/cli-linux-x64-musl@2.5.5'
  - '@biomejs/cli-linux-x64@2.5.5'
  - '@biomejs/cli-win32-arm64@2.5.5'
  - '@biomejs/cli-win32-x64@2.5.5'
  # @intlify/* + vue-i18n (4 transitive + 1 direct)
  - '@intlify/core-base@11.4.7'
  - '@intlify/devtools-types@11.4.7'
  - '@intlify/message-compiler@11.4.7'
  - '@intlify/shared@11.4.7'
  - 'vue-i18n@11.4.7'
  # Renovate security update: js-yaml@4.3.0
  - js-yaml@4.3.0
  # Renovate security update: vitest@4.0.0
  - vitest@4.0.0

overrides:
  esbuild: ">=0.28.1"
  undici: ">=7.28.0 <8.0.0"
  hono: ">=4.12.27"
  js-yaml: "4.3.0"
  devalue: ">=5.8.1"
  yaml: "^2.9.0"
  "@babel/core": ">=7.27.0"

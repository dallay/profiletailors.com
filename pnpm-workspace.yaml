packages:
  - apps/web/marketing
  - apps/web/app
  - apps/web/admin
  - tools/compliance
  - shared/web
  - shared/vue-ui

minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
trustPolicyExcludePrune: true

allowBuilds:
  vue-demi: true
  esbuild: true
  sharp: true
  maplibre-gl: true
  workerd: true
  '@sentry/cli': true

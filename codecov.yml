# Codecov configuration for profiletailors.com monorepo
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude
    project:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error
    changes: false

  precision: 2
  round: down
  range: 70..100

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "**/*Test.kt"
  - "**/*Tests.kt"
  - "**/test/**"
  - "docs/**"
  - "tmp/**"
  - "tools/**"
  - "**/build/**"
  - "**/generated/**"

# Align Codecov's scope with SonarQube:
# - project status reflects overall repo coverage across uploaded backend + frontend reports
# - patch status enforces the same 80% standard expected on changed code
# - carryforward is disabled so stale flag data cannot mask missing uploads

flags:
  smp:
    paths:
      - server/smp/
    carryforward: false

  backend:
    paths:
      - shared/
    carryforward: false

  frontend:
    paths:
      - apps/web/marketing/
      - apps/web/app/
    carryforward: false

component_management:
  individual_components:
    - component_id: backend
      name: Backend Services
      paths:
        - server/**
        - shared/**
    
    - component_id: smp
      name: Social Media Platform
      paths:
        - server/smp/**

    - component_id: frontend
      name: Frontend Marketing Site
      paths:
        - apps/web/marketing/**

    - component_id: web-app
      name: Web App SPA
      paths:
        - apps/web/app/**

github_checks:
  annotations: true

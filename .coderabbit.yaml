# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# ============================================================================
# Profile Tailors — CodeRabbit configuration (optimized)
# ----------------------------------------------------------------------------
# Optimized against docs.coderabbit.ai (Aug 2026). Goals:
#   1. Architectural enforcement with AST-grep precision (not just LLM hints)
#   2. Reduce noise: skip bot PRs, WIP titles, decoration
#   3. Tighten pre-merge gates so bad descriptions / missing docs / bad titles
#      actually block the merge
#   4. Add security tools we were missing: semgrep, trufflehog, actionlint,
#      zizmor
#   5. Move docstrings/unit_tests from the deprecated `code_generation.*`
#      schema to the current `finishing_touches.*` schema
# ============================================================================

early_access: true
inheritance: true
language: en-US

tone_instructions: >-
  Direct, constructive, educational. Focus on architecture, security,
  maintainability. Flag Hexagonal/Clean Arch violations assertively.

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary_in_walkthrough: true
  fail_commit_status: true
  collapse_walkthrough: true
  auto_apply_labels: true
  auto_assign_reviewers: true
  in_progress_fortune: false           # skip the "while you wait" fortune
  poem: false                          # never write a poem in a PR comment
  sequence_diagrams: true              # keep: useful for cross-context flows
  estimate_code_review_effort: true    # keep: helps reviewers prioritize
  assess_linked_issues: true           # keep: validate against OpenSpec/Linear
  related_issues: true
  related_prs: true
  changed_files_summary: true
  suggested_labels: true
  suggested_reviewers: true
  review_status: true
  review_details: true                 # show suppressed comments for traceability
  enable_prompt_for_ai_agents: true    # keep: useful for IDE handoff

  # ─── Suggested reviewers (org-specific assignment rules) ────────────────
  suggested_reviewers_instructions:
    - reviewers:
        - handle: backend-platform
          type: group
      instructions: >-
        Assign when the PR modifies Kotlin code under server/smp,
        build.gradle.kts, or shared Kotlin modules.

    - reviewers:
        - handle: frontend-platform
          type: group
      instructions: >-
        Assign when the PR modifies Vue/Astro/TypeScript code under
        apps/web/marketing, apps/web/app, apps/web/admin, or shared/web.

    - reviewers:
        - handle: security-pdl
          type: group
      instructions: >-
        Assign when the PR touches authentication, authorization, RLS,
        consent, secrets, crypto, or input validation.

  # ─── Mutually exclusive labels (keep PRs honest) ────────────────────────
  mutually_exclusive_groups:
    change-kind: [breaking-change, feature, fix, refactor]
    surface: [backend, frontend, infrastructure, docs]
    risk: [risk-critical, risk-high, risk-medium, risk-low]

  # ─── Path filters ───────────────────────────────────────────────────────
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/build/**'
    - '!**/.gradle/**'
    - '!**/coverage/**'
    - '!**/.idea/**'
    - '!**/.vscode/**'

  auto_title_instructions: >-
    Add a Conventional Commits prefix (https://www.conventionalcommits.org/).
    Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci,
    chore, revert. Optional scope in parentheses. Imperative mood, lowercase.

  # =========================================================================
  # PATH-SPECIFIC REVIEW INSTRUCTIONS
  # These complement AGENTS.md and the ast-grep rules. Keep them focused on
  # project-specific intent; let the AST rules handle the mechanical checks.
  # =========================================================================
  path_instructions:

    # ─── Backend · Domain layer (Hexagonal Arch · strictest layer) ───────
    - path: 'server/smp/src/main/kotlin/**/domain/**'
      instructions: |
        🚨 HEXAGONAL ARCHITECTURE · DOMAIN LAYER
        This layer is the heart of the architecture. ZERO framework deps.
        See .agents/skills/hexagonal-architecture/SKILL.md.

        STRICT RULES (also enforced by ast-grep rules in .coderabbit/rules):
        - Pure Kotlin only. NO Spring, R2DBC, Jakarta, Hibernate, Reactor,
          Jackson, or any framework import.
        - Use `com.profiletailors.common.domain.Service` instead of
          `@org.springframework.stereotype.Service`.
        - Aggregate roots are the ONLY public entry point (ADR-0015).
        - Cross-context references are identity-only — Id, Ids, Identifier
          (ADR-0016). Never import another context's entities.
        - Value objects are immutable with `@ValueObject` (ADR-0017).

        FLAG AS CRITICAL:
        - Any framework import that bypasses infrastructure.
        - Business logic leaking outside aggregate roots.
        - Mutable value objects or mutable shared state.

    # ─── Backend · Application layer (CQRS use cases) ─────────────────────
    - path: 'server/smp/src/main/kotlin/**/application/**'
      instructions: |
        APPLICATION LAYER · CQRS
        - Framework-agnostic orchestration only. NO infrastructure imports.
        - Commands: {Verb}XCommand → XHandler. Queries: GetXQuery → XHandler.
        - Handlers delegate to domain services/aggregates — never to
          repositories directly. Repositories are ports owned by domain.
        - Composition root wires adapters to ports; no `new` of adapters
          inside handlers.

    # ─── Backend · Infrastructure layer (Spring, R2DBC, HTTP) ─────────────
    - path: 'server/smp/src/main/kotlin/**/infrastructure/**'
      instructions: |
        INFRASTRUCTURE LAYER
        - Implements domain repository interfaces (never the reverse).
        - Controllers are THIN: translate DTO ↔ domain, call handler,
          return response. NO business logic in controllers.
        - NEVER expose persistence entities through the API; always DTOs.
        - HTTP endpoints follow REST + the versioned media type
          `application/vnd.api.v1+json`.
        - R2DBC repositories implement domain interfaces; never the reverse.

    # ─── Backend · Kotlin general ─────────────────────────────────────────
    - path: 'server/**/*.kt'
      instructions: |
        Kotlin conventions from .agents/skills/kotlin/SKILL.md and AGENTS.md.
        - Prefer `val` over `var`. Use sealed classes or Result<T> for errors.
        - Use `?.`, `?:`, `requireNotNull()` instead of `!!` (also enforced
          by ast-grep `no-null-assertion-in-kotlin`).
        - No `.block()` in coroutine flows. `suspend` for I/O.
        - Repository methods are `suspend`.
        - Do not log secrets, tokens, passwords, or PII.
        - Domain rule: `domain <- application <- infrastructure`.

    # ─── Backend · Tests ──────────────────────────────────────────────────
    - path: 'server/**/src/test/**'
      instructions: |
        Test conventions from AGENTS.md.
        - Names: `should do X when Y` in backticks.
        - Unit tests: Kotest assertions + MockK. Integration: Testcontainers.
        - Arrange-Act-Assert visible. Test behavior, not implementation.
        - `runTest` for coroutine testing.
        - Every new public domain behavior needs at least one unit test.
        - Every new endpoint needs at least one WebTestClient integration
          test (or BDD scenario).

    # ─── Frontend · Vue (dashboard SPA) ───────────────────────────────────
    - path: 'apps/web/app/**/*.vue'
      instructions: |
        Vue conventions from .agents/skills/vue/SKILL.md.
        - Composition API only with `<script setup lang="ts">`.
        - `defineProps<Props>()` with TS types, `withDefaults()` for defaults.
        - `defineEmits<{ (e: 'event', value: Type): void }>()`.
        - shadcn-vue from `@/components/ui` when possible.
        - Co-locate styles in `<style scoped>` using Tailwind design tokens.
        - a11y: semantic HTML, ARIA, keyboard nav. Form errors are announced.
        - No hardcoded colors. No business logic in components — extract to
          composables or Pinia stores.

    # ─── Frontend · Astro (marketing) ──────────────────────────────────────
    - path: 'apps/web/marketing/**/*.astro'
      instructions: |
        Astro conventions from .agents/skills/astro/SKILL.md.
        - Server-first, static-first, no SSR.
        - Client-side JS ONLY for interactive islands with `client:*`.
        - `<Image />` from `astro:assets` for all raster/optimized images.
        - All user-facing strings come from `src/i18n/` (en + es).
          Spanish copy can be longer; never use fixed-width containers.
        - No hardcoded strings. Semantic HTML and proper meta tags for SEO.

    # ─── Frontend · Admin (flat Vue SPA) ───────────────────────────────────
    - path: 'apps/web/admin/**/*.vue'
      instructions: |
        Admin SPA conventions. Flatter structure by design — do NOT force
        dashboard module folders here. Keep admin-internal imports clean.
        - Composition API with `<script setup lang="ts">`.
        - No cross-imports into `apps/web/app` or `apps/web/marketing`.

    # ─── Frontend · TypeScript (universal) ─────────────────────────────────
    - path: 'apps/**/*.ts'
      instructions: |
        TypeScript conventions from .agents/skills/typescript/SKILL.md.
        - No `any`. Use `unknown` and narrow. (Also enforced by ast-grep
          `no-any-type-annotation` and `no-as-any-cast`.)
        - Explicit return types on all exported functions.
        - Prefer `type` over `interface` unless declaration merging is needed.
        - Named exports only (no `default export`).
        - Pinia stores: `useXxxStore`. Composables: `useXxx.ts`.

    # ─── Frontend · Unit tests ─────────────────────────────────────────────
    - path: 'apps/**/__tests__/**'
      instructions: |
        Frontend unit tests.
        - Vitest. Test behavior, not implementation.
        - Names: `should X when Y` or descriptive sentences.
        - Arrange-Act-Assert. Isolate state. No shared mutable fixtures.

    - path: 'apps/**/*.spec.ts'
      instructions: |
        Co-located Vitest specs.
        - Same conventions as __tests__. Use `vi.mock()` only at boundaries.

    # ─── Frontend · E2E tests (Playwright) ────────────────────────────────
    - path: 'apps/**/e2e/**'
      instructions: |
        Playwright conventions from .agents/skills/playwright/SKILL.md.
        - User-facing locators: `getByRole`, `getByLabel`, `getByText`.
        - No XPath, no CSS-class selectors, no `data-testid` unless absolutely
          necessary and justified in a comment (AGENTS.md forbids comments —
          justify in the PR description instead).
        - Web-first assertions: `await expect(locator).toBeVisible()`.
        - No manual waits. `test.step()` for multi-step journeys.

    # ─── GitHub Actions workflows ──────────────────────────────────────────
    - path: '.github/workflows/**'
      instructions: |
        GitHub Actions security and correctness.
        - Pin actions to a full commit SHA, not a tag (ADR against supply-chain
          attacks).
        - Use least-privilege `permissions:` block.
        - Avoid `pull_request_target` triggers that run on fork PRs.
        - Never echo secrets; use masked env vars.
        - Also enforced by tools.actionlint and tools.zizmor.

    # ─── Root config files ────────────────────────────────────────────────
    - path: '{*.{yml,yaml,toml,json},*.{yml,yaml,toml,json}}'
      instructions: |
        Config files. Follow existing conventions in similar files. No
        hardcoded secrets or environment-specific values. Proper YAML/JSON
        structure and formatting.

    # ─── Documentation (Markdown) ──────────────────────────────────────────
    - path: '**/*.md'
      instructions: |
        Documentation rules from AGENTS.md.
        - English only. Lowercase `kebab-case.md` (except README.md).
        - Structure: Overview → Changes → Usage → Troubleshooting → References.
        - Update the relevant docs index when adding new documents.
        - No hardcoded user-facing strings (use locale files in apps).
        - Do NOT document planned behavior as implemented.

    # ─── Database migrations ──────────────────────────────────────────────
    - path: 'server/smp/src/main/resources/**/*.sql'
      instructions: |
        Database migrations.
        - Always provide a paired DOWN migration for every UP migration.
        - No DROP TABLE without restoration. No NOT NULL without default or
          backfill plan. (Also enforced by tools.squawk if added later.)
        - Document breaking schema changes in the PR description.

  # ─── Labeling instructions ──────────────────────────────────────────────
  labeling_instructions:
    - label: 'backend'
      instructions: 'Apply when PR contains Kotlin code, Spring Boot, R2DBC, or backend infrastructure.'
    - label: 'frontend'
      instructions: 'Apply when PR contains TypeScript, Vue, Astro, or frontend assets.'
    - label: 'infrastructure'
      instructions: 'Apply when PR modifies Dockerfiles, compose.yaml, portless.json, infra/, or CI workflows.'
    - label: 'architecture'
      instructions: 'Apply when PR introduces changes to domain models, application layer structure, or architectural patterns.'
    - label: 'security'
      instructions: 'Apply when PR touches authentication, authorization, RLS, input validation, secrets, or consent.'
    - label: 'database'
      instructions: 'Apply when PR includes database migrations, schema changes, or repository implementations.'
    - label: 'documentation'
      instructions: 'Apply when PR updates .agents/skills/, README, AGENTS.md, docs/, or API documentation.'
    - label: 'testing'
      instructions: 'Apply when PR adds or modifies tests (unit, integration, BDD, or E2E).'
    - label: 'breaking-change'
      instructions: 'Apply when PR introduces breaking changes to public APIs, schema, or external contracts. Must include a Breaking Change section in the PR description.'
    - label: 'do-not-review'
      instructions: 'Skip automatic review. Applied by the author when a PR is not ready.'
    - label: 'slop'
      instructions: 'Apply when the PR appears to be low-effort AI-generated content without meaningful verification.'

  # =========================================================================
  # AUTO REVIEW
  # =========================================================================
  auto_review:
    enabled: true
    drafts: true                       # review drafts to catch issues early
    auto_incremental_review: true      # re-run on each push
    auto_pause_after_reviewed_commits: 10  # pause after 10 reviewed pushes
    base_branches:
      - '.*'                           # review against any base branch
    ignore_title_keywords:
      - 'WIP'
      - 'DO NOT MERGE'
      - '[skip review]'
      - 'DRAFT'
      - 'ci: cache'
      - 'chore: bump'
    ignore_usernames:
      - 'dependabot[bot]'
      - 'renovate[bot]'
      - 'github-actions[bot]'
      - 'coderabbitai'

  # =========================================================================
  # SLOP DETECTION (Pro+ for private repos)
  # =========================================================================
  slop_detection:
    enabled: true
    label: 'slop'

  # =========================================================================
  # PRE-MERGE CHECKS — gates that actually block the merge
  # =========================================================================
  pre_merge_checks:
    override_requested_reviewers_only: true  # only reviewers can ignore failures

    docstrings:
      mode: warning
      threshold: 80                       # 80% coverage on changed functions

    title:
      mode: error
      requirements: >-
        Must follow Conventional Commits format with optional scope, e.g.
        `feat(auth): add password reset`. Imperative mood, lowercase, ≤72 chars.

    description:
      mode: error                          # was: warning. PRs need a real description.

    issue_assessment:
      mode: warning                        # linked issues assessment is non-blocking

    custom_checks:

      # ─── Hexagonal Architecture (precision via ast-grep + natural language)
      - name: 'Hexagonal Architecture Compliance'
        mode: error
        instructions: |
          Verify Hexagonal Architecture is followed:
          1. Domain layer has ZERO framework imports (Spring, R2DBC, Jakarta,
             Hibernate, Reactor, Jackson). ast-grep rules enforce this in
             .coderabbit/rules/no-framework-in-domain-*.yml.
          2. Application layer depends only on domain interfaces, never on
             infrastructure adapters.
          3. Infrastructure implements domain interfaces (never the reverse).
          4. CQRS pattern: {Verb}XCommand → XHandler for writes,
             GetXQuery → XHandler for reads.
          5. Controllers call handlers, never domain services directly.
          6. Cross-context references are identity-only (Id/Ids/Identifier).
          7. NO circular dependencies between layers.

      # ─── Security (focused, deterministic)
      - name: 'Security Review'
        mode: error
        instructions: |
          Check for security issues. FAIL if any apply:
          1. SQL injection: raw string concatenation into R2DBC queries
             (use parameterized queries).
          2. XSS: writing user input via `innerHTML`, `v-html`, or
             `dangerouslySetInnerHTML` without sanitization.
          3. Missing input validation on public endpoints.
          4. Missing authentication/authorization enforcement on protected
             endpoints.
          5. Committed secrets: API keys, tokens, passwords, private keys.
             (Also enforced by tools.gitleaks + tools.trufflehog.)
          6. Missing CSRF protection on state-changing routes.
          7. Logging of secrets, tokens, or PII.

      # ─── Test coverage (TDD enforcement)
      - name: 'Test Coverage (TDD)'
        mode: error
        instructions: |
          Every new business behavior must have a failing test FIRST
          (TDD is mandatory per AGENTS.md). FAIL if any apply:
          1. New domain logic without unit tests.
          2. New endpoint without WebTestClient integration test.
          3. New user-visible flow without E2E coverage.
          4. Tests testing implementation details instead of behavior.
          5. Missing assertions or empty test bodies.

      # ─── Resilience (reactive backend specifics)
      - name: 'Resilience Review'
        mode: warning
        instructions: |
          Check for resilience patterns:
          1. Proper error handling with sealed classes or Result<T>.
          2. Timeout configuration for external HTTP/DB calls.
          3. Retry/backoff for transient failures where safe.
          4. Circuit breaker for downstream dependencies.
          5. Reactive error propagation — NO swallowed exceptions
             (.onErrorContinue without logging, empty catch, etc.).
          6. Graceful degradation where appropriate.

      # ─── Readability (zero-comment policy, naming, structure)
      - name: 'Readability & Zero-Comment Policy'
        mode: warning
        instructions: |
          AGENTS.md enforces ZERO comments. FAIL if any apply:
          1. Inline comments, KDoc/TSDoc/docblocks (except shebangs and
             generated code markers).
          2. TODO/FIXME/HACK notes in code.
          3. Lint or type suppression directives (`@ts-ignore`, `//nolint`,
             `@Suppress` without explicit ADR-backed reason).
          4. Commented-out code.
          5. Functions longer than ~40 lines or files longer than ~400
             lines without strong justification.
          6. Names that don't reveal intent (x, tmp, data, foo, bar in
             non-test code).

      # ─── Breaking change discipline
      - name: 'Breaking Change Documentation'
        mode: error
        instructions: |
          All breaking changes to public APIs, CLI flags, environment
          variables, configuration keys, database schemas, or HTTP/GraphQL
          endpoints MUST be documented in:
          (a) a "Breaking Change" section of the PR description, AND
          (b) CHANGELOG.md.
          Exclude purely internal/private changes (code not exported from
          package entry points or explicitly marked internal).

      # ─── Architecture decision traceability
      - name: 'ADR Traceability for Architectural Changes'
        mode: warning
        instructions: |
          Changes to module boundaries, dependency directions, persistence
          adapters, or external integrations must reference an existing ADR
          in docs/architecture/adr/ or include a new ADR in the same PR.

  # =========================================================================
  # TOOLS — third-party linters and security scanners
  # =========================================================================
  tools:
    ast-grep:
      essential_rules: true              # security baseline
      rule_dirs:
        - '.coderabbit/rules'
      util_dirs:
        - '.coderabbit/utils'

    biome:
      enabled: true

    detekt:
      enabled: true

    gitleaks:
      enabled: true                      # Betterleaks (improved Gitleaks)

    trufflehog:
      enabled: true                      # verified secret scanner

    semgrep:
      enabled: true                      # SAST for security patterns

    yamllint:
      enabled: true

    hadolint:
      enabled: true                      # Dockerfile linting

    markdownlint:
      enabled: true

    actionlint:
      enabled: true                      # GitHub Actions workflow linting

    zizmor:
      enabled: true                      # GitHub Actions security analysis

    shellcheck:
      enabled: true                      # shell scripts in scripts/

    github-checks:
      enabled: true
      timeout_ms: 90000

  # =========================================================================
  # FINISHING TOUCHES — agentic post-review actions
  # (migrated from the deprecated `code_generation.*` schema)
  # =========================================================================
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false                     # opt-in per PR (default off)
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    custom:
      - name: 'verify-hexagonal-compliance'
        enabled: true
        instructions: >-
          Re-run the ast-grep rules in .coderabbit/rules/ and confirm that
          no new domain/application files violate the dependency rule.
          Report any violation with the file path, line, and matching rule.

      - name: 'tidy-openspec-trail'
        enabled: true
        instructions: >-
          If the PR introduces a durable behavior change, ensure the
          corresponding openspec/specs/<capability>.md is updated or a new
          openspec/changes/<name>/ exists with proposal, spec, and design.

      - name: 'conventional-commit-message'
        enabled: true
        instructions: >-
          Rewrite the squashed commit message to follow Conventional Commits
          (feat:, fix:, docs:, refactor:, perf:, test:, build:, ci:, chore:,
          revert:) with optional scope. Imperative mood, lowercase, ≤72 chars
          for the subject line.

# ============================================================================
# POST-MERGE ACTIONS — run after the PR is merged
# ============================================================================
post_merge_actions:
  - enabled: true
    name: 'changelog-and-openspec-sync'
    prompt: >-
      After merge, ensure the change is reflected in:
      (1) the relevant openspec/changes/<name>/ state.yaml is moved to
          completed with updated timestamp,
      (2) CHANGELOG.md has an entry under the appropriate section,
      (3) if the change touches a durable contract, openspec/specs/
          is updated to reflect the merged behavior.
      Open a follow-up PR titled "chore: sync specs for <original PR title>"
      with these changes. Reference the merged PR.

  - enabled: true
    name: 'notify-platform-team'
    prompt: >-
      Post a single concise summary to the #platform-team channel mentioning
      the merged PR URL, the area affected (backend/frontend/infra), and a
      one-line description of the behavior change. Skip if the PR only
      touches docs/ or tests/.

# ============================================================================
# KNOWLEDGE BASE — sources of truth for every review
# ============================================================================
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      # Auto-detected by default (kept for explicitness):
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CLA.md'
      - 'CODEX.md'
      - 'GEMINI.md'
      - '.cursorrules'
      - '.github/copilot-instructions.md'
      # Project-local canonical agent files:
      - '.agents/AGENTS.md'
      - '.agents/skills/**/*.md'
      - '.agents/skills/**/SKILL.md'
      # Architecture and contract artifacts:
      - 'docs/architecture/adr/**/*.md'
      - 'docs/architecture/c4/**/*.md'
      - 'openspec/specs/**/*.md'

  learnings:
    scope: auto                          # CodeRabbit learns from chat corrections

  issues:
    scope: auto                          # pull in linked GitHub/GitLab issues

  pull_requests:
    scope: auto                          # use prior PRs as context

  # Jira and Linear can be enabled when the integration is configured:
  # jira:
  #   scope: enabled
  # linear:
  #   scope: enabled

# ============================================================================
# CHAT
# ============================================================================
chat:
  auto_reply: true
  art: false                            # skip ASCII art in chat replies

# ============================================================================
# DEPRECATED SECTION (kept commented for reference)
# ----------------------------------------------------------------------------
# The following was the OLD schema (code_generation.*) and is no longer
# honored by CodeRabbit. Moved to reviews.finishing_touches.* above.
#
# code_generation:
#   docstrings:
#     language: en-US
#     path_instructions: ...
#   unit_tests:
#     path_instructions: ...
# ============================================================================

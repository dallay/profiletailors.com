# lefthook.yml - Git hooks para profiletailors.com (monorepo polyglot)
# Setup: npx lefthook install
#
# Configuración optimizada para monorepo con:
# - Frontend: Astro + TypeScript + Biome
# - Backend: Spring Boot + Kotlin + Detekt
#
# Features: Paralelismo, fail-fast, y configuración distribuida

# ---------- CONFIGURACIÓN GLOBAL ----------
# jobs: 0 = auto-detectar CPU cores, o setear número fijo
# fail_fast: true = parar al primer comando que falle
# source: permite configuración distribuida por directorio
jobs: 0
fail_fast: true


# ---------- PRE-COMMIT ----------
pre-commit:
  source: .lefthookrc.yml

  commands:
    # ========== FRONTEND (Astro + TypeScript) ==========
    # Biome: lint + format en archivos TypeScript/TSX del frontend
    # Se ejecuta en paralelo con backend commands
    frontend-biome:
      glob: 'apps/web/marketing/**/*.{ts,tsx}'
      run: 'cd apps/web/marketing && pnpm biome check --write --unsafe .'

    # Astro type check
    frontend-typecheck:
      glob: 'apps/web/marketing/**/*.{ts,tsx}'
      run: 'cd apps/web/marketing && pnpm astro check'
      skip: true

    # ========== BACKEND (Kotlin + Spring Boot) ==========
    # Detekt: lint estático en Kotlin
    backend-detekt:
      glob: 'server/**/*.kt'
      run: 'cd server/smp && ./gradlew detekt --no-daemon'

    # Detekt en shared modules
    shared-detekt:
      glob: 'shared/**/*.kt'
      run: 'cd shared/spring-boot-common && ../smp/gradlew detekt --no-daemon 2>/dev/null || ./gradlew detekt --no-daemon 2>/dev/null || echo "No detekt config in shared"'


# ---------- PRE-PUSH ----------
pre-push:
  source: .lefthookrc.yml

  commands:
    # Gitleaks: scan for secrets before push
    gitleaks:
      run: 'gitleaks detect --redact --exit-code 1'

    # Tests del backend antes de push.
    # The "modularity" tag excludes ModularStructureTest and ModularityVerificationTest,
    # which are pre-existing failures on main (Spring Modulith named-interface issue).
    backend-test:
      run: 'cd server/smp && ./gradlew test --no-daemon -PexcludeTags=modularity'


# ---------- CONFIGURACIÓN DISTRIBUIDA ----------
# Para agregar config específica por módulo, crea archivos .lefthookrc.yml
# en cada directorio:
#
# Ejemplo: apps/web/marketing/.lefthookrc.yml
# ```yaml
# pre-commit:
#   commands:
#     lint:
#       run: 'pnpm biome check --write --unsafe'
# ```
#
# El archivo .gitignore debe incluir:
# .lefthook/
# .lefthookrc.yml  # si no quieres commits de configs personales
# lefthook.yml — Git hooks for profiletailors.com (polyglot monorepo)
# Setup: npx lefthook install
#
# Optimized configuration for a monorepo with:
# - Frontend: Astro + TypeScript + Biome
# - Backend: Spring Boot + Kotlin + Detekt
#
# Features: parallelism, fail-fast, and distributed config via source

# ---------- GLOBAL CONFIG ----------
# jobs: 0 = auto-detect CPU cores, or set a fixed number
# fail_fast: true = stop at the first failing command
# source: enables per-directory distributed configuration
jobs: 0
fail_fast: true


# ---------- PRE-COMMIT ----------
pre-commit:
  source: .lefthookrc.yml

  commands:
    # ========== FRONTEND (Astro + Vue + TypeScript) ==========
    # Biome: lint + format for ALL projects under apps/web
    # Covers marketing (Astro) and app (Vue 3) with a single command
    frontend-biome:
      glob: 'apps/web/**/*.{ts,tsx,js,jsx,vue,astro}'
      run: 'cd apps/web && pnpm biome check --write --unsafe .'

    # Astro type check (marketing only)
    frontend-typecheck:
      glob: 'apps/web/**/*.{ts,tsx}'
      run: 'cd apps/web/marketing && pnpm astro check'
      skip: true

    # ========== BACKEND (Kotlin + Spring Boot) ==========
    # Spotless: auto-format Kotlin with ktlint — fixes what it can
    # NOTE: spotlessApply fixes on disk but does NOT re-stage — we chain git add -u
    backend-spotless:
      run: './gradlew spotlessApply --no-daemon && git add -u'

    # Detekt: static analysis (NOT formatting — spotless handles that)
    backend-detekt:
      run: './gradlew :server:smp:detekt --no-daemon'

    # Detekt on shared modules
    shared-detekt:
      run: './gradlew detekt --no-daemon'

    # Gitleaks: scan staged content before commit
    gitleaks:
      run: 'gitleaks protect --staged --redact --exit-code 1 --config .gitleaks.toml'


# ---------- PRE-PUSH ----------
pre-push:
  source: .lefthookrc.yml

  commands:
    # Gitleaks: scan the commit range being pushed using refs provided by pre-push stdin
    gitleaks-range:
      run: 'while read local_ref local_sha remote_ref remote_sha; do if [ -z "$local_sha" ] || [ "$local_sha" = "0000000000000000000000000000000000000000" ]; then continue; fi; if [ "$remote_sha" = "0000000000000000000000000000000000000000" ]; then log_opts="$local_sha --not --remotes=origin"; else log_opts="$remote_sha..$local_sha"; fi; gitleaks git --redact --exit-code 1 --config .gitleaks.toml --log-opts="$log_opts"; done'

    # Backend tests before push.
    # The "modularity" tag excludes ModularStructureTest and ModularityVerificationTest,
    # which are pre-existing failures on main (Spring Modulith named-interface issue).
    # The "postgres" tag excludes Postgres integration tests that require Docker/Testcontainers
    # and are currently failing (pre-existing issue).
    backend-test:
      run: './gradlew :server:smp:test -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest --no-daemon -PexcludeTags=modularity,postgres'


# ---------- DISTRIBUTED CONFIG ----------
# To add module-specific config, create .lefthookrc.yml files
# in each directory:
#
# Example: apps/web/marketing/.lefthookrc.yml
# ```yaml
# pre-commit:
#   commands:
#     lint:
#       run: 'pnpm biome check --write --unsafe'
# ```
#
# ---------- POST-CHECKOUT / POST-MERGE / POST-REWRITE ----------
# AgentSync: sync agent config (skills, commands) after any
# checkout, merge, or rewrite — keeps local tooling in sync
# without inventing a second hook system.
post-checkout:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync apply || true

post-merge:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync apply || true

post-rewrite:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync apply || true



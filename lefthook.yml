# lefthook.yml — Git hooks for profiletailors.com (polyglot monorepo)
# Setup: npx lefthook install
#
# Optimized configuration for a monorepo with:
# - Frontend: Astro + TypeScript + Biome
# - Backend: Spring Boot + Kotlin + Detekt
#
# Features: parallelism, fail-fast, and distributed config via source

# ---------- GLOBAL CONFIG ----------
# jobs: 0 = auto-detect CPU cores, or set a fixed number
# fail_fast: true = stop at the first failing command
# source: enables per-directory distributed configuration
jobs: 0
fail_fast: true


# ---------- PRE-COMMIT ----------
pre-commit:
  source: .lefthookrc.yml

  commands:
    # ========== FRONTEND (Astro + Vue + TypeScript) ==========
    # Biome: validate only staged files under apps/web (no auto-fix)
    # Uses {staged_files} so partial commits are preserved. Auto-fixes are
    # applied manually with `pnpm biome format --write` before commit to
    # match what CI's `biome ci` expects (one consistent format).

    # Astro type check (marketing only)
    frontend-typecheck:
      glob: 'apps/web/**/*.{ts,tsx}'
      run: 'cd apps/web/marketing && pnpm astro check'
      skip: true

    # ========== BACKEND (Kotlin + Spring Boot) ==========
    # Spotless: auto-format Kotlin with ktlint — fixes what it can
    # NOTE: spotlessApply fixes on disk but does NOT re-stage — we re-add only the
    # files already staged so partial/per-slice commits stay scoped (never a blanket
    # `git add -u` of the whole working tree).
    backend-spotless:
      run: './gradlew spotlessCheck --no-daemon'

    # Detekt: static analysis (NOT formatting — spotless handles that)
    # Moved to pre-push to avoid heavy checks on every commit

    # Gitleaks: scan staged content before commit
    gitleaks:
      run: 'gitleaks protect --staged --redact --exit-code 1 --config .gitleaks.toml'

    # Docs: lychee offline check on staged Markdown only (fast, no network).
    # Catches broken relative links at commit time; externals are covered by CI.
    docs-links:
      run: '{ command -v lychee >/dev/null || { echo "lychee not installed, skipping docs link check"; exit 0; }; files=$(git diff --cached --name-only --diff-filter=ACM -- "*.md" "*.mdx" ":!openspec/**"); if [ -z "$files" ]; then exit 0; fi; printf "%s\n" "$files" | xargs lychee --offline --no-progress; }'

    # Docs: markdownlint on staged Markdown only (--no-globs scopes the run to
    # the given files while keeping the configured rules; ":" marks literals).
    docs-lint:
      run: '{ command -v pnpm >/dev/null || { echo "pnpm not installed, skipping docs lint"; exit 0; }; files=$(git diff --cached --name-only --diff-filter=ACM -- "*.md" "*.mdx" ":!openspec/**" ":!**/CHANGELOG.md"); if [ -z "$files" ]; then exit 0; fi; printf "%s\n" "$files" | sed "s/^/:/" | xargs pnpm exec markdownlint-cli2 --no-globs; }'


# ---------- PRE-PUSH ----------
pre-push:
  source: .lefthookrc.yml

  commands:
    # Spotless: automatically apply Kotlin formatting before push (will stage changes)
    backend-spotless-apply:
      run: './gradlew spotlessApply --no-daemon && git add -u'

    # Spotless: verify Kotlin formatting before push
    backend-spotless:
      run: './gradlew spotlessCheck --no-daemon'

    backend-detekt:
      run: './gradlew :server:smp:detekt --no-daemon'

    shared-detekt:
      run: './gradlew detekt --no-daemon'

    # Gitleaks: scan the commit range being pushed using refs provided by pre-push stdin
    # DISABLED: Scanning git history on push is slow and gets killed on large histories.
    # - pre-commit gitleaks protect --staged catches staged secrets before commit
    # - GitHub Actions runs gitleaks on every push anyway
    # Re-enable with skip: false if needed
    gitleaks-range:
      run: 'echo "gitleaks-range disabled — gitleaks protect runs on pre-commit and CI gates on push"'
      skip: true

    # Backend tests before push.
    # The "postgres" tag excludes Postgres integration tests that require Docker/Testcontainers
    # and are currently failing (pre-existing issue).
    backend-test:
      run: './gradlew :server:smp:test -x :server:smp:bddFastTest -x :server:smp:bddPostgresTest --no-daemon -PexcludeTags=postgres'


# ---------- DISTRIBUTED CONFIG ----------
# To add module-specific config, create .lefthookrc.yml files
# in each directory:
#
# Example: apps/web/marketing/.lefthookrc.yml
# ```yaml
# pre-commit:
#   commands:
#     lint:
#       run: 'pnpm biome check --write --unsafe'
# ```
#
# ---------- POST-CHECKOUT / POST-MERGE / POST-REWRITE ----------
# AgentSync: sync agent config (skills, commands) after any
# checkout, merge, or rewrite — keeps local tooling in sync
# without inventing a second hook system.
post-checkout:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync apply || true

post-merge:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync apply || true

post-rewrite:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync apply || true



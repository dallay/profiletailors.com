server:
  port: ${SMP_BACKEND_PORT:7638}

spring:
  application:
    name: smp
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SMP_JWT_ISSUER_URI:http://localhost/profiletailors-local}
  ai:
    mcp:
      server:
        # Feature flag — single source of truth for MCP enablement (PR 1 spike outcome §1.5).
        # When false, Spring AI's transport bean is excluded entirely; the existing REST
        # endpoints remain unaffected.
        enabled: ${SMP_MCP_ENABLED:false}
        protocol: STATELESS
        type: ASYNC
        streamable-http:
          mcp-endpoint: /api/mcp
  r2dbc:
    url: ${SMP_R2DBC_URL:r2dbc:postgresql://localhost:5432/profiletailors_smp}
    username: ${SMP_DB_USERNAME:profiletailors}
    password: ${SMP_DB_PASSWORD:CHANGE_ME}
  liquibase:
    enabled: ${SMP_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${SMP_LIQUIBASE_CONTEXTS:prod}
    url: ${SMP_LIQUIBASE_JDBC_URL:jdbc:postgresql://localhost:5432/profiletailors_smp}
    user: ${SMP_DB_USERNAME:profiletailors}
    password: ${SMP_DB_PASSWORD:CHANGE_ME}
  # SMTP is intentionally absent here. Set SMP_SMTP_HOST via environment variable to
  # activate SmtpEmailSender (staging/prod). Without it, MockEmailSender is used.

application:
  rate-limit:
    auth:
      enabled: false
    business:
      enabled: false
    resume:
      enabled: false
    waitlist:
      # Default OFF. Two production blockers (DALLAY-512 distributed bucket backend and
      # DALLAY-513 trusted-proxy / ForwardedHeaderFilter wiring) prevent safe enablement
      # while SMP runs behind Kubernetes or Cloud Run ingress with multiple replicas.
      # Operators must set SMP_WAITLIST_RATE_LIMIT_ENABLED=true explicitly to turn it on.
      enabled: ${SMP_WAITLIST_RATE_LIMIT_ENABLED:false}
      endpoints:
        - /api/waitlists
      limit:
        name: waitlist-per-minute
        capacity: ${SMP_WAITLIST_RATE_LIMIT_CAPACITY:10}
        refill-tokens: ${SMP_WAITLIST_RATE_LIMIT_REFILL_TOKENS:10}
        refill-duration: ${SMP_WAITLIST_RATE_LIMIT_REFILL_DURATION:PT1M}

app:
  identity:
    registration:
      enabled: ${SMP_REGISTRATION_ENABLED:false}
  security:
    cors:
      allowed-origins: ${SMP_CORS_ALLOWED_ORIGINS:}  # comma-separated, empty = no CORS access
      allow-credentials: ${SMP_CORS_ALLOW_CREDENTIALS:true}
    local-jwt:
      secret: ${SMP_LOCAL_JWT_SECRET:}
      issuer: ${SMP_LOCAL_JWT_ISSUER:http://localhost/profiletailors-local}
      ttl-seconds: ${SMP_LOCAL_JWT_TTL_SECONDS:900}
    refresh-session:
      cookie-name: ${SMP_REFRESH_COOKIE_NAME:pt_refresh}
      cookie-path: ${SMP_REFRESH_COOKIE_PATH:/api/auth}
      same-site: ${SMP_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${SMP_REFRESH_COOKIE_SECURE:true}
      ttl-seconds: ${SMP_REFRESH_TTL_SECONDS:604800}
  email:
    sender: ${SMP_EMAIL_SENDER:noreply@profiletailors.com}
    verification-subject-prefix: ${SMP_EMAIL_VERIFICATION_SUBJECT_PREFIX:[Profile Tailors]}
    resend:
      api-key: ${SMP_RESEND_API_KEY:}  # empty = disabled; ResendEmailSender is not loaded
  # MCP server (PR 1 foundation). The transport endpoint is gated by
  # `spring.ai.mcp.server.enabled` above; these keys carry Profile Tailors-specific
  # data consumed by the security chain (PR 2) and tool authorizer (PR 3).
  mcp:
    resource-uri: ${SMP_MCP_RESOURCE_URI:https://api.profiletailors.com/api/mcp}
    required-audience: ${SMP_MCP_AUDIENCE:https://api.profiletailors.com/api/mcp}

media:
  # SMP_MEDIA_PREVIEW_SIGNING_SECRET is intentionally required in non-test
  # environments by ProductionCredentialsValidator. A blank value here would
  # let Spring resolve the ${SMP_...} placeholder to empty, which the
  # validator must catch.
  preview-signing-secret: ${SMP_MEDIA_PREVIEW_SIGNING_SECRET:}
  dedup:
    enabled: ${SMP_MEDIA_DEDUP_ENABLED:true}

platform:
  workspace-context:
    header-name: ${SMP_WORKSPACE_HEADER_NAME:X-Workspace-Id}
  storage:
    default: ${SMP_STORAGE_DEFAULT:attachments}
    providers:
      attachments:
        type: ${SMP_STORAGE_PROVIDER_TYPE:local}
        bucket: ${SMP_STORAGE_ATTACHMENTS_BUCKET:profiletailors-attachments}
        account-id: ${SMP_STORAGE_R2_ACCOUNT_ID:}
        access-key-id: ${SMP_STORAGE_R2_ACCESS_KEY_ID:}
        secret-access-key: ${SMP_STORAGE_R2_SECRET_ACCESS_KEY:}
        endpoint: ${SMP_STORAGE_R2_ENDPOINT:}
        base-path: ${SMP_STORAGE_LOCAL_BASE_PATH:./tmp/profiletailors-storage}
      local:
        type: local
        base-path: ${SMP_STORAGE_LOCAL_BASE_PATH:./tmp/profiletailors-storage}
  media:
    context:
      integration:
        enabled: ${SMP_MEDIA_CONTEXT_INTEGRATION_ENABLED:true}
  hooks:
    audit:
      enabled: ${SMP_PLATFORM_AUDIT_ENABLED:false}
    metrics:
      enabled: ${SMP_PLATFORM_METRICS_ENABLED:false}
    rate-limit:
      enabled: ${SMP_PLATFORM_RATE_LIMIT_ENABLED:true}

publishing:
  worker:
    enabled: ${SMP_PUBLISHING_WORKER_ENABLED:false}
    poll-interval: ${SMP_PUBLISHING_WORKER_POLL_INTERVAL:PT30S}
    blocked-recovery-interval: ${SMP_PUBLISHING_BLOCKED_RECOVERY_INTERVAL:PT5M}
    claim-lease: ${SMP_PUBLISHING_WORKER_CLAIM_LEASE:PT2M}
    max-retries: ${SMP_PUBLISHING_MAX_RETRIES:3}
    retry-backoff: ${SMP_PUBLISHING_RETRY_BACKOFF:PT5M}
  linkedin:
    client-id: ${SMP_LINKEDIN_CLIENT_ID:}
    client-secret: ${SMP_LINKEDIN_CLIENT_SECRET:}
    state-signing-secret: ${SMP_LINKEDIN_STATE_SIGNING_SECRET:CHANGE_ME_LINKEDIN_STATE}
    redirect-uri: ${SMP_LINKEDIN_REDIRECT_URI:}
    scopes: ${SMP_LINKEDIN_SCOPES:w_member_social,openid,profile,email}
    # Keep api-base-url pointed at real LinkedIn for OAuth userinfo; override publishing-api-base-url
    # locally to a WireMock/MockServer instance to exercise publishing without posting publicly.
    api-base-url: ${SMP_LINKEDIN_API_BASE_URL:https://api.linkedin.com}
    publishing-api-base-url: ${SMP_LINKEDIN_PUBLISHING_API_BASE_URL:${publishing.linkedin.api-base-url}}
    authorization-base-url: ${SMP_LINKEDIN_AUTHORIZATION_BASE_URL:https://www.linkedin.com/oauth/v2/authorization}
    token-base-url: ${SMP_LINKEDIN_TOKEN_BASE_URL:https://www.linkedin.com/oauth/v2/accessToken}
    api-version: ${SMP_LINKEDIN_API_VERSION:202606}
  credentials:
    encryption:
      key: ${PUBLISHING_CREDENTIALS_ENCRYPTION_KEY:}  # Sin default — debe configurarse via env var

# Media provider adapters (Hexagonal: ports under media-library.application.port;
# adapters live under mediaprovider.*).
mediaprovider:
  unsplash:
    # Optional Unsplash integration. Register the adapter only when this is true
    # AND UNSPLASH_ACCESS_KEY is configured.
    enabled: ${SMP_MEDIAPROVIDER_UNSPLASH_ENABLED:false}
    # API key — MUST be set via env var when the Unsplash integration is enabled.
    access-key: ${UNSPLASH_ACCESS_KEY:}
    base-url: ${SMP_MEDIAPROVIDER_UNSPLASH_BASE_URL:https://api.unsplash.com}
    timeout: ${SMP_MEDIAPROVIDER_UNSPLASH_TIMEOUT:PT5S}
    page-size: ${SMP_MEDIAPROVIDER_UNSPLASH_PAGE_SIZE:20}
    max-import-bytes: ${SMP_MEDIAPROVIDER_UNSPLASH_MAX_IMPORT_BYTES:26214400}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,r2dbc
          show-details: when-authorized
        liveness:
          include: livenessState
          show-details: never
    info:
      enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:default}
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: 30s
  server:
    port: ${MANAGEMENT_PORT:9091}  # Puerto separado para management

---
spring:
  config:
    activate:
      on-profile: test

media:
  preview-signing-secret: ${SMP_MEDIA_PREVIEW_SIGNING_SECRET:test-media-preview-signing-secret}

publishing:
  linkedin:
    state-signing-secret: ${SMP_LINKEDIN_STATE_SIGNING_SECRET:test-linkedin-oauth-state-secret}
  credentials:
    encryption:
      key: ${PUBLISHING_CREDENTIALS_ENCRYPTION_KEY:test-encryption-credentials-dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwMTI=}  # Base64 test key (32 bytes)

management:
  server:
    port: ${MANAGEMENT_PORT:8080}  # En test, mismo puerto está OK

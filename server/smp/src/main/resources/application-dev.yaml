spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: true
  # Mailpit local SMTP — no auth, no TLS. Web UI: http://localhost:8025
  mail:
    host: ${SMP_SMTP_HOST:localhost}
    port: ${SMP_SMTP_PORT:1025}
    username: ${SMP_SMTP_USERNAME:}
    password: ${SMP_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false

logging:
  level:
    com.profiletailors: DEBUG
    com.profiletailors.smp.media: DEBUG
    com.profiletailors.storage: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.http.codec.multipart: DEBUG

publishing:
  credentials:
    encryption:
      key: ${PUBLISHING_CREDENTIALS_KEY:dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwMTI=}  # Base64 test key for dev

management:
  server:
    port: ${MANAGEMENT_PORT:9091}  # En dev, mismo puerto que la app

app:
  email:
    publicAppUrl: "https://pt-app.localhost:1355"
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "https://pt-app.localhost:1355"
        - "https://pt-app.localhost"

platform:
  storage:
    default: attachments
    providers:
      attachments:
        type: local
        base-path: ${SMP_STORAGE_LOCAL_BASE_PATH:./tmp/profiletailors-storage}

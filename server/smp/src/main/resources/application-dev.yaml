spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: true
  liquibase:
    contexts: ${SMP_LIQUIBASE_CONTEXTS:dev}
  # Mailpit local SMTP — no auth, no TLS. Web UI: http://localhost:8025
  mail:
    host: ${SMP_SMTP_HOST:localhost}
    port: ${SMP_SMTP_PORT:1025}
    username: ${SMP_SMTP_USERNAME:}
    password: ${SMP_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false

logging:
  file:
    name: ../../logs/smp.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      total-size-cap: 500MB
  level:
    com.profiletailors: DEBUG
    com.profiletailors.smp.media: DEBUG
    com.profiletailors.storage: DEBUG
    com.profiletailors.smp.publishing.infrastructure.scheduling: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.http.codec.multipart: DEBUG

publishing:
  worker:
    enabled: ${SMP_PUBLISHING_WORKER_ENABLED:true}
  linkedin:
    state-signing-secret: ${SMP_LINKEDIN_STATE_SIGNING_SECRET:profiletailors-dev-oauth-state-secret}
  credentials:
    encryption:
      key: ${PUBLISHING_CREDENTIALS_ENCRYPTION_KEY:test-encryption-credentials-dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwMTI=}  # Base64 test key for dev

management:
  server:
    port: ${MANAGEMENT_PORT:9091}  # En dev, mismo puerto que la app

app:
  email:
    publicAppUrl: "https://pt-app.localhost:1355"
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://pt-admin.localhost:5174"
        - "https://pt-app.localhost:1355"
        - "https://pt-app.localhost"

profile-tailors:
  features:
    password-recovery:
      enabled: true  # Set to false if email/tokens not operational

platform:
  storage:
    default: attachments
    providers:
      attachments:
        type: local
        base-path: ${SMP_STORAGE_LOCAL_BASE_PATH:./tmp/profiletailors-storage}

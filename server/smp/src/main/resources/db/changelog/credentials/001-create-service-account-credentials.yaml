databaseChangeLog:
  - changeSet:
      id: credentials-001-create-service-account-credentials
      author: acosta
      changes:
        - createTable:
            tableName: service_account_credentials
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_service_account_credentials_principal
                    references: principals(id)
              - column:
                  name: provider
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: credential_reference
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: service_account_credentials
            columnNames: provider, credential_reference
            constraintName: uq_service_account_credentials_provider_reference

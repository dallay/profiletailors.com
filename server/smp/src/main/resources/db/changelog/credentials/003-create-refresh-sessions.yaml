databaseChangeLog:
  - changeSet:
      id: credentials-003-create-refresh-sessions
      author: opencode
      changes:
        - createTable:
            tableName: refresh_sessions
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refresh_sessions_principal
                    references: principals(id)
              - column:
                  name: lookup_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: token_verifier
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamp with time zone
              - column:
                  name: rotated_at
                  type: timestamp with time zone
              - column:
                  name: replaced_by_session_id
                  type: varchar(64)
                  constraints:
                    foreignKeyName: fk_refresh_sessions_replaced_by
                    references: refresh_sessions(id)
              - column:
                  name: replaced_session_id
                  type: varchar(64)
                  constraints:
                    foreignKeyName: fk_refresh_sessions_replaced_session
                    references: refresh_sessions(id)
              - column:
                  name: last_used_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: refresh_sessions
            columnNames: lookup_key
            constraintName: uq_refresh_sessions_lookup_key

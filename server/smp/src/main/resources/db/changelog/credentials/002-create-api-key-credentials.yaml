databaseChangeLog:
  - changeSet:
      id: credentials-002-create-api-key-credentials
      author: opencode
      changes:
        - createTable:
            tableName: api_key_credentials
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_api_key_credentials_principal
                    references: principals(id)
              - column:
                  name: lookup_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: key_prefix
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: secret_verifier
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: api_key_credentials
            columnNames: lookup_key
            constraintName: uq_api_key_credentials_lookup_key

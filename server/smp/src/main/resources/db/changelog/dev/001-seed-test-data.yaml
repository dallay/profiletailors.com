databaseChangeLog:
  - changeSet:
      id: dev-001-seed-test-data
      author: opencode
      context: dev
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: principals
      changes:
        - loadData:
            file: db/changelog/data/dev/principals_dev.csv
            relativeToChangelogFile: false
            separator: ";"
            quotchar: '"'
            tableName: principals
            columns:
              - column:
                  name: created_at
                  type: STRING

        - loadData:
            file: db/changelog/data/dev/user_identities_dev.csv
            relativeToChangelogFile: false
            separator: ";"
            quotchar: '"'
            tableName: user_identities
            columns:
              - column:
                  name: created_at
                  type: STRING

        - loadData:
            file: db/changelog/data/dev/local_password_credentials_dev.csv
            relativeToChangelogFile: false
            separator: ";"
            quotchar: '"'
            tableName: local_password_credentials
            columns:
              - column:
                  name: created_at
                  type: STRING
              - column:
                  name: updated_at
                  type: STRING

        - loadData:
            file: db/changelog/data/dev/workspaces_dev.csv
            relativeToChangelogFile: false
            separator: ";"
            quotchar: '"'
            tableName: workspaces
            columns:
              - column:
                  name: created_at
                  type: STRING

        - loadData:
            file: db/changelog/data/dev/workspace_ownerships_dev.csv
            relativeToChangelogFile: false
            separator: ";"
            quotchar: '"'
            tableName: workspace_ownerships
            columns:
              - column:
                  name: created_at
                  type: STRING

        - loadData:
            file: db/changelog/data/dev/workspace_memberships_dev.csv
            relativeToChangelogFile: false
            separator: ";"
            quotchar: '"'
            tableName: workspace_memberships
            columns:
              - column:
                  name: created_at
                  type: STRING

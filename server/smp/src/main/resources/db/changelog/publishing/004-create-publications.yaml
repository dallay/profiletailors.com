databaseChangeLog:
  - changeSet:
      id: publishing-004-create-publications
      author: acosta
      changes:
        - createTable:
            tableName: publications
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_publications_workspace
                    references: workspaces(id)
              - column:
                  name: author_principal_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_publications_author
                    references: principals(id)
              - column:
                  name: provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: social_account_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_publications_social_account
                    references: social_accounts(id)
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: schedule_mode
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: body_text
                  type: text
              - column:
                  name: scheduled_for
                  type: timestamp with time zone
              - column:
                  name: next_slot_after
                  type: timestamp with time zone
              - column:
                  name: published_at
                  type: timestamp with time zone
              - column:
                  name: failed_at
                  type: timestamp with time zone
              - column:
                  name: external_publication_id
                  type: varchar(255)
              - column:
                  name: last_error_code
                  type: varchar(128)
              - column:
                  name: last_error_message
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

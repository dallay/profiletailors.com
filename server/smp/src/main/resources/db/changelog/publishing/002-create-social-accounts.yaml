databaseChangeLog:
  - changeSet:
      id: publishing-002-create-social-accounts
      author: opencode
      changes:
        - createTable:
            tableName: social_accounts
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: social_connection_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_social_accounts_connection
                    references: social_connections(id)
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_social_accounts_workspace
                    references: workspaces(id)
              - column:
                  name: provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: provider_account_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: account_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: profile_urn
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: social_accounts
            columnNames: workspace_id, provider, provider_account_id
            constraintName: uq_social_accounts_workspace_provider_account

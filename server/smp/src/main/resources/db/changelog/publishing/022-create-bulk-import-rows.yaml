databaseChangeLog:
  - changeSet:
      id: publishing-022-create-bulk-import-rows
      author: opencode
      changes:
        - createTable:
            tableName: bulk_import_rows
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bulk_import_rows_job
                    references: bulk_import_jobs(id)
              - column:
                  name: row_index
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: publication_id
                  type: varchar(64)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_bulk_import_rows_publication
                    references: publications(id)
              - column:
                  name: errors
                  type: jsonb
              - column:
                  name: body_text
                  type: text
              - column:
                  name: scheduled_for
                  type: timestamp with time zone
              - column:
                  name: media_urls
                  type: text
              - column:
                  name: has_conflict
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: bulk_import_rows
            indexName: idx_bulk_import_rows_job_row_index
            columns:
              - column:
                  name: job_id
              - column:
                  name: row_index
      rollback:
        - dropTable:
            tableName: bulk_import_rows

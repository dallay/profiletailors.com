databaseChangeLog:
  - changeSet:
      id: publishing-001-create-social-connections
      author: acosta
      changes:
        - createTable:
            tableName: social_connections
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_social_connections_workspace
                    references: workspaces(id)
              - column:
                  name: provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: provider_connection_ref
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: credential_reference
                  type: varchar(255)
              - column:
                  name: connected_at
                  type: timestamp with time zone
              - column:
                  name: last_synced_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: social_connections
            columnNames: workspace_id, provider, provider_connection_ref
            constraintName: uq_social_connections_workspace_provider_ref
        - createIndex:
            tableName: social_connections
            indexName: idx_social_connections_workspace_provider
            columns:
              - column:
                  name: workspace_id
              - column:
                  name: provider

databaseChangeLog:
  - changeSet:
      id: publishing-023-provider-aware-secure-credentials
      author: profiletailors
      changes:
        - addColumn:
            tableName: secure_credentials
            columns:
              - column:
                  name: provider
                  type: varchar(32)
                  defaultValue: LINKEDIN
                  constraints:
                    nullable: false
              - column:
                  name: access_token_expires_at
                  type: timestamptz
              - column:
                  name: refresh_token_expires_at
                  type: timestamptz
              - column:
                  name: last_refresh_attempt_at
                  type: timestamptz
              - column:
                  name: last_refresh_status
                  type: varchar(32)
              - column:
                  name: granted_scopes
                  type: text
        - addUniqueConstraint:
            tableName: secure_credentials
            columnNames: owner_type, owner_id, provider
            constraintName: uq_secure_credentials_owner_provider
      rollback:
        - dropUniqueConstraint:
            tableName: secure_credentials
            constraintName: uq_secure_credentials_owner_provider
        - dropColumn:
            tableName: secure_credentials
            columnName: granted_scopes
        - dropColumn:
            tableName: secure_credentials
            columnName: last_refresh_status
        - dropColumn:
            tableName: secure_credentials
            columnName: last_refresh_attempt_at
        - dropColumn:
            tableName: secure_credentials
            columnName: refresh_token_expires_at
        - dropColumn:
            tableName: secure_credentials
            columnName: access_token_expires_at
        - dropColumn:
            tableName: secure_credentials
            columnName: provider

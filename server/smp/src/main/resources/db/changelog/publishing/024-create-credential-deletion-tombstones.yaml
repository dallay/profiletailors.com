databaseChangeLog:
  - changeSet:
      id: publishing-024-create-credential-deletion-tombstones
      author: profiletailors
      changes:
        - createTable:
            tableName: credential_deletion_tombstones
            columns:
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: connection_id
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: provider_connection_ref
                  type: varchar(256)
                  constraints:
                    nullable: false
              - column:
                  name: credential_reference
                  type: varchar(128)
              - column:
                  name: activity_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: policy_version
                  type: text
              - column:
                  name: reason
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: credential_deletion_tombstones
            columnNames: workspace_id, connection_id
            constraintName: pk_credential_deletion_tombstones
        - createIndex:
            tableName: credential_deletion_tombstones
            indexName: idx_credential_deletion_tombstones_workspace
            columns:
              - column:
                  name: workspace_id
        - createIndex:
            tableName: credential_deletion_tombstones
            indexName: idx_credential_deletion_tombstones_deleted_at
            columns:
              - column:
                  name: deleted_at
      rollback:
        - dropTable:
            tableName: credential_deletion_tombstones

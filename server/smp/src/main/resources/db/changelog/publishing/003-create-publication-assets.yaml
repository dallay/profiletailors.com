databaseChangeLog:
  - changeSet:
      id: publishing-003-create-publication-assets
      author: opencode
      changes:
        - createTable:
            tableName: publication_assets
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_publication_assets_workspace
                    references: workspaces(id)
              - column:
                  name: source_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: media_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: varchar(255)
              - column:
                  name: external_url
                  type: varchar(2048)
              - column:
                  name: original_filename
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_by_principal_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_publication_assets_principal
                    references: principals(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

databaseChangeLog:
  # ── 1. Create workspace_file_blobs table ──────────────────────────
  - changeSet:
      id: media-002-create-workspace-file-blobs
      author: sdd-apply
      changes:
        - createTable:
            tableName: workspace_file_blobs
            columns:
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: file_hash
                  type: char(64)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: varchar(255)
              - column:
                  name: file_size_bytes
                  type: bigint
              - column:
                  name: detected_media_type
                  type: varchar(64)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: 'UPLOADING'
                  constraints:
                    nullable: false
              - column:
                  name: failure_reason
                  type: text
              - column:
                  name: orphaned_at
                  type: timestamp with time zone
              - column:
                  name: gc_failure_count
                  type: integer
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_gc_attempt_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
            constraints:
              primaryKey:
                columnNames: workspace_id, file_hash
                name: pk_workspace_file_blobs
              foreignKeyName: fk_workspace_file_blobs_workspace
              foreignKeyTableName: workspace_file_blobs
              foreignKeyColumns: workspace_id
              references: workspaces(id)
            uniqueConstraints:
              - name: uk_workspace_file_blobs
                columnNames: workspace_id, file_hash

  - changeSet:
      id: media-002-workspace-file-blobs-primary-key
      author: sdd-apply
      changes:
        - addPrimaryKey:
            tableName: workspace_file_blobs
            columnNames: workspace_id, file_hash
            constraintName: pk_workspace_file_blobs

  # ── 2. workspace_file_blobs indexes ────────────────────────────────
  - changeSet:
      id: media-002-blob-status-index
      author: sdd-apply
      changes:
        - createIndex:
            tableName: workspace_file_blobs
            indexName: idx_blobs_status
            columns:
              - column:
                  name: workspace_id
              - column:
                  name: status

  - changeSet:
      id: media-002-blob-gc-candidates-index
      author: sdd-apply
      dbms: postgresql
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_blobs_gc_candidates
              ON workspace_file_blobs (orphaned_at)
              WHERE status = 'READY_FOR_GC'

  - changeSet:
      id: media-002-blob-gc-candidates-index-h2
      author: sdd-apply
      dbms: h2
      changes:
        - createIndex:
            tableName: workspace_file_blobs
            indexName: idx_blobs_gc_candidates
            columns:
              - column:
                  name: status
              - column:
                  name: orphaned_at

  # ── 2b. PostgreSQL-native blob constraints ──────────────────────
  - changeSet:
      id: media-002-blob-status-check
      author: sdd-apply
      dbms: postgresql
      changes:
        - sql:
            sql: >
              ALTER TABLE workspace_file_blobs
              ADD CONSTRAINT chk_workspace_file_blobs_status
              CHECK (status IN ('UPLOADING', 'READY', 'READY_FOR_GC', 'GARBAGE_COLLECTED', 'FAILED'))
        - sql:
            sql: >
              ALTER TABLE workspace_file_blobs
              ADD CONSTRAINT chk_workspace_file_blobs_hash_length
              CHECK (file_hash ~ '^[a-f0-9]{64}$')

  # ── 2c. PostgreSQL-native READY metadata constraints ────────────
  - changeSet:
      id: media-002-blob-ready-metadata-checks
      author: sdd-apply
      dbms: postgresql
      changes:
        - sql:
            sql: >
              ALTER TABLE workspace_file_blobs
              ADD CONSTRAINT chk_workspace_file_blobs_storage_when_ready
              CHECK (status != 'READY' OR storage_key IS NOT NULL)
        - sql:
            sql: >
              ALTER TABLE workspace_file_blobs
              ADD CONSTRAINT chk_workspace_file_blobs_detected_type_when_ready
              CHECK (status != 'READY' OR detected_media_type IS NOT NULL)
        - sql:
            sql: >
              ALTER TABLE workspace_file_blobs
              ADD CONSTRAINT chk_workspace_file_blobs_size_when_ready
              CHECK (status != 'READY' OR file_size_bytes IS NOT NULL)

  # ── 3. media_assets: add new columns ────────────────────────────
  # NOTE: upload_started_at, file_size_bytes already exist in media-001.
  # CRITICAL: file_hash must be nullable here. Adding NOT NULL would fail on existing rows
  # in production databases. Domain layer enforces non-null at PUT time for new assets.
  # A PostgreSQL CHECK constraint validates the SHA-256 format for non-NULL values.
  - changeSet:
      id: media-002-add-file-hash-and-related-columns
      author: sdd-apply
      changes:
        - addColumn:
            tableName: media_assets
            columns:
              - column:
                  name: file_hash
                  type: char(64)
              - column:
                  name: detected_media_type
                  type: varchar(64)
              - column:
                  name: failure_reason
                  type: text
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP

  # ── 4. indexes and constraints for media_assets ───────────────
  - changeSet:
      id: media-002-make-media-assets-storage-key-nullable
      author: sdd-apply
      changes:
        - dropNotNullConstraint:
            tableName: media_assets
            columnName: storage_key
            columnDataType: varchar(255)

  - changeSet:
      id: media-002-media-assets-status-and-storage-checks
      author: sdd-apply
      dbms: postgresql
      changes:
        - sql:
            sql: >
              ALTER TABLE media_assets
              ADD CONSTRAINT chk_media_assets_status
              CHECK (status IN ('PENDING_UPLOAD', 'UPLOADING', 'READY', 'FAILED', 'DELETED'))
        - sql:
            sql: >
              ALTER TABLE media_assets
              ADD CONSTRAINT chk_media_assets_storage_invariant
              CHECK ((status = 'READY' AND storage_key IS NOT NULL) OR (status != 'READY' AND storage_key IS NULL))

  - changeSet:
      id: media-002-asset-file-hash-index
      author: sdd-apply
      changes:
        - createIndex:
            tableName: media_assets
            indexName: idx_media_assets_file_hash
            columns:
              - column:
                  name: file_hash

  - changeSet:
      id: media-002-media-assets-workspace-blob-fk
      author: sdd-apply
      dbms: postgresql
      changes:
        - addForeignKeyConstraint:
            baseTableName: media_assets
            baseColumnNames: workspace_id, file_hash
            constraintName: fk_media_assets_workspace_file_blob
            referencedTableName: workspace_file_blobs
            referencedColumnNames: workspace_id, file_hash
            onDelete: RESTRICT

  - changeSet:
      id: media-002-media-assets-file-hash-check
      author: sdd-apply
      dbms: postgresql
      changes:
        - sql:
            sql: >
              ALTER TABLE media_assets
              ADD CONSTRAINT chk_media_assets_file_hash_length
              CHECK (file_hash IS NULL OR file_hash ~ '^[a-f0-9]{64}$')

databaseChangeLog:
  - changeSet:
      id: media-001-create-media-assets
      author: sdd-apply
      changes:
        - createTable:
            tableName: media_assets
            columns:
              - column:
                  name: asset_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_media_assets_workspace
                    references: workspaces(id)
              - column:
                  name: source_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: media_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: original_filename
                  type: varchar(255)
              - column:
                  name: file_size_bytes
                  type: bigint
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: upload_started_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
            indexes:
              - index:
                  name: idx_media_assets_workspace_created
                  columns:
                    - column:
                        name: workspace_id
                        descending:
                          - true
                    - column:
                        name: created_at
                        descending:
                          - true
              - index:
                  name: idx_media_assets_workspace_status
                  columns:
                    - column:
                        name: workspace_id
                    - column:
                        name: status
              - index:
                  name: idx_media_assets_status_upload_started
                  columns:
                    - column:
                        name: status
                    - column:
                        name: upload_started_at
              - index:
                  name: idx_media_assets_created_at
                  columns:
                    - column:
                        name: created_at

  - changeSet:
      id: media-001-create-workspace-upload-slots
      author: sdd-apply
      changes:
        - createTable:
            tableName: workspace_upload_slots
            columns:
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_workspace_upload_slots_workspace
                    references: workspaces(id)
              - column:
                  name: active_uploads
                  type: integer
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
            indexes:
              - index:
                  name: idx_workspace_upload_slots_active
                  columns:
                    - column:
                        name: workspace_id
                    - column:
                        name: active_uploads

  - changeSet:
      id: media-001-create-media-rate-limits
      author: sdd-apply
      changes:
        - createTable:
            tableName: media_rate_limits
            columns:
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_media_rate_limits_workspace
                    references: workspaces(id)
              - column:
                  name: hourly_creation_count
                  type: integer
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: hour_bucket
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

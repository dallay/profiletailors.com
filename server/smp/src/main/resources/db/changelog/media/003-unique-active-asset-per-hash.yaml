databaseChangeLog:
  # ── 1. Partial UNIQUE index on (workspace_id, file_hash) for active assets ──
  # Rationale: prevents the user-visible "duplicate images in media library" bug where
  # a second upload of the same file would create a NEW media_assets row pointing at
  # the SAME workspace_file_blobs row. The application handler now collapses dedup
  # hits onto the existing assetId, and this constraint is the DB-level safety net
  # against future regressions and races.
  #
  # The index is PARTIAL: it covers only rows whose status is NOT IN ('DELETED', 'FAILED').
  # This preserves the legitimate "multiple FAILED retry attempts" workflow and keeps
  # soft-deleted history from blocking re-upload after a previous asset was deleted.
  - changeSet:
      id: media-003-unique-active-asset-per-hash
      author: sdd-apply
      dbms: postgresql
      runInTransaction: false
      changes:
        - sql:
            sql: |
              -- Collapse duplicate active rows before building the unique index
              -- so the CREATE UNIQUE INDEX CONCURRENTLY does not fail on conflicts.
              -- Keeps the canonical row per (workspace_id, file_hash) preferring READY
              -- status, then earliest created_at, then earliest asset_id.
              WITH ranked AS (
                  SELECT asset_id,
                         ROW_NUMBER() OVER (
                             PARTITION BY workspace_id, file_hash
                             ORDER BY
                                 CASE WHEN status = 'READY' THEN 0 ELSE 1 END,
                                 created_at ASC,
                                 asset_id ASC
                         ) AS rn
                  FROM media_assets
                  WHERE status NOT IN ('DELETED', 'FAILED')
              )
              UPDATE media_assets
              SET status = 'DELETED',
                  storage_key = NULL
              WHERE asset_id IN (SELECT asset_id FROM ranked WHERE rn > 1)
        - sql:
            sql: >
              CREATE UNIQUE INDEX CONCURRENTLY uq_media_assets_active_per_hash
              ON media_assets (workspace_id, file_hash)
              WHERE status NOT IN ('DELETED', 'FAILED')
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS uq_media_assets_active_per_hash

  # ── 2. H2 variant is intentionally omitted ──
  # H2 does not support partial unique indexes (WHERE clause on CREATE UNIQUE INDEX).
  # Handler-level dedup in PutAssetHandler + the existing tests cover this on H2.
  # The DB-level safety net runs only on Postgres (and in @Tag("postgres") tests
  # via Testcontainers).
databaseChangeLog:
  - changeSet:
      id: platform-admin-003-create-platform-admin-audit-events
      author: platform-admin
      changes:
        - createTable:
            tableName: platform_admin_audit_events
            columns:
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: operator_principal_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: operator_platform_roles
                  type: text[]
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: result
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: varchar(1024)
              - column:
                  name: correlation_id
                  type: varchar(128)
              - column:
                  name: request_id
                  type: varchar(128)
              - column:
                  name: source_ip_hash
                  type: varchar(255)
              - column:
                  name: user_agent_summary
                  type: varchar(512)
        - createIndex:
            tableName: platform_admin_audit_events
            indexName: idx_platform_admin_audit_occurred_at
            columns:
              - column:
                  name: occurred_at
                  descending: true
        - createIndex:
            tableName: platform_admin_audit_events
            indexName: idx_platform_admin_audit_operator
            columns:
              - column:
                  name: operator_principal_id

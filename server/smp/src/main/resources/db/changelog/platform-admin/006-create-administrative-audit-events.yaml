databaseChangeLog:
  - changeSet:
      id: platform-admin-006-create-administrative-audit-events
      author: administrative
      changes:
        - createTable:
            tableName: administrative_audit_events
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: actor_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: actor_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: correlation_id
                  type: varchar(255)
              - column:
                  name: metadata
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - sql:
            sql: >
              CREATE INDEX idx_administrative_audit_events_actor
              ON administrative_audit_events (actor_id, occurred_at DESC);
        - sql:
            sql: >
              CREATE INDEX idx_administrative_audit_events_target
              ON administrative_audit_events (target_type, target_id, occurred_at DESC);
        - sql:
            sql: >
              CREATE INDEX idx_administrative_audit_events_correlation
              ON administrative_audit_events (correlation_id)
              WHERE correlation_id IS NOT NULL;
        - sql:
            sql: >
              CREATE INDEX idx_administrative_audit_events_occurred_at
              ON administrative_audit_events (occurred_at DESC);

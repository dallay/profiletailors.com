databaseChangeLog:
  - changeSet:
      id: platform-admin-001-create-platform-role-assignments
      author: platform-admin
      changes:
        - createTable:
            tableName: platform_role_assignments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: principal_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: assigned_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: assigned_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamp with time zone
              - column:
                  name: revoked_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: platform_role_assignments
            baseColumnNames: principal_id
            referencedTableName: principals
            referencedColumnNames: id
            constraintName: fk_platform_role_assignments_principal
        - addForeignKeyConstraint:
            baseTableName: platform_role_assignments
            baseColumnNames: assigned_by
            referencedTableName: principals
            referencedColumnNames: id
            constraintName: fk_platform_role_assignments_assigned_by
        - addForeignKeyConstraint:
            baseTableName: platform_role_assignments
            baseColumnNames: revoked_by
            referencedTableName: principals
            referencedColumnNames: id
            constraintName: fk_platform_role_assignments_revoked_by
        - createIndex:
            tableName: platform_role_assignments
            indexName: idx_platform_role_assignments_principal_active
            columns:
              - column:
                  name: principal_id
              - column:
                  name: revoked_at
        - sql:
            sql: |
              CREATE UNIQUE INDEX idx_platform_role_assignments_active_unique
              ON platform_role_assignments (principal_id, role)
              WHERE revoked_at IS NULL

databaseChangeLog:
  - changeSet:
      id: governance-001-create-audit-events
      author: opencode
      changes:
        - createTable:
            tableName: audit_events
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(128)
              - column:
                  name: request_name
                  type: varchar(255)
              - column:
                  name: request_path
                  type: varchar(255)
              - column:
                  name: permission
                  type: varchar(128)
              - column:
                  name: actor_principal_id
                  type: varchar(64)
              - column:
                  name: workspace_id
                  type: varchar(64)
              - column:
                  name: target_type
                  type: varchar(64)
              - column:
                  name: target_id
                  type: varchar(128)
              - column:
                  name: outcome
                  type: varchar(32)
              - column:
                  name: reason_code
                  type: varchar(64)
              - column:
                  name: role_keys_json
                  type: text
              - column:
                  name: details_json
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: audit_events
            indexName: idx_audit_events_workspace_created_at
            columns:
              - column:
                  name: workspace_id
              - column:
                  name: created_at
        - createIndex:
            tableName: audit_events
            indexName: idx_audit_events_actor_created_at
            columns:
              - column:
                  name: actor_principal_id
              - column:
                  name: created_at

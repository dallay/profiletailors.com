databaseChangeLog:
  - changeSet:
      id: identity-004-add-email-verification
      author: opencode
      changes:
        - addColumn:
            tableName: user_identities
            columns:
              - column:
                  name: email_status
                  type: varchar(16)
                  defaultValue: UNVERIFIED
                  constraints:
                    nullable: false
        - createTable:
            tableName: email_verification_tokens
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamp with time zone
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: email_verification_tokens
            columnNames: token_hash
            constraintName: uq_email_verification_tokens_hash
        - createIndex:
            indexName: idx_email_verification_tokens_email
            tableName: email_verification_tokens
            columns:
              - column:
                  name: email
        - sql:
            sql: UPDATE user_identities SET email_status = 'VERIFIED'

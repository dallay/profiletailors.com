databaseChangeLog:
  - changeSet:
      id: identity-003-create-local-password-credentials
      author: acosta
      changes:
        - createTable:
            tableName: local_password_credentials
            columns:
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_local_password_credentials_principal
                    references: principals(id)
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_algorithm
                  type: varchar(32)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

- changeSet:
      id: identity-003-add-password-algorithm-check
      author: opencode
      changes:
        - addCheckConstraint:
            constraintName: ck_lpc_password_algorithm
            tableName: local_password_credentials
            condition: "password_algorithm IS NULL OR password_algorithm IN ('bcrypt', 'argon2id')"

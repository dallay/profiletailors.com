databaseChangeLog:
  - changeSet:
      id: identity-003-create-local-password-credentials
      author: opencode
      changes:
        - createTable:
            tableName: local_password_credentials
            columns:
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_local_password_credentials_principal
                    references: principals(id)
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

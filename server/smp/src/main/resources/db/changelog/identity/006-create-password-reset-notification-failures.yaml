databaseChangeLog:
  - changeSet:
      id: identity-006-create-password-reset-notification-failures
      author: opencode
      changes:
        - createTable:
            tableName: password_reset_notification_failures
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: notification_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: failed_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: failure_category
                  type: varchar(64)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: password_reset_notification_failures
            baseColumnNames: principal_id
            constraintName: fk_password_reset_notification_failure_principal
            referencedTableName: user_identities
            referencedColumnNames: principal_id
            onDelete: CASCADE
        - createIndex:
            tableName: password_reset_notification_failures
            indexName: idx_password_reset_notification_failures_principal_time
            columns:
              - column:
                  name: principal_id
              - column:
                  name: failed_at
      rollback:
        - dropTable:
            tableName: password_reset_notification_failures

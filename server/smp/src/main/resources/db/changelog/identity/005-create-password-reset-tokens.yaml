databaseChangeLog:
  - changeSet:
      id: identity-005-create-password-reset-tokens
      author: opencode
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: requested_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamp with time zone
              - column:
                  name: request_ip_hash
                  type: varchar(128)
              - column:
                  name: user_agent_hash
                  type: varchar(128)
        - addUniqueConstraint:
            tableName: password_reset_tokens
            columnNames: token_hash
            constraintName: uq_password_reset_tokens_hash
        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: principal_id
            constraintName: fk_password_reset_principal
            referencedTableName: user_identities
            referencedColumnNames: principal_id
            onDelete: CASCADE
        - sql: |
            CREATE INDEX IF NOT EXISTS idx_password_reset_principal_active
            ON password_reset_tokens (principal_id, expires_at)
            WHERE used_at IS NULL;
      rollback:
        - dropTable:
            tableName: password_reset_tokens

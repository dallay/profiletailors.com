databaseChangeLog:
  - changeSet:
      id: identity-002-create-user-identities
      author: acosta
      changes:
        - createTable:
            tableName: user_identities
            columns:
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_identities_principal
                    references: principals(id)
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: username
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user_identities
            columnNames: email
            constraintName: uq_user_identities_email

databaseChangeLog:
  - changeSet:
      id: authorization-007-create-workspace-target-scopes
      author: acosta
      changes:
        - createTable:
            tableName: workspace_target_scopes
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workspace_target_scopes_workspace
                    references: workspaces(id)
              - column:
                  name: principal_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workspace_target_scopes_principal
                    references: principals(id)
              - column:
                  name: principal_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workspace_target_scopes_permission
                    references: permissions(id)
              - column:
                  name: target_resource_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: allowed_target_ids_json
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: workspace_target_scopes
            columnNames: workspace_id, principal_id, principal_type, permission_id, target_resource_type
            constraintName: uq_workspace_target_scopes_workspace_principal_permission_target
        - createIndex:
            tableName: workspace_target_scopes
            indexName: idx_workspace_target_scopes_lookup
            columns:
              - column:
                  name: workspace_id
              - column:
                  name: principal_id
              - column:
                  name: principal_type
              - column:
                  name: target_resource_type

databaseChangeLog:
  - changeSet:
      id: authorization-006-create-workspace-entitlements
      author: opencode
      changes:
        - createTable:
            tableName: workspace_entitlements
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workspace_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workspace_entitlements_workspace
                    references: workspaces(id)
              - column:
                  name: entitlement_key
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: workspace_entitlements
            columnNames: workspace_id, entitlement_key
            constraintName: uq_workspace_entitlements_workspace_key
        - createIndex:
            tableName: workspace_entitlements
            indexName: idx_workspace_entitlements_workspace
            columns:
              - column:
                  name: workspace_id

databaseChangeLog:
  - changeSet:
      id: authorization-003-create-role-permissions
      author: acosta
      changes:
        - createTable:
            tableName: role_permissions
            columns:
              - column:
                  name: role_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_permissions_role
                    references: roles(id)
              - column:
                  name: permission_id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_permissions_permission
                    references: permissions(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: role_permissions
            columnNames: role_id, permission_id
            constraintName: pk_role_permissions

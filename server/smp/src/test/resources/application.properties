# Default test configuration
# This file is automatically loaded for all tests

# Publishing credentials encryption key for tests (32-byte base64)
publishing.credentials.encryption.key=dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwMTI=

# Media preview signing secret for tests
media.preview-signing-secret=test-media-preview-signing-secret

# Storage — local filesystem for tests (avoids requiring cloud credentials in CI/dev)
platform.storage.default=local
platform.storage.providers.local.type=local
platform.storage.providers.local.base-path=/tmp/smp-test-storage

# Local JWT signing secret for tests. Long-lived and clearly labelled as test-only;
# real secrets must be set via SMP_LOCAL_JWT_SECRET in the runtime environment.
app.security.local-jwt.secret=test-local-jwt-signing-secret-32+bytes-1234567890

# LinkedIn OAuth state signing secret for tests — safe placeholder that passes the
# HmacOAuthStateSigner guard (does not start with CHANGE_ME / changeme / test-).
publishing.linkedin.state-signing-secret=smp-integration-test-oauth-state-signing-secret

# Disable auth rate limiter in tests — all HTTP requests share one IP (127.0.0.1)
# in WebTestClient, so the 20-request/60s window would be exhausted by the first
# few feature files and cause 429 failures in subsequent scenarios.
app.security.auth-rate-limit.enabled=true

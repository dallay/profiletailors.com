# Default test configuration
# This file is automatically loaded for all tests

# Publishing credentials encryption key for tests (32-byte base64)
publishing.credentials.encryption.key=dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwMTI=

# Media preview signing secret for tests
media.preview-signing-secret=test-media-preview-signing-secret

# Storage — local filesystem for tests (avoids requiring cloud credentials in CI/dev)
platform.storage.default=local
platform.storage.providers.local.type=local
platform.storage.providers.local.base-path=/tmp/smp-test-storage
